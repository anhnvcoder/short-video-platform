# Vulnerabilities trivy leaves out of every scan: the lockfile of web/ and the seven images. Each entry names the exact
# package and version (purls), so the same CVE in any other package or version is still reported, and expires within
# 30 days, when it is checked again for a fix (deploy/ci/scan-gate.sh --check-ignorefile enforces the rules).
#
# All of these come only through @lhci/cli 0.15.1, the dev dependency of make web-lighthouse; none reaches the web
# image. @lhci/cli 0.15.1 is its latest release and pins lighthouse 12.6.1 (puppeteer-core 24.43.1, which pins
# chromium-bidi 14.0.0 and @puppeteer/browsers 2.13.2). A run of lhci collect, upload and assert loads none of these
# packages.
vulnerabilities:
  - id: CVE-2026-19693
    statement: No fixed release of extract-zip exists. Only @puppeteer/browsers install() calls it, to unpack a browser it downloads, and make web-lighthouse never downloads one (it runs the Chromium of Playwright).
    expired_at: 2026-11-24
    purls:
      - pkg:npm/extract-zip@2.0.1
  - id: CVE-2026-56876
    statement: No fixed release of extract-zip exists. Only @puppeteer/browsers install() calls it, to unpack a browser it downloads, and make web-lighthouse never downloads one (it runs the Chromium of Playwright).
    expired_at: 2026-11-24
    purls:
      - pkg:npm/extract-zip@2.0.1
  - id: CVE-2026-102990
    statement: Fixed only in basic-ftp 6, and get-uri (latest 8.0.1 too) asks for ^5.3.1. It is reached only through a PAC proxy script fetched over ftp, which nothing configures for make web-lighthouse, and the listing it parses would come from that FTP server.
    expired_at: 2026-11-24
    purls:
      - pkg:npm/basic-ftp@5.3.1
  - id: CVE-2023-54404
    statement: Fixed only in zod 4, a new API that chromium-bidi 14.0.0 (written for zod 3) was not built against. puppeteer-core loads chromium-bidi only for WebDriver BiDi, and Lighthouse drives Chrome over CDP, so its validation never runs; the input would be the local browser's own protocol messages.
    expired_at: 2026-11-24
    purls:
      - pkg:npm/zod@3.25.76
