# Vulnerabilities trivy and grype leave out of every scan: trivy on every image this repository builds or rescans,
# grype on the SBOM of each image it builds (and make grype). Each entry names the exact package and version (purls),
# so the same CVE in any other package or version is still reported, and expires within 30 days, when it is checked
# again for a fix (deploy/ci/scan-gate.sh --check-ignorefile enforces the rules in the config job). The grype gate is
# stricter: from the day of an entry's expired_at it fails every image leg, even with nothing left to cover, so renew
# or remove the entry before that day.
#
# The glib entry is for the media-worker image: ffmpeg links libavfilter (the worker's scale and split filters), which
# links harfbuzz, which links libglib-2.0, so apk cannot install ffmpeg without glib.
vulnerabilities:
  - id: CVE-2026-58016
    statement: No fixed glib exists in Alpine 3.24 or edge (the upstream fix is in 2.89.0). The flaw is in g_dbus_node_info_new_for_xml() of libgio, the parser of D-Bus introspection XML. The media-worker image carries glib only because harfbuzz links libglib-2.0, and nothing ffmpeg or ffprobe loads links libgio; the worker runs only those two, and its container has no D-Bus.
    expired_at: 2026-11-29
    purls:
      - pkg:apk/alpine/glib@2.88.1-r1
