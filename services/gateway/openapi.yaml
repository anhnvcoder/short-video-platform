# REST API of the gateway, written by hand: generating it from code would need an annotation
# library or a framework.
# Keep it in step with services/gateway/internal/api.
openapi: 3.1.0
info:
  title: Short-video platform API
  version: 0.1.0
  description: |
    JSON fields are snake_case and times are RFC 3339 in UTC.

    Every error is an RFC 9457 problem (`application/problem+json`, docs/architecture.md §8.4):
    `code` is the service's reason (for example `VIDEO_NOT_FOUND`) or the gRPC code name, and
    `detail` is the service's message. 5xx responses never carry the service's message: `detail`
    is empty, `code` is the gRPC code name, and `trace_id` points to the logs.
    Errors the gateway raises itself carry its own `code`: for example `INVALID_TOKEN`,
    `NOT_FOUND` for an unknown path, `METHOD_NOT_ALLOWED` (with an `Allow` header) and
    `INVALID_UTF8`, a 400 for any request whose path or query string, once percent-decoded, is
    not valid UTF-8.

    Every route but `/healthz` and `/readyz` is rate limited, to slow down password guessing, mass
    sign-ups and junk writes: `/auth/register` and `/auth/login` by the client's address,
    `/auth/login` also by the address and email together, `/auth/refresh` and `/auth/logout` by
    the client's address in one shared bucket of 60 a minute with bursts of 30,
    `/public/videos/{video_id}` by the client's address, 120 a minute with bursts of 60, the other
    routes by the authenticated user. Every call counts, successful or not. Over the limit the
    answer is a 429 with code `RATE_LIMITED` and a `Retry-After` header in seconds.

    Items of the feeds and of the video lists, and the videos of `GET /videos/{video_id}` and
    `GET /public/videos/{video_id}`, carry an optional `author` and `stats`: the gateway reads
    them with one call each per page, side by side, within 100 ms. Either is absent (not empty)
    when its service does not answer in time; the rest of the answer is served anyway.
servers:
  - url: http://127.0.0.1:8080
security: []

paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account
      description: |
        `handle` and `display_name` are optional, so older clients keep working: without a handle
        the account gets a generated one (`u_` and 12 hex digits), and the display name defaults
        to the handle. Read them back with `GET /me`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id]
                properties:
                  user_id:
                    $ref: "#/components/schemas/Id"
        "400":
          description: |
            A body that is not one JSON object with known, non-null fields (`INVALID_JSON`), or an
            invalid `email` (`INVALID_EMAIL`), `password` (`INVALID_PASSWORD`), `handle`
            (`INVALID_HANDLE`) or `display_name` (`INVALID_DISPLAY_NAME`), checked in that order.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            The email is already registered (`EMAIL_ALREADY_REGISTERED`), or the handle is taken
            (`HANDLE_ALREADY_TAKEN`). When both are, either code may come back.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /auth/login:
    post:
      operationId: login
      summary: Exchange email and password for an access token and a refresh token
      description: |
        Every login starts a new refresh token family: logging in on another device does not end
        the sessions of the first. Before `expires_at`, exchange `refresh_token` for new tokens with
        `POST /auth/refresh`. An unknown email and a wrong password get the same 401 with code
        `INVALID_CREDENTIALS`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unknown email or wrong password (`INVALID_CREDENTIALS`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a refresh token for a new access token and a new refresh token
      description: |
        No Bearer token is needed: the refresh token is the credential. The presented refresh
        token is used up and replaced by the one in the answer (rotation). Presenting a used
        token again revokes its whole family, the newest token included, since either the client
        or someone who stole the token is replaying it. So send one refresh at a time per token,
        and do not retry a call whose answer was lost: log in again instead. Every token that
        cannot be used (malformed, unknown, expired, revoked or already used, a missing or empty
        `refresh_token` included) gets the same 401 with code `INVALID_REFRESH_TOKEN`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New tokens; the presented refresh token no longer works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The refresh token cannot be used (`INVALID_REFRESH_TOKEN`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh token family of a login
      description: |
        No Bearer token is needed. Revokes every refresh token of the login that issued
        `refresh_token`; access tokens already issued stay valid until their `expires_at`.
        Idempotent: an unknown, malformed, expired or already revoked token also gets 204, so the
        answer does not tell which tokens exist.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: The token's family is revoked, or there was nothing to revoke.
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /me/following/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        description: The user to follow or unfollow. user-service validates it.
        schema:
          $ref: "#/components/schemas/Id"
    put:
      operationId: follow
      summary: Follow a user
      description: Idempotent. Following yourself is a 400 (`CANNOT_FOLLOW_SELF`).
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The caller follows the user.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such user (`USER_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    delete:
      operationId: unfollow
      summary: Unfollow a user
      description: Idempotent; unfollowing a user not followed also succeeds.
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The caller does not follow the user.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /me:
    get:
      operationId: getMe
      summary: The caller's own profile
      description: The profile of the account in the access token; it never holds the email.
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The caller's account no longer exists (`USER_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    patch:
      operationId: updateMe
      summary: Change the caller's display name
      description: |
        Only `display_name` can change; the handle never does. Idempotent: sending the same name
        again changes nothing. A missing or empty `display_name` is a 400 like any other invalid
        one. Answers with the profile as it is after the change.
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The caller's profile with the new display name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: |
            A body that is not one JSON object with known, non-null fields (`INVALID_JSON`), or a
            `display_name` that breaks its rules (`INVALID_DISPLAY_NAME`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The caller's account no longer exists (`USER_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /me/videos:
    get:
      operationId: listMyVideos
      summary: The caller's own videos, in every status
      description: |
        Every video of the caller, UPLOADING, PROCESSING and FAILED ones included, newest first by
        creation time. The same as `GET /users/{user_id}/videos` with the caller's id. See
        `VideoPage` for paging.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of videos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          $ref: "#/components/responses/FeedBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /profiles/{handle}:
    get:
      operationId: getProfile
      summary: A user's profile by handle
      description: |
        The handle is matched ignoring the case of ASCII letters and surrounding white space. A
        value that cannot be a handle is a 404 like an unknown one.
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
          examples:
            handle:
              value: minhanh
      responses:
        "200":
          description: The profile, with whether the caller follows that user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No user has this handle (`USER_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /users/{user_id}/videos:
    get:
      operationId: listUserVideos
      summary: A user's videos
      description: |
        Newest first by creation time. Only READY videos, unless `user_id` is the caller's own: then
        every status, as in `GET /me/videos`. An id with no user gives an empty page, not a 404:
        find users with `GET /profiles/{handle}`. See `VideoPage` for paging.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: The author. video-service validates it.
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of videos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "400":
          description: |
            `user_id` is not a UUID (`INVALID_AUTHOR_ID`), `page_size` is not an integer or is
            negative (`INVALID_PAGE_SIZE`), the path or query is not valid UTF-8 (`INVALID_UTF8`),
            or `cursor` cannot be decoded (`INVALID_PAGE_TOKEN`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /public/videos/{video_id}:
    get:
      operationId: getPublicVideo
      summary: A READY video, without logging in
      description: |
        For the public share page. Needs no Bearer token and ignores the `Authorization` header,
        a wrong token included: the answer is the same for everyone, so it has no `liked_by_me`.
        Rate limited by the client's address before any service is called. A video that is not
        READY, an unknown id and an id that is not a UUID all get the same 404, so nothing tells
        an unpublished video from a missing one.
      tags: [videos]
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: The video. Cacheable by shared caches for 30 seconds.
          headers:
            Cache-Control:
              schema:
                type: string
                const: public, max-age=30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVideo"
        "400":
          description: The path is not valid UTF-8 (`INVALID_UTF8`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: |
            No such video, not READY, or not a valid id (`VIDEO_NOT_FOUND`). Never stored by a
            cache: the video may become READY a minute later.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Over the rate limit of the client's address (`RATE_LIMITED`).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Internal error; `detail` is empty.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: video-service is unavailable (`UNAVAILABLE`).
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "504":
          description: video-service did not answer within 3 seconds (`DEADLINE_EXCEEDED`).
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /videos:
    post:
      operationId: initUpload
      summary: Create a video in UPLOADING
      description: |
        Not idempotent: each call creates a video. The response carries a presigned POST: send a
        `multipart/form-data` request to `upload_url` with every entry of `form_fields` first and the
        file as the last field, before `expires_at`, then call `POST /videos/{video_id}/complete`.
        `upload_url` and `form_fields` are a short-lived credential: do not log or share them.
      tags: [videos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, size_bytes, content_type]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                size_bytes:
                  description: Exact size of the file to upload, at most 500 MiB.
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 524288000
                content_type:
                  description: A concrete video media type (`video/<subtype>`, no wildcard), for example `video/mp4`.
                  type: string
                  examples: [video/mp4]
      responses:
        "201":
          description: Video created.
          headers:
            Location:
              description: "`/videos/{video_id}` of the new video."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [video_id, upload_url, form_fields, expires_at]
                properties:
                  video_id:
                    $ref: "#/components/schemas/Id"
                  upload_url:
                    description: Absolute URL of the object storage endpoint to POST the form to.
                    type: string
                    format: uri
                  form_fields:
                    description: Form fields (key, policy, signature, ...) to send before the file field.
                    type: object
                    additionalProperties:
                      type: string
                  expires_at:
                    description: When the presigned POST stops being accepted.
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          description: |
            Over the rate limit (`RATE_LIMITED`, with `Retry-After`), or the caller already has 3
            videos in UPLOADING whose upload form has not expired (`TOO_MANY_UPLOADS`, no
            `Retry-After`): complete one of them, or wait until its form expires (15 minutes).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /videos/{video_id}:
    get:
      operationId: getVideo
      summary: Get one video
      description: |
        A video that is not READY is visible only to its author; to anyone else it is a 404. The
        answer carries `author` and `stats` (with `liked_by_me`) when their services answer within
        100 ms; anonymous readers use `GET /public/videos/{video_id}`.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: The video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such video, or hidden from the caller (`VIDEO_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /videos/{video_id}/complete:
    post:
      operationId: completeUpload
      summary: Confirm the upload and start processing
      description: |
        Takes no request body. Checks that the uploaded object exists with the declared size and
        content type, then moves the video to PROCESSING. Idempotent: calling it again on a video
        already PROCESSING or READY returns the current video. The answer is always 202 and the
        state is in the body's `status`; poll `GET /videos/{video_id}` until it is READY.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "202":
          description: The video in its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: |
            `video_id` is malformed (its reason), or the upload cannot be completed: the object is
            missing (`UPLOAD_NOT_FOUND`), does not match the declared size or content type
            (`UPLOAD_MISMATCH`) or the video is already FAILED (`VIDEO_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such video, or it belongs to another user (`VIDEO_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /videos/{video_id}/like:
    parameters:
      - name: video_id
        in: path
        required: true
        description: The video to like or unlike. engagement-service validates it but does not check that it exists.
        schema:
          $ref: "#/components/schemas/Id"
    put:
      operationId: like
      summary: Like a video
      description: |
        Idempotent: liking a video already liked succeeds and does not change `like_count`. The
        caller sees their own like at once in the feed's `stats`.
      tags: [engagement]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The caller likes the video.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    delete:
      operationId: unlike
      summary: Remove the caller's like of a video
      description: Idempotent; unliking a video not liked also succeeds.
      tags: [engagement]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The caller does not like the video.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /videos/{video_id}/views:
    post:
      operationId: recordView
      summary: Count one view of a video
      description: |
        Takes no request body. Not idempotent: every call is one view, but a caller's views of
        one video count at most once a minute: a repeat within 60 seconds of the counted view
        still gets 202 and is not counted. The view is queued and `view_count` catches up within
        about a minute. On 503 or 504 the view was not recorded and the client may retry; the
        retry counts.
      tags: [engagement]
      security:
        - bearerAuth: []
      parameters:
        - name: video_id
          in: path
          required: true
          description: engagement-service validates it but does not check that the video exists.
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "202":
          description: The view is queued; no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /feed/following:
    get:
      operationId: getFollowingFeed
      summary: Newest videos of the users the caller follows
      description: |
        READY videos of followed users from the last 30 days, newest first. See `FeedPage` for
        paging and for when `stats` is missing.
      tags: [feed]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of the feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        "400":
          $ref: "#/components/responses/FeedBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /feed/explore:
    get:
      operationId: getExploreFeed
      summary: Newest videos across the platform
      description: |
        Every READY video, newest first, the same list for every caller. See `FeedPage` for paging
        and for when `stats` is missing.
      tags: [feed]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of the feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        "400":
          $ref: "#/components/responses/FeedBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      description: 200 while the process serves HTTP; checks no dependency.
      tags: [ops]
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"

  /readyz:
    get:
      operationId: readyz
      summary: Readiness
      description: |
        Asks the gRPC health service of user-service, video-service and feed-service, within 1
        second. Any of them not SERVING or not reachable is a 503 with code `NOT_READY`.
        engagement-service is not checked: when it is down the feed is still served, without
        `stats`.
      tags: [ops]
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "503":
          description: A dependency is not ready (`NOT_READY`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from /auth/login, only in the Authorization header.

  headers:
    RetryAfter:
      description: Seconds to wait before the request would be allowed; at least 1.
      schema:
        type: integer
        minimum: 1
    NoStore:
      description: No cache may store the answer.
      schema:
        type: string
        const: no-store

  parameters:
    PageSize:
      name: page_size
      in: query
      required: false
      description: Items per page; absent or 0 means 10, above 50 means 50, negative is a 400.
      schema:
        type: integer
        format: int32
        minimum: 0
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        `next_cursor` of the previous page, passed back unchanged; absent for the first page. It is
        opaque: the gateway does not read it, and a cursor that cannot be decoded is a 400
        (`INVALID_PAGE_TOKEN`).
      schema:
        type: string
        maxLength: 64

  schemas:
    Id:
      description: UUIDv7 in canonical lowercase form.
      type: string
      format: uuid
      examples: [01928c6e-7b3a-7cde-8f01-23456789abcd]

    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    RegisterRequest:
      description: "`Credentials` plus an optional handle and display name."
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        handle:
          description: |
            Optional. Surrounding white space is trimmed and ASCII letters lowered first; the
            result must match `^[a-z][a-z0-9_]{2,29}$` and must not match `^u_[0-9a-f]{12}$`, the
            form of generated handles. Absent or empty once trimmed: the account gets a generated
            handle. It can never be changed afterwards.
          type: string
          examples: [minhanh]
        display_name:
          description: |
            Optional; absent or empty once trimmed means the handle. Same rules as
            `Profile.display_name`.
          type: string

    Handle:
      description: |
        Unique, lowercase and never changed. A generated handle is `u_` and 12 hex digits.
      type: string
      pattern: "^[a-z][a-z0-9_]{2,29}$"
      examples: [minhanh, u_23456789abcd]

    DisplayName:
      description: |
        1 to 50 characters (Unicode code points) once trimmed, valid UTF-8, without:
        - control characters (general category Cc: U+0000-U+001F, U+007F-U+009F);
        - the line and paragraph separators U+2028 and U+2029;
        - format characters (general category Cf), among them the bidirectional formatting
          characters (U+061C, U+200E, U+200F, U+202A-U+202E, U+2066-U+2069), the invisible
          U+200B, U+2060 and U+FEFF, and the tag characters (U+E0001, U+E0020-U+E007F);
        - the other default-ignorable code points (Unicode property
          Other_Default_Ignorable_Code_Point, such as the Hangul fillers U+115F, U+1160, U+3164,
          U+FFA0 and the combining grapheme joiner U+034F);
        - the blank Braille pattern U+2800.

        The zero width joiner U+200D and the variation selectors (Unicode property
        Variation_Selector: U+180B-U+180D, U+180F, U+FE00-U+FE0F, U+E0100-U+E01EF) are allowed,
        as emoji need them, but are not visible: the name must hold at least one character that is
        neither one of them nor white space. Not normalized by the server: send NFC. Text chosen by
        its user: display it as text, never as HTML.
      type: string
      minLength: 1
      maxLength: 50
      examples: [Minh Anh]

    Profile:
      description: What anyone may see of a user; never the email.
      type: object
      additionalProperties: false
      required: [user_id, handle, display_name]
      properties:
        user_id:
          $ref: "#/components/schemas/Id"
        handle:
          $ref: "#/components/schemas/Handle"
        display_name:
          $ref: "#/components/schemas/DisplayName"

    UserProfile:
      description: A profile as the caller sees it; field names and types match `Profile`.
      type: object
      additionalProperties: false
      required: [user_id, handle, display_name, followed_by_me]
      properties:
        user_id:
          $ref: "#/components/schemas/Id"
        handle:
          $ref: "#/components/schemas/Handle"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        followed_by_me:
          description: Whether the caller follows this user; false on the caller's own profile.
          type: boolean

    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          $ref: "#/components/schemas/DisplayName"

    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, refresh_token, refresh_expires_at]
      properties:
        access_token:
          description: JWT signed with Ed25519 (EdDSA), valid for 1 hour.
          type: string
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
        refresh_token:
          description: |
            Opaque token for `POST /auth/refresh` and `POST /auth/logout`, usable once. A
            credential: keep it out of logs and out of reach of page scripts.
          type: string
        refresh_expires_at:
          description: |
            When `refresh_token` stops working: 14 days after it was issued, and never later than
            30 days after the login.
          type: string
          format: date-time

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          description: |
            A missing or empty `refresh_token` is not a 400: it is answered like any other token
            that cannot be used (401 on refresh, 204 on logout).
          type: string

    Video:
      type: object
      additionalProperties: false
      required: [video_id, author_id, title, status, created_at]
      properties:
        video_id:
          $ref: "#/components/schemas/Id"
        author_id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        status:
          type: string
          enum: [UPLOADING, PROCESSING, READY, FAILED]
        created_at:
          type: string
          format: date-time
        duration_ms:
          description: Length of the transcoded video; present once READY.
          type: integer
          format: int64
        published_at:
          description: When the video became READY; present once READY.
          type: string
          format: date-time
        playlist_url:
          description: Absolute URL of the HLS master playlist; present once READY.
          type: string
          format: uri
        thumbnail_url:
          description: Absolute URL of the thumbnail; present once READY.
          type: string
          format: uri
        author:
          description: |
            The author's profile, in `GET /videos/{video_id}` and the video lists; absent from
            `POST /videos/{video_id}/complete`, and whenever user-service does not answer within
            100 ms or has no profile for `author_id`.
          $ref: "#/components/schemas/Profile"
        stats:
          description: |
            In `GET /videos/{video_id}` and the video lists, under the same rule as in the feed
            (see `VideoStats`); a video that is not READY has zero counters. Absent from
            `POST /videos/{video_id}/complete`.
          $ref: "#/components/schemas/VideoStats"

    VideoPage:
      description: |
        One page of a user's videos, newest first by (`created_at`, `video_id`): videos created or
        published while paging never shift later pages. Paging works as in `FeedPage`.
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          description: Empty (never null) when there is nothing more.
          type: array
          items:
            $ref: "#/components/schemas/Video"
        next_cursor:
          description: Pass it as `cursor` to get the next page; empty on the last page.
          type: string

    PublicVideo:
      description: |
        A READY video for anyone, without logging in; field names and types match `FeedItem`.
      type: object
      additionalProperties: false
      required: [video_id, author_id, title, duration_ms, playlist_url, thumbnail_url, published_at]
      properties:
        video_id:
          $ref: "#/components/schemas/Id"
        author_id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        duration_ms:
          type: integer
          format: int64
        playlist_url:
          description: Absolute URL of the HLS master playlist.
          type: string
          format: uri
        thumbnail_url:
          description: Absolute URL of the thumbnail.
          type: string
          format: uri
        published_at:
          description: When the video became READY.
          type: string
          format: date-time
        author:
          description: Absent when user-service does not answer within 100 ms.
          $ref: "#/components/schemas/Profile"
        stats:
          $ref: "#/components/schemas/PublicVideoStats"

    PublicVideoStats:
      description: |
        Counters of a public video, without `liked_by_me`: there is no caller. Absent (not zero)
        when engagement-service does not answer within 100 ms.
      type: object
      additionalProperties: false
      required: [view_count, like_count]
      properties:
        view_count:
          description: Total views; lags by up to about a minute.
          type: integer
          format: int64
        like_count:
          type: integer
          format: int64

    FeedPage:
      description: |
        One page of a feed. Items are newest first by (`published_at`, `video_id`), so videos
        published while paging never shift later pages.
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          description: Empty (never null) when there is nothing more.
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        next_cursor:
          description: Pass it as `cursor` to get the next page; empty on the last page.
          type: string

    FeedItem:
      description: A READY video in a feed; field names and types match `Video`.
      type: object
      additionalProperties: false
      required: [video_id, author_id, title, duration_ms, playlist_url, thumbnail_url, published_at]
      properties:
        video_id:
          $ref: "#/components/schemas/Id"
        author_id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        duration_ms:
          type: integer
          format: int64
        playlist_url:
          description: Absolute URL of the HLS master playlist.
          type: string
          format: uri
        thumbnail_url:
          description: Absolute URL of the thumbnail.
          type: string
          format: uri
        published_at:
          description: When the video became READY.
          type: string
          format: date-time
        author:
          description: |
            The author's profile; absent from every item of a page when user-service does not
            answer within 100 ms, and from an item whose author has no profile.
          $ref: "#/components/schemas/Profile"
        stats:
          $ref: "#/components/schemas/VideoStats"

    VideoStats:
      description: |
        Counters of a video and whether the caller likes it. Absent (not zero) from every item of
        a page when engagement-service does not answer within 100 ms; the feed is served anyway.
      type: object
      additionalProperties: false
      required: [view_count, like_count, liked_by_me]
      properties:
        view_count:
          description: Total views; lags by up to about a minute.
          type: integer
          format: int64
        like_count:
          type: integer
          format: int64
        liked_by_me:
          description: Whether the caller likes the video; reflects their own like at once.
          type: boolean

    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Problem:
      description: RFC 9457 problem details (docs/architecture.md §8.4).
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, trace_id]
      properties:
        type:
          type: string
          const: about:blank
        title:
          description: Standard name of the HTTP status.
          type: string
        status:
          type: integer
        detail:
          description: The service's message; empty for 5xx.
          type: string
        code:
          description: Machine-readable reason in UPPER_SNAKE_CASE, or the gRPC code name.
          type: string
          examples: [VIDEO_NOT_FOUND]
        trace_id:
          description: Trace id of the request, for looking up logs.
          type: string
          examples: [4bf92f3577b34da6a3ce929d0e0e4736]

  responses:
    StatusOK:
      description: OK.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    BadRequest:
      description: |
        Invalid request: a body that is not one JSON object with known, non-null fields
        (`INVALID_JSON`), a path or query that is not valid UTF-8 (`INVALID_UTF8`), or an argument the
        service rejects (its reason, for example `INVALID_TITLE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FeedBadRequest:
      description: |
        `page_size` is not an integer or is negative (`INVALID_PAGE_SIZE`), the query is not valid
        UTF-8 (`INVALID_UTF8`), or `cursor` cannot be decoded (`INVALID_PAGE_TOKEN`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: |
        Missing, malformed, expired or otherwise invalid access token (`INVALID_TOKEN`), with a
        `WWW-Authenticate: Bearer` header.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body larger than 64 KiB (`BODY_TOO_LARGE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: |
        Over the rate limit (`RATE_LIMITED`, with `Retry-After`), or the service is busy hashing
        passwords (`SERVER_BUSY`, no `Retry-After`); retry later.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Over the rate limit (`RATE_LIMITED`); retry after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal error; `detail` is empty.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The service is unavailable (`UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GatewayTimeout:
      description: The service did not answer within 3 seconds (`DEADLINE_EXCEEDED`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
