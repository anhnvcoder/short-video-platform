# REST API of the gateway, written by hand (docs/adr/0007-go-monorepo-toolchain-and-stage1-scope.md,
# section 8). Keep it in step with services/gateway/internal/api.
openapi: 3.1.0
info:
  title: Short-video platform API
  version: 0.1.0
  description: |
    JSON fields are snake_case and times are RFC 3339 in UTC.

    Every error is an RFC 9457 problem (`application/problem+json`, docs/architecture.md §8.4):
    `code` is the service's reason (for example `VIDEO_NOT_FOUND`) or the gRPC code name, and
    `detail` is the service's message. 5xx responses never carry the service's message: `detail`
    is empty, `code` is the gRPC code name, and `trace_id` points to the logs.
    Errors the gateway raises itself carry its own `code`: for example `INVALID_TOKEN`,
    `NOT_FOUND` for an unknown path, `METHOD_NOT_ALLOWED` (with an `Allow` header) and
    `INVALID_UTF8`, a 400 for any request whose path or query string, once percent-decoded, is
    not valid UTF-8.
servers:
  - url: http://127.0.0.1:8080
security: []

paths:
  /auth/register:
    post:
      operationId: register
      summary: Create an account
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id]
                properties:
                  user_id:
                    $ref: "#/components/schemas/Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The email is already registered (`EMAIL_ALREADY_REGISTERED`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /auth/login:
    post:
      operationId: login
      summary: Exchange email and password for an access token
      description: |
        There is no refresh token: log in again after `expires_at`. An unknown email and a wrong
        password get the same 401 with code `INVALID_CREDENTIALS`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unknown email or wrong password (`INVALID_CREDENTIALS`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /me/following/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        description: The user to follow or unfollow. user-service validates it.
        schema:
          $ref: "#/components/schemas/Id"
    put:
      operationId: follow
      summary: Follow a user
      description: Idempotent. Following yourself is a 400 (`CANNOT_FOLLOW_SELF`).
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The caller follows the user.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such user (`USER_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    delete:
      operationId: unfollow
      summary: Unfollow a user
      description: Idempotent; unfollowing a user not followed also succeeds.
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The caller does not follow the user.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /videos:
    post:
      operationId: initUpload
      summary: Create a video in UPLOADING
      description: |
        Not idempotent: each call creates a video. The response carries a presigned POST: send a
        `multipart/form-data` request to `upload_url` with every entry of `form_fields` first and the
        file as the last field, before `expires_at`, then call `POST /videos/{video_id}/complete`.
        `upload_url` and `form_fields` are a short-lived credential: do not log or share them.
      tags: [videos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, size_bytes, content_type]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                size_bytes:
                  description: Exact size of the file to upload, at most 500 MiB.
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 524288000
                content_type:
                  description: A concrete video media type (`video/<subtype>`, no wildcard), for example `video/mp4`.
                  type: string
                  examples: [video/mp4]
      responses:
        "201":
          description: Video created.
          headers:
            Location:
              description: "`/videos/{video_id}` of the new video."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [video_id, upload_url, form_fields, expires_at]
                properties:
                  video_id:
                    $ref: "#/components/schemas/Id"
                  upload_url:
                    description: Absolute URL of the object storage endpoint to POST the form to.
                    type: string
                    format: uri
                  form_fields:
                    description: Form fields (key, policy, signature, ...) to send before the file field.
                    type: object
                    additionalProperties:
                      type: string
                  expires_at:
                    description: When the presigned POST stops being accepted.
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /videos/{video_id}:
    get:
      operationId: getVideo
      summary: Get one video
      description: A video that is not READY is visible only to its author; to anyone else it is a 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: The video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such video, or hidden from the caller (`VIDEO_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /videos/{video_id}/complete:
    post:
      operationId: completeUpload
      summary: Confirm the upload and start processing
      description: |
        Takes no request body. Checks that the uploaded object exists with the declared size and
        content type, then moves the video to PROCESSING. Idempotent: calling it again on a video
        already PROCESSING or READY returns the current video. The answer is always 202 and the
        state is in the body's `status`; poll `GET /videos/{video_id}` until it is READY.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "202":
          description: The video in its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: |
            `video_id` is malformed (its reason), or the upload cannot be completed: the object is
            missing (`UPLOAD_NOT_FOUND`), does not match the declared size or content type
            (`UPLOAD_MISMATCH`) or the video is already FAILED (`VIDEO_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such video, or it belongs to another user (`VIDEO_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /videos/{video_id}/like:
    parameters:
      - name: video_id
        in: path
        required: true
        description: The video to like or unlike. engagement-service validates it but does not check that it exists.
        schema:
          $ref: "#/components/schemas/Id"
    put:
      operationId: like
      summary: Like a video
      description: |
        Idempotent: liking a video already liked succeeds and does not change `like_count`. The
        caller sees their own like at once in the feed's `stats`.
      tags: [engagement]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The caller likes the video.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    delete:
      operationId: unlike
      summary: Remove the caller's like of a video
      description: Idempotent; unliking a video not liked also succeeds.
      tags: [engagement]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The caller does not like the video.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /videos/{video_id}/views:
    post:
      operationId: recordView
      summary: Count one view of a video
      description: |
        Takes no request body. Not idempotent: every call is one view. The view is queued and
        `view_count` catches up within about a minute. On 503 the view was not recorded and the
        client may retry.
      tags: [engagement]
      security:
        - bearerAuth: []
      parameters:
        - name: video_id
          in: path
          required: true
          description: engagement-service validates it but does not check that the video exists.
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "202":
          description: The view is queued; no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /feed/following:
    get:
      operationId: getFollowingFeed
      summary: Newest videos of the users the caller follows
      description: |
        READY videos of followed users from the last 30 days, newest first. See `FeedPage` for
        paging and for when `stats` is missing.
      tags: [feed]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of the feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        "400":
          $ref: "#/components/responses/FeedBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /feed/explore:
    get:
      operationId: getExploreFeed
      summary: Newest videos across the platform
      description: |
        Every READY video, newest first, the same list for every caller. See `FeedPage` for paging
        and for when `stats` is missing.
      tags: [feed]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of the feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        "400":
          $ref: "#/components/responses/FeedBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /healthz:
    get:
      operationId: healthz
      summary: Liveness
      description: 200 while the process serves HTTP; checks no dependency.
      tags: [ops]
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"

  /readyz:
    get:
      operationId: readyz
      summary: Readiness
      description: |
        Asks the gRPC health service of user-service, video-service and feed-service, within 1
        second. Any of them not SERVING or not reachable is a 503 with code `NOT_READY`.
        engagement-service is not checked: when it is down the feed is still served, without
        `stats`.
      tags: [ops]
      responses:
        "200":
          $ref: "#/components/responses/StatusOK"
        "503":
          description: A dependency is not ready (`NOT_READY`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from /auth/login, only in the Authorization header.

  parameters:
    PageSize:
      name: page_size
      in: query
      required: false
      description: Items per page; absent or 0 means 10, above 50 means 50, negative is a 400.
      schema:
        type: integer
        format: int32
        minimum: 0
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        `next_cursor` of the previous page, passed back unchanged; absent for the first page. It is
        opaque: the gateway does not read it, and a cursor that cannot be decoded is a 400
        (`INVALID_PAGE_TOKEN`).
      schema:
        type: string
        maxLength: 64

  schemas:
    Id:
      description: UUIDv7 in canonical lowercase form.
      type: string
      format: uuid
      examples: [01928c6e-7b3a-7cde-8f01-23456789abcd]

    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at]
      properties:
        access_token:
          description: JWT signed with Ed25519 (EdDSA), valid for 1 hour.
          type: string
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time

    Video:
      type: object
      additionalProperties: false
      required: [video_id, author_id, title, status, created_at]
      properties:
        video_id:
          $ref: "#/components/schemas/Id"
        author_id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        status:
          type: string
          enum: [UPLOADING, PROCESSING, READY, FAILED]
        created_at:
          type: string
          format: date-time
        duration_ms:
          description: Length of the transcoded video; present once READY.
          type: integer
          format: int64
        published_at:
          description: When the video became READY; present once READY.
          type: string
          format: date-time
        playlist_url:
          description: Absolute URL of the HLS master playlist; present once READY.
          type: string
          format: uri
        thumbnail_url:
          description: Absolute URL of the thumbnail; present once READY.
          type: string
          format: uri

    FeedPage:
      description: |
        One page of a feed. Items are newest first by (`published_at`, `video_id`), so videos
        published while paging never shift later pages.
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          description: Empty (never null) when there is nothing more.
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        next_cursor:
          description: Pass it as `cursor` to get the next page; empty on the last page.
          type: string

    FeedItem:
      description: A READY video in a feed; field names and types match `Video`.
      type: object
      additionalProperties: false
      required: [video_id, author_id, title, duration_ms, playlist_url, thumbnail_url, published_at]
      properties:
        video_id:
          $ref: "#/components/schemas/Id"
        author_id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        duration_ms:
          type: integer
          format: int64
        playlist_url:
          description: Absolute URL of the HLS master playlist.
          type: string
          format: uri
        thumbnail_url:
          description: Absolute URL of the thumbnail.
          type: string
          format: uri
        published_at:
          description: When the video became READY.
          type: string
          format: date-time
        stats:
          $ref: "#/components/schemas/VideoStats"

    VideoStats:
      description: |
        Counters of a video and whether the caller likes it. Absent (not zero) from every item of
        a page when engagement-service does not answer within 100 ms; the feed is served anyway.
      type: object
      additionalProperties: false
      required: [view_count, like_count, liked_by_me]
      properties:
        view_count:
          description: Total views; lags by up to about a minute.
          type: integer
          format: int64
        like_count:
          type: integer
          format: int64
        liked_by_me:
          description: Whether the caller likes the video; reflects their own like at once.
          type: boolean

    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Problem:
      description: RFC 9457 problem details (docs/architecture.md §8.4).
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, trace_id]
      properties:
        type:
          type: string
          const: about:blank
        title:
          description: Standard name of the HTTP status.
          type: string
        status:
          type: integer
        detail:
          description: The service's message; empty for 5xx.
          type: string
        code:
          description: Machine-readable reason in UPPER_SNAKE_CASE, or the gRPC code name.
          type: string
          examples: [VIDEO_NOT_FOUND]
        trace_id:
          description: Trace id of the request, for looking up logs.
          type: string
          examples: [4bf92f3577b34da6a3ce929d0e0e4736]

  responses:
    StatusOK:
      description: OK.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    BadRequest:
      description: |
        Invalid request: a body that is not one JSON object with known fields (`INVALID_JSON`), a
        path or query that is not valid UTF-8 (`INVALID_UTF8`), or an argument the service rejects
        (its reason, for example `INVALID_TITLE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    FeedBadRequest:
      description: |
        `page_size` is not an integer or is negative (`INVALID_PAGE_SIZE`), the query is not valid
        UTF-8 (`INVALID_UTF8`), or `cursor` cannot be decoded (`INVALID_PAGE_TOKEN`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: |
        Missing, malformed, expired or otherwise invalid access token (`INVALID_TOKEN`), with a
        `WWW-Authenticate: Bearer` header.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body larger than 64 KiB (`BODY_TOO_LARGE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The service is busy hashing passwords (`SERVER_BUSY`); retry later.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal error; `detail` is empty.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The service is unavailable (`UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GatewayTimeout:
      description: The service did not answer within 3 seconds (`DEADLINE_EXCEEDED`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
