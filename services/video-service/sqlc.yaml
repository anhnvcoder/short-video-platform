version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        # Nullable columns become pointers (nil = NULL) instead of pgtype.Int8, pgtype.Text, ...
        emit_pointers_for_null_types: true
        overrides:
          # Ids use the standard library uuid package, as internal/ids does, rather than adding a
          # third-party uuid module as a dependency (ADR-0007, section 3).
          - db_type: uuid
            go_type:
              import: uuid
              type: UUID
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
