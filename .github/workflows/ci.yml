# Checks of every pull request and of every push to main: the whole check list of CLAUDE.md (make check-go, the web
# client, generated code, buf breaking, compose, Collector, Prometheus rules, charts) plus the secret scan of the whole
# git history and the misconfiguration scan. Job ci-ok is the only check the ruleset of main requires from this
# workflow, so the other jobs can be renamed or added without touching it. Job stack runs the whole compose stack end to
# end as a report outside ci-ok, so a flaky run on a shared runner never blocks a merge.
#
# The repository is public and a pull request from a fork runs this workflow with the fork's code, so:
# - no pull_request_target and no workflow_run: a pull request never runs with a write token or with secrets;
# - every job that runs code of the repository has contents: read and nothing else. The only job with a write
#   permission (sarif, security-events: write) runs on main outside pull requests and executes nothing of the
#   repository: it uploads the SARIF reports the other jobs left as artifacts;
# - every action is GitHub's own and pinned to a full commit SHA: a tag moved to other code changes nothing here;
# - checkout never leaves the token in .git/config (persist-credentials: false);
# - values an outsider controls (branch names, titles) never go into a script through ${{ }}: only through env.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand on any branch. No paths filter on any trigger: a required check whose workflow does not run is never
  # reported and leaves the pull request waiting.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request makes its previous run useless. On main a running run is never cancelled, but the
  # group holds one running and one pending run: a newer push replaces the pending one, so with several merges during
  # one run the commits in between get no result of their own (the newest commit's run checks the code they led to).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # make check-go: gofmt, go vet, golangci-lint (gosec included), actionlint, buf lint and build, go test -race (make
  # check also runs web-check, which needs Node: job web below runs it). The integration tests reach Postgres and Redis
  # on the same 127.0.0.1 addresses as on a dev machine, the only ones internal/pgtest and internal/redistest accept,
  # through the two service containers below.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      # Major 15 like the dev machine's Postgres and the cluster's; superuser postgres/postgres, the default
      # SVP_TEST_POSTGRES_URL of the Makefile. Tests create their own svp_*_test databases from it.
      postgres:
        image: docker.io/library/postgres:15.19-trixie@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
        env:
          POSTGRES_PASSWORD: postgres
        # The runner hands this string to docker create -p as it is, so the port is published on loopback only.
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Same 8.8 line as the dev machine's Redis; tests use db 15 (default SVP_TEST_REDIS_URL of the Makefile).
      redis: &redis-service
        image: docker.io/library/redis:8.8.3-trixie@sha256:eb1aa641bc5380ed14442398e45a5a51aeaaac919fab811e4f134eb77c71dd2d
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go of the Dockerfiles' builder image and of the dev machine. Caches modules and the build cache, keyed on
      # go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      # The binaries of make tools and make ci-tools, rebuilt only when the Makefile (their pinned versions) changes.
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      # The transcode tests of media-worker skip without ffmpeg and ffprobe, which the runner lacks. Ubuntu 24.04 ships
      # 6.1, older than the image's (Alpine 3.24); the tests use long-standing flags only.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
      # -count=1: the restored build cache would otherwise report cached test results and run nothing. golangci-lint
      # runs once and writes a SARIF report beside its text output; the path is filled in here because a $ left in
      # the value would be read by make as one of its variables.
      - name: make check-go
        env:
          LINTFLAGS: --output.text.path=stdout --output.sarif.path=${{ runner.temp }}/golangci-lint.sarif
        run: make check-go TESTFLAGS=-count=1 LINTFLAGS="$LINTFLAGS"
      - name: Summary of golangci-lint
        if: always()
        env:
          SARIF: ${{ runner.temp }}/golangci-lint.sarif
          TOOL: golangci-lint
        run: &sarif-summary |
          # Rule, level and place of each finding (no message), at most 50 rows; nothing when the tool wrote no report.
          [ -f "$SARIF" ] || exit 0
          jq -r --arg tool "$TOOL" '[.runs[].results[]] as $r
            | "### \($tool): \($r | length) finding(s)", "",
              "| Level | Rule | Location |", "| --- | --- | --- |",
              ($r[:50][] | .locations[0].physicalLocation as $l
                | "| \(.level // "warning") | \(.ruleId) | \($l.artifactLocation.uri // "-"):\($l.region.startLine // "-") |")' \
            "$SARIF" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the golangci-lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-golangci-lint
          path: ${{ runner.temp }}/golangci-lint.sarif
          if-no-files-found: ignore

  # The web client in web/: install exactly as web/pnpm-lock.yaml pins it,
  # make web-check (lint, format, typecheck, unit tests, production build), web/gen/api.d.ts as committed, and the
  # vulnerability gate of every npm package the lockfile pins (make web-lockfile-scan).
  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      # The BFF's session tests use Redis db 15, like the Go tests of job check.
      redis: *redis-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Node major of web/.nvmrc, the one the dev machine's nvm and the Dockerfile use. No cache input: its pnpm
      # cache needs pnpm on PATH before Node is there, so the store is cached below instead.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      # pnpm the same way as on the dev machine and in the Dockerfile: Node 25 and later ship no Corepack, and the
      # repository allows no third-party action (pnpm/action-setup). The exact version is read from the packageManager
      # field of web/package.json, the one place it is pinned (Renovate updates it).
      - id: pnpm
        name: Install pnpm
        working-directory: web
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install -g "pnpm@$version"
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # The pnpm store, keyed on the lockfile; a prefix of its own so it never meets the tools cache. What protects
      # this cache is its scope: a pull request saves into its own scope only, never main's, so it cannot plant a store
      # that main later restores. pnpm checks the integrity hash of web/pnpm-lock.yaml only when it downloads a tarball,
      # not for packages already in a restored store.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      # The trivy DB of the lockfile scan below, one cache entry per day under the same key and path as images.yml,
      # restored before any step that can fail; trivy still downloads a newer DB when the cached one is stale. A pull
      # request's cache stays in its own ref and never replaces main's.
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - run: make web-install
      - run: make web-check
      - run: make web-generate-check
      # Any CRITICAL in web/pnpm-lock.yaml (development dependencies included) fails the job; HIGH and below are only
      # counted in the job summary and the SARIF. It runs even when a step above failed, so a pull request always shows
      # the gate's result. The SARIF is written before the gate decides; job sarif uploads it on main.
      - name: make web-lockfile-scan
        if: ${{ !cancelled() }}
        env:
          SVP_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
        run: make web-lockfile-scan WEB_LOCKFILE_SARIF="$RUNNER_TEMP/trivy-lockfile-web.sarif"
      - name: Summary of the lockfile scan
        if: always()
        env:
          SARIF: ${{ runner.temp }}/trivy-lockfile-web.sarif
          TOOL: trivy lockfile web
        run: *sarif-summary
      - name: Keep the lockfile scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy-lockfile-web
          path: ${{ runner.temp }}/trivy-lockfile-web.sarif
          if-no-files-found: ignore

  # make generate in a scratch copy, compared with the files as committed (the working tree is never written).
  generate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      - run: make generate-check

  # Breaking changes of the proto contracts. buf lint and buf build already run in make check.
  buf:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The whole history, so the base commit below is there to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      # Base of the comparison: a pull request, the merge base with its base branch; a push to main, main as it was
      # before the push (all zeros when the branch did not exist: nothing to compare with); a manual run, the merge
      # base with main, as images.yml does (its before is empty, not zeros).
      - name: buf breaking
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF") ;;
            push)
              if [ -z "${BEFORE//0/}" ]; then
                echo "buf breaking skipped: the push created the branch, there is no previous state to compare with." \
                  | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              base=$BEFORE ;;
            *) base=$(git merge-base HEAD origin/main) ;;
          esac
          echo "buf breaking against $base"
          "$(go env GOPATH)/bin/buf" breaking --against ".git#ref=$base"

  # The configuration that no Go test covers: the rules of .trivyignore.yaml and deploy/ci/trivy-config-ignore.yaml,
  # Prometheus rules and their tests, the three Collector configs, the compose file of every profile, every chart of the
  # repository, the digests of third-party images, the k6 scripts with each profile and the cloud cluster's manifests.
  config:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The deployment configuration this job checks the charts against: main of svp-gitops, which make gitops-clone
    # clones anonymously into this folder (gitignored) below; every script reads it there through gitops_dir of
    # deploy/k8s/lib.sh.
    env:
      SVP_GITOPS_DIR: ${{ github.workspace }}/.gitops/svp-gitops
    steps:
      # The whole history: the test of gitops-check.sh reads the commits that the tree of svp-gitops pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Public repository, over HTTPS without credentials: no token, no secret.
      - run: make gitops-clone
      # Here and not only in the image gate: a pull request that changes nothing but .trivyignore.yaml builds no image,
      # and a broken entry merged into main would stop the daily rescan from attesting every service.
      # The same step holds the misconfigurations job trivy-config leaves out to their rules: paths, reason, at most 90
      # days. Needs no image, no tool and no token.
      - run: deploy/ci/scan-gate.sh --check-ignorefile
      # Only deploy/ci/platform.sh may read GitHub's variables or call gh: a script that does it itself works here and
      # silently loses its output on another CI. The guard greps deploy/ and the Makefile for that; the test runs the
      # adapter and the scripts that call it against a made-up job, fake gh and cosign, in a throwaway repository. Both
      # need only bash, git and jq: no network, no token.
      - run: deploy/ci/platform-guard.sh
      - run: deploy/ci/platform-test.sh
      # The promote to stg of svp-gitops, which otherwise runs only on main with the app's token: two throwaway
      # repositories on disk stand for this repository and svp-gitops, a fake gh records the pull request and its
      # auto-merge; and the list of releases the daily rescan reads there. bash, git and jq: no network, no token.
      - run: deploy/ci/promote-test.sh
      # The promote to prd of a whole set of a record of stg, on the same kind of throwaway repository with a fake gh
      # listing the records; and the set of releases stg ran during the checks of scenario gitops (snapshots of a
      # made-up cluster through a fake kubectl, its clone of svp-gitops on disk) and the record job's refusals. bash, git
      # and jq: no network, no token, no cluster.
      - run: deploy/ci/promote-prd-test.sh
      - run: deploy/ci/release-set-test.sh
      # The DORA metrics of stg, which otherwise run only weekly on main (dora.yml): made-up records of stg through a
      # fake gh, two throwaway repositories at fixed times for this repository and svp-gitops, made-up postmortems.
      # bash, git and jq: no network, no token.
      - run: deploy/ci/dora-test.sh
      # The build provenance predicate of a release and the step of sign-image.sh that attests it, which otherwise run
      # only in the sign job on main: a made-up run, fake docker and cosign, a throwaway repository; bash, git and jq.
      - run: deploy/ci/provenance-predicate-test.sh
      # The filter of the public artifact of verify.yml and the masks of its job's log, which only the weekly run on main
      # would use otherwise: a pull request that breaks one of their rules fails here. Fake secrets, kubectl, docker and
      # make in a temporary directory; bash, git, jq and openssl, no network.
      - run: deploy/ci/verify-collect-test.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      # Helm for gitops-check-test.sh below; make targets put GOBIN on PATH themselves.
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make slo-check
      - run: make otelcol-validate
      # make env writes a .env of fresh random secrets (mode 600) that lives on this runner until the job ends: it is
      # never printed or uploaded, and compose config --quiet does not print the file with the secrets filled in.
      - name: make compose-config
        run: |
          make env
          make compose-config
      # The working tree's charts with main of svp-gitops (deploy/ci/gitops-check.sh --worktree), every third-party
      # image pinned by digest among them; needs network: chart repositories.
      - run: make helm-check
      # The check that svp-gitops runs from a pinned commit of this repository, on the clone above: each negative case
      # (a missing image file, an image newer than the charts, a set of prd that matches no record of stg, ...) must
      # fail with its own message, and gitops_dir of deploy/k8s/lib.sh finds the clone of a draft workspace. Every case
      # stops before the network (a fake gh lists the records); helm from the PATH set above.
      - run: deploy/ci/gitops-check-test.sh "$SVP_GITOPS_DIR"
      # k6 inspect of every profile in the pinned k6 image, with no network: a script that no longer loads or a profile
      # whose scenarios are malformed is caught here, without the compose stack the load runs need.
      - run: make k6-check
      # kubeconform -strict of the cloud cluster's manifests and rendered charts: a wrong field or kind in a Chaos Mesh,
      # Velero or snapshot manifest is caught here, without a cluster that has those CRDs; helm
      # from the PATH set above. Needs network: chart repositories and GitHub.
      - run: make cloud-check

  # gitleaks over the whole history of every ref (no --log-opts: setting it drops gitleaks's default --full-history
  # --all), at the version make tools pins. Any finding fails the job. --redact keeps the secret out of the log and the
  # report, which anyone can read on a public repository. A false positive (a test fixture) is allowed only in
  # .gitleaks.toml, narrowly, with the reason beside it.
  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      - name: gitleaks (whole history)
        run: >-
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner
          --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif"
      - name: Summary of gitleaks
        if: always()
        env:
          SARIF: ${{ runner.temp }}/gitleaks.sarif
          TOOL: gitleaks
        run: *sarif-summary
      - name: Keep the gitleaks report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-gitleaks
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore

  # trivy config on the Dockerfiles, charts and manifests with the pinned trivy image, less the findings
  # deploy/ci/trivy-config-ignore.yaml leaves out until their expired_at. Report only: it never fails the job on a
  # finding.
  trivy-config:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make trivy-config TRIVY_CONFIG_SARIF="$RUNNER_TEMP/trivy-config.sarif"
      - name: Summary of trivy config
        if: always()
        env:
          SARIF: ${{ runner.temp }}/trivy-config.sarif
          TOOL: trivy config
        run: *sarif-summary
      - name: Keep the trivy config report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy-config
          path: ${{ runner.temp }}/trivy-config.sarif
          if-no-files-found: ignore

  # The whole compose stack of make up on the runner, driven as on a dev machine: make smoke, the web client's
  # end-to-end tests, the k6 profile ci (error thresholds only: a shared runner says nothing about latency),
  # Lighthouse and Schemathesis against the gateway's OpenAPI contract. A report, not a check: ci-ok does not need it, so a red
  # stack (a flaky end-to-end test on a shared runner) never blocks a merge; whoever reads the pull request sees its
  # result under this name. It builds and runs the pull request's code like the other jobs, with contents: read and no
  # secret: make env writes a .env of fresh random secrets that lives on this runner until the job ends, never printed
  # or uploaded. The LOCAL LAB ONLY resets of smoke, e2e, k6, Lighthouse and DAST (they delete the gateway's register rate
  # limit keys in Redis db 10) touch only the Redis service container below, which belongs to this run.
  stack:
    name: stack (end-to-end, report only)
    runs-on: ubuntu-24.04
    # Seven image builds, the e2e seed (21 READY videos), two browsers: about 15 to 25 minutes. The limit leaves room for
    # a slow runner and stops a hung step long before GitHub's default of 6 hours.
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      # The images of job check. There the tests reach them on loopback only; here the compose containers reach them as
      # host.docker.internal, which compose's host-gateway maps to the gateway of Docker's default bridge (docker0,
      # 172.17.0.1). So each is published on that address and on loopback (psql of deploy/postgres/bootstrap.sh and
      # redis-cli of the scripts run on the runner), never on every interface. The compose services log in to Postgres
      # with the role passwords make up bootstraps (the image asks for a password on every TCP connection).
      postgres:
        image: docker.io/library/postgres:15.19-trixie@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
          - 172.17.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The gateway (db 10), feed-service (db 14) and the web's sessions (db 9) of this run only.
      redis:
        image: docker.io/library/redis:8.8.3-trixie@sha256:eb1aa641bc5380ed14442398e45a5a51aeaaac919fab811e4f134eb77c71dd2d
        ports:
          - 127.0.0.1:6379:6379
          - 172.17.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make env runs go run ./tools/jwtkey for the JWT key pair; the Makefile also asks go for GOPATH.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      # host-gateway is the gateway of the default bridge (unless the daemon sets host-gateway-ip), and the services
      # above are published on 172.17.0.1: if the two differ, every compose service fails to reach Postgres and Redis
      # with a timeout far from its cause. Said here, before anything is built.
      - run: make ci-bridge-check
      # Node and pnpm as in job web: the web's e2e tests, Lighthouse and the Playwright browsers run from web/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install pnpm
        working-directory: web
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install -g "pnpm@$version"
      # What the scripts run on the runner, from Ubuntu's archive (no third-party action): psql of the Postgres
      # bootstrap (16 here; bootstrap.sql needs 15 or later for \getenv), redis-cli of the rate limit reset, ffmpeg for
      # the test videos of smoke, the e2e seed and Lighthouse, jq everywhere. curl and openssl come with the image.
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client redis-tools ffmpeg jq
      - run: make env
      - run: make up
      - run: make smoke
      - run: make web-install
      # The browsers of web/playwright.config.ts at the version web/pnpm-lock.yaml pins, with their system libraries
      # (apt, through sudo).
      - name: Install the Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium webkit
      # Traces of failed tests stay in web/test-results/ on the runner: they hold session cookies and are never
      # uploaded.
      - run: make web-e2e
      - id: k6
        run: make load-ci
      # make web-lighthouse launches Playwright's Chromium with Chrome's sandbox, which needs unprivileged user
      # namespaces. Ubuntu 24.04 restricts those through AppArmor for every binary without a profile of its own, and
      # Playwright's download has none, so Chrome stops with "No usable sandbox". The restriction is lifted on this
      # throwaway runner (as deploy/ci/verify-host.sh does), so the sandbox stays on; the e2e tests turn it off themselves.
      - name: Let Chrome's sandbox use user namespaces
        run: |
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)" = 1 ]; then
            sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "apparmor: kernel.apparmor_restrict_unprivileged_userns" \
            "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
      # Report only: one Lighthouse run per page on a shared runner is noise, so its thresholds never turn the job red.
      - id: lighthouse
        run: make web-lighthouse
        continue-on-error: true
      # DAST of the gateway against its OpenAPI contract (deploy/dast/run.sh). Report only, like Lighthouse. Last of the
      # checks: it uses up the gateway's per-IP and per-user rate limits. Its output stays in .dast/ on the runner;
      # the log shows only the summary it prints from the files it found clean.
      - id: dast
        run: make dast
        continue-on-error: true
        timeout-minutes: 15
      - name: Container state
        if: failure()
        run: make ps
      # deploy/k6/load.sh fails the run when its results hold a token, cookie or password but leaves them in place: the
      # same check again here, so summary.json reaches the public artifact only when it is clean. machine.json and the
      # rest stay on the runner. Skipped when the step was cancelled (a timeout) or never ran.
      - name: Pick the k6 summary
        if: always() && (steps.k6.outcome == 'success' || steps.k6.outcome == 'failure')
        run: |
          mkdir -p "$RUNNER_TEMP/k6-summary"
          for summary in .k6/ci-*/summary.json; do
            [ -f "$summary" ] || continue
            if grep -IqE -i 'eyJ[A-Za-z0-9_-]{8,}|svp_sid|bearer|password|cookie|token|set-cookie' "$summary"; then
              echo "::warning::$summary looks like it holds a secret: not uploaded"
              continue
            fi
            cp "$summary" "$RUNNER_TEMP/k6-summary/"
          done
      - name: Keep the k6 summary
        if: always() && (steps.k6.outcome == 'success' || steps.k6.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: ${{ runner.temp }}/k6-summary/
          if-no-files-found: ignore
      # The reports web/lighthouse/run.sh wrote at the top of its folder after replacing the session cookie in them
      # (it deletes them when a cookie value is still found). Its .lighthouseci/ subfolder, with the results before
      # that replacement, is matched by neither pattern and is a hidden folder, which upload-artifact leaves out.
      # Skipped when the step was cancelled mid-run or never ran.
      - name: Keep the Lighthouse reports
        if: always() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: |
            web/test-results/lighthouse/*.html
            web/test-results/lighthouse/*.json
          if-no-files-found: ignore
      # Only report.json (counts, failure titles, seed) and summary.json (requests by status and operation) may leave
      # the runner; schemathesis.log, junit.xml and requests.har hold response bodies with tokens and presigned forms.
      # deploy/dast/run.sh fails the run when either of the two holds a secret but leaves them in place: the same check
      # again here, so they reach the public artifact only when clean. Skipped when the step was cancelled or never ran.
      - name: Pick the DAST reports
        if: always() && (steps.dast.outcome == 'success' || steps.dast.outcome == 'failure')
        run: |
          mkdir -p "$RUNNER_TEMP/dast"
          for report in .dast/*/report.json .dast/*/summary.json; do
            [ -f "$report" ] || continue
            if grep -qE 'eyJ[A-Za-z0-9_-]{8,}|"access_token"|"refresh_token"|svp_sid|Bearer [A-Za-z0-9]' "$report" ||
              grep -qiE 'X-Amz-Signature|X-Amz-Credential' "$report"; then
              echo "::warning::$report looks like it holds a secret: not uploaded"
              continue
            fi
            cp "$report" "$RUNNER_TEMP/dast/"
          done
      - name: Keep the DAST reports
        if: always() && (steps.dast.outcome == 'success' || steps.dast.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast
          path: ${{ runner.temp }}/dast/
          if-no-files-found: ignore
      - name: make down
        if: always()
        run: make down

  # The code scanning upload, the one job with a write permission. Only on main outside pull requests: a pull request
  # (from a branch of the repository or from a fork) runs its own code before anyone has read it, so it never gets
  # security-events: write; its findings stay in the artifacts and job summaries. This job checks the code out only so
  # upload-sarif can read the lines of each finding and fingerprint it (an alert then survives a line shift with its
  # history and dismissal): it runs nothing of the repository. It is a report, not a check: ci-ok does not need it,
  # and a failed upload still turns the run red.
  sarif:
    needs: [check, web, gitleaks, trivy-config]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each report the jobs above left, in sarif/<artifact name>/; a job that stopped before writing its report left
      # none, and its upload below is skipped.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: sarif
      - if: hashFiles('sarif/sarif-golangci-lint/golangci-lint.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: sarif/sarif-golangci-lint/golangci-lint.sarif
          category: golangci-lint
      - if: hashFiles('sarif/sarif-gitleaks/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: sarif/sarif-gitleaks/gitleaks.sarif
          category: gitleaks
      - if: hashFiles('sarif/sarif-trivy-config/trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: sarif/sarif-trivy-config/trivy-config.sarif
          category: trivy-config
      - if: hashFiles('sarif/sarif-trivy-lockfile-web/trivy-lockfile-web.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: sarif/sarif-trivy-lockfile-web/trivy-lockfile-web.sarif
          category: trivy-lockfile-web

  # The required check. It runs whatever happened before it (always()) and fails unless every check job succeeded:
  # GitHub counts a skipped required check as passed, and a job that failed or was cancelled does not fail the jobs
  # that need it by itself. None of the seven has a condition, so skipped here can only mean a wrong if: and is red too.
  # No condition may ever skip ci-ok itself.
  ci-ok:
    needs: [check, web, generate, buf, config, gitleaks, trivy-config]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every check job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'length == 7 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
