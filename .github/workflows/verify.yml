# Deferred verification of stage 6b, on a fresh GitHub-hosted runner
# of the public repository: one scenario per run dispatched by hand, and once a week compose-obs, dev-k3d and gitops
# side by side on main, every target. It builds the compose stack or the k3d cluster with the same make targets as a dev
# machine and runs the drills and measurements that machine cannot hold (16 GB). Not a check of pull requests: no
# ruleset requires it, and nothing but the dispatch and the weekly schedule triggers it.
#
#   gh workflow run verify.yml --ref <main or feat/stage6b-...> -f scenario=<scenario> [-f targets='<name> ...']
#     [-f web_ref=<branch or full commit SHA of svp-web>]
#
# Scenarios (deploy/ci/verify/<scenario>.sh lists the targets of each): compose-obs (job compose), dev-k3d, web-canary,
# k6-cloud-mini, chaos and velero (job k3d, the k3d cluster of the dev path), gitops (job gitops, the cluster Argo CD
# builds from this repository).
#
# The repository is public, so the log and the artifact of every run are too, red or not:
# - only workflow_dispatch (write access to the repository needed) and schedule (the code of main, no input), never
#   pull_request_target or workflow_run; every job has contents: read, and job gitops also actions: read (the source
#   map artifact of the images run that built the web image it runs), with the job's token given to its two steps that
#   read the platform's API only, never to the scenario's step. No job that builds or checks anything holds a secret
#   or an environment: only job record-stg, which runs no scenario and checks out nothing it executes but
#   deploy/ci/record-stg.sh of main, has environment promote (deployment branch main only) for a token of the app on
#   svp-gitops with deployments write alone;
# - every action is GitHub's own and pinned to a full commit SHA; checkout never leaves the token in .git/config;
# - the inputs reach the scripts only through env (SCENARIO, SVP_VERIFY_TARGETS, SVP_VERIFY_WEB_REF) and
#   deploy/ci/verify-run.sh checks them again with a case; if: compares the scenario as an expression, never in a
#   shell. A scheduled run has no inputs: each job's SCENARIO falls back to its own scenario, the targets are empty
#   (every one) and so is web_ref (the web client's code as without it);
# - web_ref, checked in each job's first step, is a branch or a full commit SHA of svp-web, the web client's repository;
#   verify-run.sh clones it from github.com/anhnvcoder/svp-web only (make web-clone), so a fork's code never runs here,
#   and only for the scenarios that build or test the web (dev-k3d, web-canary, gitops);
# - make env writes a .env of fresh random secrets that lives on this runner until the job ends; the cluster makes more
#   (GlitchTip's tokens, its CA). deploy/ci/verify-mask.sh masks them in the log as soon as they exist, every target's
#   output goes to a file on the runner instead of the log, and deploy/ci/verify-collect.sh copies into the artifact
#   only the files of an allow list that pass a scan for every known secret value and for token patterns (it drops
#   the doubtful ones, with a warning). Nothing is ever printed with set -x, env or kubectl get secret.
# Job record-stg records the set of releases stg ran in svp-gitops after job gitops on main, when its scenario step
# passed and release-set.json is in its artifact: a dispatch or the weekly run, whatever the wait for a release gives.
#
# The scenario stops at the earlier of its step limit and its job limit minus 25 minutes (verify-run.sh), so the steps
# that collect, filter and upload always have time to run: they run once the ref check passed, also after a failure, a
# timeout or a cancel (always()).
name: verify

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario (compose-obs is the compose stack with OBS=lgtm, gitops the cluster of the GitOps path, the others the k3d cluster of the dev path)
        type: choice
        required: true
        options:
          - compose-obs
          - dev-k3d
          - gitops
          - web-canary
          - k6-cloud-mini
          - chaos
          - velero
      targets:
        description: Targets to run, separated by spaces; empty runs every one, the build target always runs (deploy/ci/verify-run.sh)
        type: string
        required: false
        default: ""
      web_ref:
        description: "dev-k3d, web-canary, gitops: the web client's code from svp-web (github.com/anhnvcoder/svp-web), main, another of its branches or a full commit SHA; empty keeps the web as without it (deploy/ci/verify-run.sh)"
        type: string
        required: false
        default: ""
  # Saturday 00:37 UTC, 07:37 in Vietnam (UTC+7), off the top of the hour (busy for GitHub's scheduler, which may delay
  # or drop a run then). GitHub runs it on the latest commit of main only, and turns it off after 60 days without any
  # activity in a public repository. Its longest jobs (330 minutes) end by 06:17 UTC, so the record of stg it makes is
  # there before dora.yml runs at 09:17 UTC.
  schedule:
    - cron: "37 0 * * 6"

permissions: {}

# One run of each scenario at a time, the two scenarios side by side: each has a runner of its own, and both run on
# Linux by now, so a fix rarely waits on the other's run. A third dispatch of a scenario while one runs and one waits
# replaces the waiting one. The scheduled run (all three jobs) is a group of its own, verify-schedule: a dispatch
# during it runs beside it, on its own runner.
concurrency:
  group: verify-${{ inputs.scenario || github.event_name }}
  cancel-in-progress: false

jobs:
  # The compose stack with the LGTM observability profile, as job stack of ci.yml builds it: make up OBS=lgtm (GlitchTip
  # included), make smoke, make drill-obs-threats, make load-local under a watch of Alertmanager, make web-lighthouse
  # three times; then the object store's checks: make test-stack of internal/objstore (no test may skip), make
  # drill-upload-cleanup, make measure-upload with the store's RAM peak; make drill-alert-to-sentry (Telegram is not
  # configured, so that step SKIPs); last, the copy back to MinIO (make object-store-copy TO=minio into a volume of this
  # runner), make up again on RustFS and make smoke. The LOCAL LAB ONLY resets of smoke, the drills, e2e, k6 and
  # Lighthouse (they delete the gateway's register rate limit keys in Redis db 10) touch only the Redis service
  # container below, which belongs to this run; the copy reads svp_video of the Postgres service container of this run
  # only.
  compose:
    if: github.event_name == 'schedule' || inputs.scenario == 'compose-obs'
    runs-on: ubuntu-24.04
    # Setup about 20 minutes, the scenario step 75, then 25 for the steps after it.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SCENARIO: ${{ inputs.scenario || 'compose-obs' }}
      SVP_VERIFY_TARGETS: ${{ inputs.targets }}
      SVP_VERIFY_WEB_REF: ${{ inputs.web_ref }}
      SVP_VERIFY_JOB_MINUTES: 120
      SVP_VERIFY_STEP_MINUTES: 75
    services:
      # As in job stack of ci.yml: published on loopback (the scripts on the runner) and on the gateway of Docker's
      # default bridge, 172.17.0.1, where the compose services reach them as host.docker.internal; never on every
      # interface.
      postgres:
        image: docker.io/library/postgres:15.19-trixie@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
          - 172.17.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: docker.io/library/redis:8.8.3-trixie@sha256:eb1aa641bc5380ed14442398e45a5a51aeaaac919fab811e4f134eb77c71dd2d
        ports:
          - 127.0.0.1:6379:6379
          - 172.17.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # Before anything else: a dispatch of another branch (an old one without the fixes of this stage) stops here, and
      # so does a scheduled run anywhere but main (GitHub runs it on the default branch, which is main). An accident
      # guard, not a security boundary: whoever can dispatch can also push a branch of that name. So does a web_ref that
      # names no branch or commit; verify-run.sh refuses it for a scenario that takes none (compose-obs among them).
      - name: Check the ref and note the job's start
        id: ref
        run: |
          case $GITHUB_EVENT_NAME:$GITHUB_REF in
            schedule:refs/heads/main | workflow_dispatch:refs/heads/main | workflow_dispatch:refs/heads/feat/stage6b-*) ;;
            *) echo "::error::verify runs on main, or dispatched on a feat/stage6b-* branch, not $GITHUB_EVENT_NAME on $GITHUB_REF"; exit 1 ;;
          esac
          # web_ref: empty, a full commit SHA or a branch name (not printed back: a line starting with :: is a command).
          if [ -n "$SVP_VERIFY_WEB_REF" ] && ! [[ $SVP_VERIFY_WEB_REF =~ ^[0-9a-f]{40}$ ]] &&
            ! { [[ $SVP_VERIFY_WEB_REF =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] && git check-ref-format "refs/heads/$SVP_VERIFY_WEB_REF"; }; then
            echo "::error::web_ref is neither a full commit SHA nor a branch name of svp-web"; exit 1
          fi
          echo "SVP_VERIFY_OUT=$RUNNER_TEMP/verify" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/verify"
          date +%s >"$RUNNER_TEMP/verify/job-start"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make env runs go run ./tools/jwtkey for the JWT key pair, make test-stack runs go test -race against the stack;
      # the Makefile also asks go for GOPATH.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      - run: make ci-bridge-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install pnpm
        working-directory: web
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install -g "pnpm@$version"
      # psql of the Postgres bootstrap and the copy back to MinIO, redis-cli of the rate limit resets, ffmpeg for the
      # test videos (the ~100 MB one of make measure-upload too), jq everywhere.
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client redis-tools ffmpeg jq
      # make web-lighthouse needs lhci from web/node_modules and Playwright's Chromium, and make measure-upload uploads
      # from Chromium; this scenario runs no test on WebKit.
      - run: make web-install
      - name: Install the Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - run: make env
      - run: deploy/ci/verify-mask.sh env
      - run: deploy/ci/verify-host.sh "$SCENARIO"
      - run: deploy/ci/verify-sample.sh start
      - name: Scenario
        timeout-minutes: 75
        run: deploy/ci/verify-run.sh "$SCENARIO"
      - name: Stop the sampler
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-sample.sh stop
      - name: Collect and filter the results
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-collect.sh
      - name: Keep the filtered results
        if: always() && steps.ref.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-${{ env.SCENARIO }}
          path: ${{ runner.temp }}/verify-artifact/
          retention-days: 30
          if-no-files-found: warn
      # make down reads .env; without one (a run cancelled before make env) no stack was ever started.
      - name: make down
        if: always() && steps.ref.outcome == 'success'
        run: |
          if [ -f .env ]; then make down; else echo "no .env: make env never ran, so no stack was started"; fi

  # The k3d cluster of the dev path, built by make k8s-up, for scenario dev-k3d (scheduled too: smoke, RAM at rest, the
  # threat model drill, PodDisruptionBudget, the gateway's canary under the new probes, the web's source maps, its e2e
  # tests with GlitchTip, its observability drill, KEDA with two workers transcoding (RAM peak), the Postgres restore
  # twice, RAM at rest again), web-canary (the web's canary under traffic), k6-cloud-mini (the k6 Job of stage 7 scaled
  # down), chaos (Chaos Mesh's experiments) and velero (Velero's backup and restore of Redpanda). The LOCAL LAB ONLY
  # resets of the drills delete the register rate limit keys in the cluster's Valkey, on this runner; Chaos Mesh,
  # Velero and the CSI driver they need live in the cluster of this runner only.
  k3d:
    if: >-
      github.event_name == 'schedule' ||
      contains(fromJSON('["dev-k3d", "web-canary", "k6-cloud-mini", "chaos", "velero"]'), inputs.scenario)
    runs-on: ubuntu-24.04
    # Setup about 20 minutes, the scenario step 285, then 25 for the steps after it; 30 minutes under GitHub's 6 hours.
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      SCENARIO: ${{ inputs.scenario || 'dev-k3d' }}
      SVP_VERIFY_TARGETS: ${{ inputs.targets }}
      SVP_VERIFY_WEB_REF: ${{ inputs.web_ref }}
      SVP_VERIFY_JOB_MINUTES: 330
      SVP_VERIFY_STEP_MINUTES: 285
    steps:
      # As in job compose.
      - name: Check the ref and note the job's start
        id: ref
        run: |
          case $GITHUB_EVENT_NAME:$GITHUB_REF in
            schedule:refs/heads/main | workflow_dispatch:refs/heads/main | workflow_dispatch:refs/heads/feat/stage6b-*) ;;
            *) echo "::error::verify runs on main, or dispatched on a feat/stage6b-* branch, not $GITHUB_EVENT_NAME on $GITHUB_REF"; exit 1 ;;
          esac
          # web_ref: empty, a full commit SHA or a branch name (not printed back: a line starting with :: is a command).
          if [ -n "$SVP_VERIFY_WEB_REF" ] && ! [[ $SVP_VERIFY_WEB_REF =~ ^[0-9a-f]{40}$ ]] &&
            ! { [[ $SVP_VERIFY_WEB_REF =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] && git check-ref-format "refs/heads/$SVP_VERIFY_WEB_REF"; }; then
            echo "::error::web_ref is neither a full commit SHA nor a branch name of svp-web"; exit 1
          fi
          echo "SVP_VERIFY_OUT=$RUNNER_TEMP/verify" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/verify"
          date +%s >"$RUNNER_TEMP/verify/job-start"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      # k3d, Helm and the other pinned tools, as in job config of ci.yml.
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      # k3d and Helm for deploy/k8s/install.sh and the drills, which call them by name; kubectl is the runner image's
      # (deploy/ci/verify-host.sh checks its version against k3s).
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install pnpm
        working-directory: web
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install -g "pnpm@$version"
      # ffmpeg for the test videos of smoke and KEDA, jq everywhere, nc for the drills' port checks.
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg jq netcat-openbsd
      # make k8s-web-e2e runs on Chromium and WebKit.
      - run: make web-install
      - name: Install the Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: make env
      - run: deploy/ci/verify-mask.sh env
      - run: deploy/ci/verify-host.sh "$SCENARIO"
      - run: deploy/ci/verify-sample.sh start
      - name: Scenario
        timeout-minutes: 285
        run: deploy/ci/verify-run.sh "$SCENARIO"
      - name: Stop the sampler
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-sample.sh stop
      - name: Collect and filter the results
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-collect.sh
      - name: Keep the filtered results
        if: always() && steps.ref.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-${{ env.SCENARIO }}
          path: ${{ runner.temp }}/verify-artifact/
          retention-days: 30
          if-no-files-found: warn
      - name: make k8s-down
        if: always() && steps.ref.outcome == 'success'
        run: make k8s-down

  # The GitOps path: make k8s-gitops-up builds a new cluster from the branch this run checked out, Argo CD reading the
  # public repository over anonymous HTTPS (no deploy key, no secret) and running the signed release images of GHCR by
  # digest under Kyverno's Enforce policy; then smoke, RAM at rest, the supply chain and threat model drills, the source
  # maps of the web image CI built, the web's e2e tests with GlitchTip and its observability drill, KEDA twice with the
  # RAM peak of each, RAM at rest again; after the scenario, on a dispatch of main, the wait for a release merged while
  # the cluster runs and make measure-gitops on it (deploy/ci/verify/gitops.sh). Dispatched, and weekly on main beside
  # jobs compose and k3d: SVP_VERIFY_SCHEDULED tells the scripts a run is the scheduled one, which waits for no release
  # (nobody merges one for it) and leaves out the supply chain drill's cases whose drill-only image is past its maximum
  # age (nobody rescans those before it). The set of releases stg ran from before smoke to after the last check goes
  # into the artifact as release-set.json; the step after the collect sets output recorded when the scenario step
  # passed and the file is there, and job record-stg records it then. A red wait for a release still makes this job
  # red, as its measurement is that step's, but never keeps the record from being made.
  gitops:
    if: github.event_name == 'schedule' || inputs.scenario == 'gitops'
    runs-on: ubuntu-24.04
    # Setup about 10 minutes, the scenario step 175, the wait for a release 115, then 25 for the steps after them; 30
    # minutes under GitHub's 6 hours.
    timeout-minutes: 330
    permissions:
      contents: read
      # The artifact web-sourcemaps-amd64 of the images run that built the web image the cluster runs.
      actions: read
      # The release's push time: merged_at of the promote pull request whose merge is the release commit.
      pull-requests: read
    # A flag only, true or empty: nothing read from the artifact leaves this job.
    outputs:
      recorded: ${{ steps.record.outputs.recorded }}
    env:
      SCENARIO: gitops
      SVP_VERIFY_TARGETS: ${{ inputs.targets }}
      SVP_VERIFY_WEB_REF: ${{ inputs.web_ref }}
      SVP_VERIFY_JOB_MINUTES: 330
      SVP_VERIFY_STEP_MINUTES: 175
    steps:
      # As in job compose.
      - name: Check the ref and note the job's start
        id: ref
        run: |
          case $GITHUB_EVENT_NAME:$GITHUB_REF in
            schedule:refs/heads/main | workflow_dispatch:refs/heads/main | workflow_dispatch:refs/heads/feat/stage6b-*) ;;
            *) echo "::error::verify runs on main, or dispatched on a feat/stage6b-* branch, not $GITHUB_EVENT_NAME on $GITHUB_REF"; exit 1 ;;
          esac
          # web_ref: empty, a full commit SHA or a branch name (not printed back: a line starting with :: is a command).
          if [ -n "$SVP_VERIFY_WEB_REF" ] && ! [[ $SVP_VERIFY_WEB_REF =~ ^[0-9a-f]{40}$ ]] &&
            ! { [[ $SVP_VERIFY_WEB_REF =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] && git check-ref-format "refs/heads/$SVP_VERIFY_WEB_REF"; }; then
            echo "::error::web_ref is neither a full commit SHA nor a branch name of svp-web"; exit 1
          fi
          echo "SVP_VERIFY_OUT=$RUNNER_TEMP/verify" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/verify"
          date +%s >"$RUNNER_TEMP/verify/job-start"
      # The whole history: make k8s-gitops-up checks the release at origin/<branch>, and make measure-gitops reads the
      # parent of the release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: go.sum
      # As in job k3d.
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install the pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools ci-tools
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install pnpm
        working-directory: web
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install -g "pnpm@$version"
      - name: Install the tools of the scripts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg jq netcat-openbsd
      - run: make web-install
      - name: Install the Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: make env
      - run: deploy/ci/verify-mask.sh env
      - run: deploy/ci/verify-host.sh "$SCENARIO"
      - run: deploy/ci/verify-sample.sh start
      # The source maps CI exported beside the web image Argo CD is about to run (artifact web-sourcemaps-amd64 of the
      # images run that built it, chosen by the digest it was built as), downloaded with the job's token into the
      # runner's temp directory for the scenario's step gitops-sourcemaps. A failure here does not stop the job: the
      # scenario reports it there, and runs every step that needs no maps.
      - name: Find the source maps of the web image
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/ci/gitops-sourcemaps.sh fetch
      - name: Scenario
        id: scenario
        timeout-minutes: 175
        env:
          SVP_VERIFY_SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || '' }}
        run: deploy/ci/verify-run.sh "$SCENARIO"
      # On a run of main: the promote pull request waiting since before the run is merged while this step runs (the
      # job's steps show it running), then the release is measured from its push to its pods Ready. The job's token is
      # for make measure-gitops alone, which reads the push from the merged pull request (else GitHub's events). On a branch it prints why it skips.
      # These are the scenario's targets wait-release and measure-gitops: the input targets chooses them as any other.
      # A scheduled run says why it waits for nothing.
      - name: Waiting for a release on main
        if: ${{ !cancelled() && steps.ref.outcome == 'success' }}
        timeout-minutes: 115
        env:
          GH_TOKEN: ${{ github.token }}
          SVP_VERIFY_SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || '' }}
        run: bash deploy/ci/verify/gitops.sh release
      - name: Stop the sampler
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-sample.sh stop
      - name: Collect and filter the results
        if: always() && steps.ref.outcome == 'success'
        run: deploy/ci/verify-collect.sh
      # Whether job record-stg records the set: the scenario step passed (every check of it, release-set included) and
      # release-set.json passed the collect into the artifact. Not the wait for a release, whatever it gave: with no
      # status function GitHub would add success(), and a red wait would skip this step. A cancelled run never records.
      - name: Note whether the set of releases can be recorded
        id: record
        if: ${{ !cancelled() && steps.ref.outcome == 'success' && steps.scenario.outcome == 'success' }}
        run: |
          if [ -f "$RUNNER_TEMP/verify-artifact/release-set.json" ]; then
            echo "recorded=true" >>"$GITHUB_OUTPUT"
            echo "release-set.json is in the artifact: job record-stg records it on main"
          else
            echo "the scenario passed, but release-set.json is not in the artifact: nothing is recorded"
          fi
      - name: Keep the filtered results
        if: always() && steps.ref.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-${{ env.SCENARIO }}
          path: ${{ runner.temp }}/verify-artifact/
          retention-days: 30
          if-no-files-found: warn
      - name: make k8s-down
        if: always() && steps.ref.outcome == 'success'
        run: make k8s-down

  # The record of stg: once the scenario step of job gitops passed on main and its artifact holds release-set.json
  # (output recorded), the set of releases stg ran through every check of that run (written only when nothing moved
  # between the snapshots before smoke and after the last check, and only when the dispatch's targets left out no check)
  # becomes a deployment record of environment stg in svp-gitops (deploy/ci/record-stg.sh), which a pull request to
  # envs/prd/ there must match whole and which promote prd of images.yml copies. A dispatch or the weekly run alike;
  # a red wait for a release after the scenario does not keep it from being recorded. Skipped on a branch (the
  # environment takes main only), on a cancelled run, on a run with web_ref (job gitops then ran code of an svp-web
  # branch), and without that output. The token is the app's, for svp-gitops alone and deployments write alone; the job's
  # own token only reads this repository.
  record-stg:
    needs: gitops
    if: ${{ !cancelled() && needs.gitops.outputs.recorded == 'true' && github.ref == 'refs/heads/main' && inputs.web_ref == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: promote
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-gitops
          path: ${{ runner.temp }}/verify-gitops
      - id: app
        # Revoked when the job ends; narrower than the app's own permissions.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SVP_GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SVP_GITOPS_APP_PRIVATE_KEY }}
          owner: anhnvcoder
          repositories: svp-gitops
          permission-deployments: write
      - name: Record the set stg ran in svp-gitops
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: deploy/ci/record-stg.sh "$RUNNER_TEMP/verify-gitops/release-set.json"
