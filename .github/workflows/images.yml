# Images of the six services (docs/adr/0015-cicd-devsecops-stage5.md, sections 3-7 and 9): build only what changed,
# on native amd64 and arm64 runners; scan the local image with trivy and block secrets and CRITICAL vulnerabilities
# BEFORE anything is pushed; push exactly what was scanned; join a multi-arch index; sign it keyless with cosign and
# attest the SBOM (syft) and the scan result; promote the signed digests through a pull request; rescan released
# digests daily. The logic lives in deploy/ci/*.sh, which also run on a machine; this file wires jobs, permissions and
# artifacts.
#
# Security rules of this file (section 1):
#   - permissions: {} here, and each job declares only what it needs. Every job that runs on a pull request has only
#     contents: read: a pull request runs its own scripts before anyone has read them. Jobs that can write (packages,
#     id-token, security-events, contents and pull-requests for promote) or read the Actions API run only on main,
#     outside pull_request.
#   - Every action is pinned to a full commit SHA (the tag in the comment is for people and Renovate); only GitHub's
#     own actions and sigstore/cosign-installer.
#   - Untrusted values (inputs, branch names, matrix values from plan) reach scripts through env:, never ${{ }} inside
#     run:.
#   - actions/checkout never keeps the token in .git/config, except in promote, which pushes branch bot/promote.
name: images

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily rescan, off the top of the hour (busy for GitHub's scheduler). Kyverno accepts an attestation for 72 hours,
    # so two missed days are still fine.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      services:
        description: "Build these services instead of the changed ones: 'all', or names separated by spaces"
        type: string
        default: ""
      rescan:
        description: "Rescan the released digests now and replace their vuln attestations"
        type: boolean
        default: false
      values_ref:
        description: "With rescan: also the digests in the values files at this branch, SHA or refs/pull/<n>/head"
        type: string
        default: ""
      drill:
        description: "Build the two admission drill images drill-vulnerable and drill-unsigned (never run)"
        type: boolean
        default: false

permissions: {}

# One group per ref and mode: the scheduled rescan and the drill also run on refs/heads/main, and sharing the build's
# group would let them replace a queued push run. A run on main is never cancelled: cancelling one half-way through
# signing would leave a pushed digest without its signature. Runs on main follow each other, so each sees the result
# of the one before when it picks its base.
concurrency:
  group: >-
    images-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.rescan) && 'rescan'
    || (inputs.drill && 'drill' || 'build') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  last-success:
    # The base of a push build (section 3): head_sha of the newest successful push run of this workflow on main. A job
    # of its own because only it reads the Actions API; it checks out nothing and runs no code of the repository. When
    # the API fails the output stays empty and the job green: plan then builds all six (too much, never too little).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      runs: ${{ steps.api.outputs.runs }}
    steps:
      - id: api
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Only the fields plan reads, so the output stays small.
          runs_url="repos/$REPO/actions/workflows/images.yml/runs?branch=main&event=push&status=success&per_page=5"
          if runs=$(gh api "$runs_url" \
            --jq '{workflow_runs: [.workflow_runs[] | {head_sha, conclusion, event, head_branch}]}'); then
            echo "runs=$runs" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::The Actions API did not answer: this run builds every service."
          fi

  plan:
    # What this run does: mode (build, rescan, drill), base, images, matrix of legs (deploy/ci/plan.sh).
    # Every job after it starts its if: with a status function (!cancelled() && needs.plan.result == 'success'): an if:
    # without one gets an implicit success(), which is false when any job up the needs chain was skipped, and
    # last-success is skipped on every event but push.
    needs: last-success
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      images: ${{ steps.plan.outputs.images }}
      legs: ${{ steps.plan.outputs.legs }}
      has_images: ${{ steps.plan.outputs.has_images }}
      base: ${{ steps.plan.outputs.base }}
      values_changed: ${{ steps.plan.outputs.values_changed }}
      values_ref: ${{ steps.plan.outputs.values_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the base can be any earlier commit.
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          INPUT_SERVICES: ${{ inputs.services }}
          INPUT_RESCAN: ${{ inputs.rescan }}
          INPUT_DRILL: ${{ inputs.drill }}
          INPUT_VALUES_REF: ${{ inputs.values_ref }}
          LAST_SUCCESS_JSON: ${{ needs.last-success.outputs.runs }}
        run: deploy/ci/plan.sh

  build-nopush:
    # Pull requests and refs other than main: build, scan and gate exactly like main (steps 1-3 of section 4), push
    # nothing. Findings go to the job summary only (no Security tab upload from a pull request).
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &day
        id: day
        run: echo "day=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      - &trivy-cache
        # The trivy DB, one cache entry per day (trivy's advice against download limits); trivy still downloads a newer
        # DB when the cached one is stale. A pull request's cache stays in its own ref and never replaces main's.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - &build-scan-gate
        name: Build, scan and gate
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          SVP_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
        run: deploy/ci/build-image.sh "$IMAGE" "$ARCH" "$RUNNER_TEMP/leg"

  values-check:
    # A pull request that changes deploy/k8s/values/services/ may only point at releases signed by this workflow on
    # main whose vuln attestation is clean and at most 48 hours old (section 7, deploy/ci/values-check.sh). Anonymous
    # reads only, no token.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.values_changed == 'true'
      && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - env:
          BASE: ${{ needs.plan.outputs.base }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: deploy/ci/values-check.sh "$BASE"

  build:
    # main: the same steps 1-3, then push exactly the scanned image (step 4: by config digest) and hand the leg to the
    # jobs after it as an artifact (step 5). The gate step has no always() and no continue-on-error: a blocked image
    # stops the leg before the push. The cache is the only shared state, and no job holding id-token uses it.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps: &release-leg
      - *checkout
      - *day
      - *trivy-cache
      - *build-scan-gate
      - name: Push the scanned image, compare its config digest
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/push-image.sh "$IMAGE" "$ARCH" "$RUNNER_TEMP/leg"
      - name: Hand the leg over (manifest digest, scan report, SBOM, scan times)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leg-${{ matrix.image }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/leg/platform
            ${{ runner.temp }}/leg/repository
            ${{ runner.temp }}/leg/digest
            ${{ runner.temp }}/leg/config-digest
            ${{ runner.temp }}/leg/trivy.json
            ${{ runner.temp }}/leg/sbom.spdx.json
            ${{ runner.temp }}/leg/scan-started
            ${{ runner.temp }}/leg/scan-finished
            ${{ runner.temp }}/leg/db-updated-at
          if-no-files-found: error
          retention-days: 7
      - name: Keep the SARIF for the Security tab, blocked or not
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/leg/trivy.sarif
          if-no-files-found: ignore
          retention-days: 7

  merge:
    # One index per image from its two scanned manifests (section 4). Runs per image even when another image failed;
    # an image with a failed leg has no two artifacts and fails here: no index, no signature, no release.
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps: &merge
      - *checkout
      - &download-legs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: leg-${{ matrix.image }}-*
          path: ${{ runner.temp }}/legs
      - name: Join the two manifests into one index
        env:
          IMAGE: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d "$RUNNER_TEMP/legs/leg-$IMAGE-amd64" ] || [ ! -d "$RUNNER_TEMP/legs/leg-$IMAGE-arm64" ]; then
            echo "::error::$IMAGE: a leg did not pass (see the build job); no index, no signature, no release"
            exit 1
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/merge-index.sh "$IMAGE" "$RUNNER_TEMP/legs/leg-$IMAGE-amd64" "$RUNNER_TEMP/legs/leg-$IMAGE-arm64" \
            "$RUNNER_TEMP/index"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/index/repository
            ${{ runner.temp }}/index/tag
            ${{ runner.temp }}/index/digest
          if-no-files-found: error
          retention-days: 7

  sign:
    # Keyless signature on the index digest, SBOM attestation on each manifest, vuln attestation (both scans) on the
    # index (section 7). The only build-path job with id-token: write; it uses no cache. Its artifact release-<image>
    # (repository, tag, digest of the signed index) is what promotion to deploy/k8s/values/services/ reads.
    needs: [plan, merge]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps: &sign
      - *checkout
      - *download-legs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index-${{ matrix.image }}
          path: ${{ runner.temp }}/index
      - *cosign
      - name: Sign and attest
        env:
          IMAGE: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # Only the drill image may carry CRITICAL into its attestation; sign-image.sh refuses the flag for any other.
          [ "$IMAGE" != drill-vulnerable ] || flags=(--allow-critical)
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/sign-image.sh "${flags[@]}" "$RUNNER_TEMP/index" \
            "$RUNNER_TEMP/legs/leg-$IMAGE-amd64" "$RUNNER_TEMP/legs/leg-$IMAGE-arm64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/index/repository
            ${{ runner.temp }}/index/tag
            ${{ runner.temp }}/index/digest
          if-no-files-found: error
          retention-days: 7

  promote:
    # The release pull request (section 9, deploy/ci/promote.sh): rebuilds branch bot/promote from main with the newest
    # signed release of every service main does not run yet, never an older one, and opens or updates its pull request;
    # the owner approves its workflow runs and merges it. Runs when signing an image failed too: every image signed in
    # this run is promoted, the failed one is red in sign. The only job that writes to the repository: it pushes
    # bot/promote, never main, with the token actions/checkout keeps in .git/config here, and calls gh for the pull
    # request. No id-token, no packages, no actions: write: a pull request opened with GITHUB_TOKEN gets its checks once
    # the owner approves its runs, and checks of a dispatched run would not satisfy the required checks.
    needs: [plan, sign]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a release's commit is compared by ancestry with main's.
          fetch-depth: 0
          # The one exception to persist-credentials: false (section 1): this job pushes bot/promote.
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/releases
      - name: Rebuild bot/promote, open or update its pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/ci/promote.sh "$RUNNER_TEMP/releases"

  rescan:
    # Daily (and on dispatch rescan=true): every released digest in the values of main, of the open promote pull
    # request (bot/promote) and of the dispatch input values_ref is scanned again, manifest by manifest, and its vuln
    # attestation replaced with the real result; a CRITICAL is recorded first, then fails the job, which mails the
    # owner; a secret fails the job before anything is attested (deploy/ci/rescan.sh). Values of other refs are fetched
    # and read as data, never run. No cache: the job holds id-token.
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'rescan'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      packages: write
      id-token: write
    steps:
      - *checkout
      - *cosign
      - name: Rescan and attest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VALUES_REF: ${{ needs.plan.outputs.values_ref }}
          SVP_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
        run: |
          refs=(HEAD)
          # Only the bot's own pull request counts, never a fork's from a branch of the same name (common.sh).
          . deploy/ci/common.sh
          prs=$(promote_pr_list "$GITHUB_REPOSITORY")
          open=$(open_promote_pr <<<"$prs")
          if [ -n "$open" ]; then
            git fetch --no-tags --depth 1 origin "+refs/heads/bot/promote:refs/svp/promote"
            refs+=(refs/svp/promote)
          fi
          if [ -n "$VALUES_REF" ]; then
            # actions/checkout fetches no refs/pull/*, so fetch the ref itself (plan checked its form).
            git fetch --no-tags --depth 1 origin "+$VALUES_REF:refs/svp/values-ref"
            refs+=(refs/svp/values-ref)
          fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/ci/rescan.sh run "$RUNNER_TEMP/rescan" "${refs[@]}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-rescan
          path: ${{ runner.temp }}/rescan/sarif/*.sarif
          if-no-files-found: ignore
          retention-days: 7

  # Admission drill images (sections 7, 8): drill-vulnerable (an old base with CRITICAL on both architectures, signed
  # and attested like a release) and drill-unsigned (a clean build pushed with no signature). They exist only so the
  # cluster can be shown refusing them; no chart points to them and they never run. They go through the very same
  # steps as a release (YAML aliases of the build and merge jobs), so CRITICAL and the signature are the only
  # differences; only drill-vulnerable gets past the CRITICAL gate, and the secret gate holds for both.
  drill-build:
    needs: plan
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'drill'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps: *release-leg

  drill-merge:
    needs: [plan, drill-build]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'drill'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps: *merge

  drill-sign:
    # drill-vulnerable only: drill-unsigned stays unsigned on purpose.
    needs: [plan, drill-merge]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.mode == 'drill'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [drill-vulnerable]
    steps: *sign

  sarif:
    # Uploads the SARIF of main's builds and rescans to the Security tab, one category per image and architecture.
    # The only job with security-events: write; it runs no code of the repository. A report, not a check: not in
    # images-ok (a failed upload still turns the run red).
    needs: [plan, build, rescan]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && (needs.plan.outputs.mode == 'rescan'
      || (needs.plan.outputs.mode == 'build' && needs.plan.outputs.has_images == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: ${{ runner.temp }}/sarif
      - id: found
        run: |
          if find "$RUNNER_TEMP/sarif" -name '*.sarif' 2>/dev/null | grep -q .; then
            echo "any=true" >>"$GITHUB_OUTPUT"
          else
            echo "No SARIF to upload (no leg reached its scan)."
          fi
      - if: steps.found.outputs.any == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/sarif

  images-ok:
    # The required check of this workflow. Green only when every job succeeded or was skipped for a reason this job
    # recomputes from the event, the ref and plan's outputs (section 4): a skip from a wrong if: is red, and so are
    # failure and cancelled. Never skipped itself (GitHub counts a skipped required check as passed). Needs no
    # permission and runs no code of the repository.
    needs:
      - last-success
      - plan
      - build-nopush
      - values-check
      - build
      - merge
      - sign
      - promote
      - rescan
      - drill-build
      - drill-merge
      - drill-sign
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MODE: ${{ needs.plan.outputs.mode }}
          HAS_IMAGES: ${{ needs.plan.outputs.has_images }}
          VALUES_CHANGED: ${{ needs.plan.outputs.values_changed }}
        run: |
          main=false
          [ "$REF" = refs/heads/main ] && [ "$EVENT" != pull_request ] && main=true
          # skip_ok JOB: true when this run is one in which JOB does not run.
          skip_ok() {
            case $1 in
            last-success) [ "$EVENT" != push ] ;;
            build-nopush) [ "$main" = true ] || [ "$MODE" != build ] || [ "$HAS_IMAGES" != true ] ;;
            values-check) [ "$main" = true ] || [ "$VALUES_CHANGED" != true ] ;;
            build | merge | sign | promote) [ "$main" != true ] || [ "$MODE" != build ] || [ "$HAS_IMAGES" != true ] ;;
            rescan) [ "$MODE" != rescan ] ;;
            drill-build | drill-merge | drill-sign) [ "$MODE" != drill ] ;;
            *) false ;;
            esac
          }
          red=0
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            case $result in
            success) echo "ok    $job" ;;
            skipped)
              if skip_ok "$job"; then
                echo "ok    $job skipped: not part of this run"
              else
                echo "::error::$job was skipped, but this run needed it"
                red=1
              fi
              ;;
            *)
              echo "::error::$job: $result"
              red=1
              ;;
            esac
          done
          exit "$red"
