        exp_alerts: []
      - eval_time: 120s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 180s
        alertname: CircuitBreakerOpen
        exp_alerts: []

  # An open breaker of one instance fires even when another instance is closed; it resolves once its samples stop.
  - interval: 15s
    input_series:
      - series: 'svp_breaker_state{service_name="gateway",instance="a",target="engagement-service"}'
        values: '0 2x7 _x10'
      - series: 'svp_breaker_state{service_name="gateway",instance="b",target="engagement-service"}'
        values: '0x18'
    alert_rule_test:
      - eval_time: 75s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 90s
        alertname: CircuitBreakerOpen
