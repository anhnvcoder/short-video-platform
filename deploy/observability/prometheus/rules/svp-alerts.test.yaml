# promtool tests of svp-alerts.yaml and the Sloth recording rules. Run with `make slo-check`. Samples are 15 s
# apart, like the services' metric export.
# Loop gauges hold the Unix time of the last success; promtool time starts at 0, so a success is
# never recorded as 0 here (0 means "never succeeded"). A series that stops is written with `_`
# (no sample), never `stale`: OTLP-pushed series get no staleness marker.
rule_files:
  - svp-alerts.yaml
  - slo-generated.yaml

evaluation_interval: 15s

tests:
  # Breaker open (2) and half-open (1) in turn with sparse traffic fires once every sample of the last minute is above 0, one 0 resolves it.
  - interval: 15s
    input_series:
      - series: 'svp_breaker_state{service_name="gateway",instance="a",target="engagement-service"}'
        values: '0 0 2 1 2 1 2 2 2 0 0 0'
    alert_rule_test:
      - eval_time: 90s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 105s
        alertname: CircuitBreakerOpen
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: gateway
              instance: a
              target: engagement-service
            exp_annotations:
              summary: "gateway: circuit breaker to engagement-service has not been closed for 1 minute"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/circuit-breaker-open.md"
      - eval_time: 120s
        alertname: CircuitBreakerOpen
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: gateway
              instance: a
              target: engagement-service
            exp_annotations:
              summary: "gateway: circuit breaker to engagement-service has not been closed for 1 minute"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/circuit-breaker-open.md"
      - eval_time: 135s
        alertname: CircuitBreakerOpen
        exp_alerts: []

  # Breaker closed, or open for less than a minute, does not fire.
  - interval: 15s
    input_series:
      - series: 'svp_breaker_state{service_name="gateway",instance="a",target="engagement-service"}'
        values: '0 0 1 2 2 0 0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 60s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 90s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 180s
        alertname: CircuitBreakerOpen
        exp_alerts: []

  # Gateway recreated while its breaker is open for 30 s: the old instance stops exporting, the new one is closed; nothing fires.
  - interval: 15s
    input_series:
      - series: 'svp_breaker_state{service_name="gateway",instance="old",target="engagement-service"}'
        values: '0 0 0 2 2 2 _x20'
      - series: 'svp_breaker_state{service_name="gateway",instance="new",target="engagement-service"}'
        values: '_x6 0x20'
    alert_rule_test:
      - eval_time: 90s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 105s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 120s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 135s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 180s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 240s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 300s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 390s
        alertname: CircuitBreakerOpen
        exp_alerts: []

  # Gateway recreated while open for 45 s (four samples): still under a minute of samples, nothing fires.
  - interval: 15s
    input_series:
      - series: 'svp_breaker_state{service_name="gateway",instance="old",target="engagement-service"}'
        values: '0 0 2 2 2 2 _x20'
      - series: 'svp_breaker_state{service_name="gateway",instance="new",target="engagement-service"}'
        values: '_x6 0x20'
    alert_rule_test:
      - eval_time: 90s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 105s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 120s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 180s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 300s
        alertname: CircuitBreakerOpen
        exp_alerts: []

  # Breaker opening at the old instance's last sample does not fire after the restart.
  - interval: 15s
    input_series:
      - series: 'svp_breaker_state{service_name="gateway",instance="old",target="engagement-service"}'
        values: '0 0 0 0 0 2 _x20'
      - series: 'svp_breaker_state{service_name="gateway",instance="new",target="engagement-service"}'
        values: '_x6 0x20'
    alert_rule_test:
      - eval_time: 90s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 105s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 120s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 180s
        alertname: CircuitBreakerOpen
        exp_alerts: []

  # An open breaker of one instance fires even when another instance is closed; it resolves once its samples stop.
  - interval: 15s
    input_series:
      - series: 'svp_breaker_state{service_name="gateway",instance="a",target="engagement-service"}'
        values: '0 2x7 _x10'
      - series: 'svp_breaker_state{service_name="gateway",instance="b",target="engagement-service"}'
        values: '0x18'
    alert_rule_test:
      - eval_time: 75s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 90s
        alertname: CircuitBreakerOpen
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: gateway
              instance: a
              target: engagement-service
            exp_annotations:
              summary: "gateway: circuit breaker to engagement-service has not been closed for 1 minute"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/circuit-breaker-open.md"
      - eval_time: 120s
        alertname: CircuitBreakerOpen
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: gateway
              instance: a
              target: engagement-service
            exp_annotations:
              summary: "gateway: circuit breaker to engagement-service has not been closed for 1 minute"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/circuit-breaker-open.md"
      - eval_time: 150s
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 165s
        alertname: CircuitBreakerOpen
        exp_alerts: []

  # outbox-relay: healthy loop, the last success never older than the cycle plus a slow lap, does not fire.
  - interval: 15s
    input_series:
      - series: 'svp_loop_last_success_seconds{service_name="video-service",instance="a",loop="outbox-relay"}'
        values: '1+15x4 61x3 121+15x28'
    alert_rule_test:
      - eval_time: 120s
        alertname: BackgroundLoopStalled
        exp_alerts: []
      - eval_time: 135s
        alertname: BackgroundLoopStalled
        exp_alerts: []
      - eval_time: 555s
        alertname: BackgroundLoopStalled
        exp_alerts: []

  # outbox-relay: stalled after a success while still exporting fires once a sample shows the last success older than 120 s; another healthy instance does not hide it; it resolves 45 s after its last sample.
  - interval: 15s
    input_series:
      - series: 'svp_loop_last_success_seconds{service_name="video-service",instance="a",loop="outbox-relay"}'
        values: '1+15x4 61x10 _x10'
      - series: 'svp_loop_last_success_seconds{service_name="video-service",instance="b",loop="outbox-relay"}'
        values: '1+15x25'
    alert_rule_test:
      - eval_time: 180s
        alertname: BackgroundLoopStalled
        exp_alerts: []
      - eval_time: 195s
        alertname: BackgroundLoopStalled
        exp_alerts:
          - exp_labels:
              severity: page
