              group: feed-service
            exp_annotations:
              summary: "feed-service: consumer group feed-service sent records from video.lifecycle.v1 to its dead-letter topic"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/kafka-dlq-records.md"
      - eval_time: 660s
        alertname: KafkaDLQRecords
        exp_alerts: []

  # Lag of feed-service for 2 minutes fires; media-worker lag during one transcode does not.
  - interval: 15s
    input_series:
      - series: 'redpanda_kafka_consumer_group_lag_max{service_name="redpanda",redpanda_group="feed-service",shard="0"}'
        values: '0 3x12 0x4'
      - series: 'redpanda_kafka_consumer_group_lag_max{service_name="redpanda",redpanda_group="media-worker",shard="0"}'
        values: '0 1x40 0'
    alert_rule_test:
      - eval_time: 105s
        alertname: KafkaConsumerLagHigh
        exp_alerts: []
      - eval_time: 135s
        alertname: KafkaConsumerLagHigh
        exp_alerts:
          - exp_labels:
              severity: page
              redpanda_group: feed-service
            exp_annotations:
              summary: "Kafka consumer group feed-service has had lag for 2 minutes"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/kafka-consumer-lag-high.md"
      - eval_time: 210s
        alertname: KafkaConsumerLagHigh
        exp_alerts: []
      - eval_time: 600s
        alertname: KafkaConsumerLagHigh
        exp_alerts: []

  # SLO rules: feed with 2xx only has error ratio 0; 503s on POST /videos count as errors; half of the feed requests over 150 ms.
  - interval: 15s
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="gateway",http_request_method="GET",http_route="/feed/explore",http_response_status_code="200"}'
        values: '0+4x40'
      - series: 'http_server_request_duration_seconds_bucket{service_name="gateway",http_request_method="GET",http_route="/feed/explore",http_response_status_code="200",le="0.15"}'
        values: '0+2x40'
      - series: 'http_server_request_duration_seconds_count{service_name="gateway",http_request_method="POST",http_route="/videos",http_response_status_code="201"}'
        values: '0+3x40'
      - series: 'http_server_request_duration_seconds_count{service_name="gateway",http_request_method="POST",http_route="/videos",http_response_status_code="503"}'
        values: '0+1x40'
    promql_expr_test:
      - expr: 'slo:sli_error:ratio_rate5m{sloth_slo="feed-availability"}'
        eval_time: 10m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{sloth_id="svp-feed-availability",sloth_service="svp",sloth_slo="feed-availability",sloth_window="5m"}'
            value: 0
      - expr: 'slo:sli_error:ratio_rate5m{sloth_slo="feed-latency"}'
        eval_time: 10m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{sloth_id="svp-feed-latency",sloth_service="svp",sloth_slo="feed-latency",sloth_window="5m"}'
            value: 0.5
      - expr: 'slo:sli_error:ratio_rate5m{sloth_slo="upload-init-availability"}'
        eval_time: 10m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{sloth_id="svp-upload-init-availability",sloth_service="svp",sloth_slo="upload-init-availability",sloth_window="5m"}'
            value: 0.25

  # SLO rules: a window with failed videos only is all errors; ready in 120 s is good, slower is bad; no traffic gives no ratio, not a good one.
  - interval: 15s
    input_series:
      - series: 'svp_video_ready_duration_seconds_count{service_name="video-service",outcome="failed"}'
        values: '0+1x40'
      - series: 'svp_video_ready_duration_seconds_bucket{service_name="video-service",outcome="failed",le="120"}'
        values: '0+1x40'
      - series: 'svp_video_ready_duration_seconds_count{service_name="video-service",outcome="ready"}'
        values: '_x20 0+4x20'
      - series: 'svp_video_ready_duration_seconds_bucket{service_name="video-service",outcome="ready",le="120"}'
        values: '_x20 0+3x20'
    promql_expr_test:
      - expr: 'slo:sli_error:ratio_rate5m{sloth_slo="video-ready-latency"}'
        eval_time: 4m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{sloth_id="svp-video-ready-latency",sloth_service="svp",sloth_slo="video-ready-latency",sloth_window="5m"}'
            value: 1
      - expr: 'slo:sli_error:ratio_rate5m{sloth_slo="feed-availability"}'
        eval_time: 4m
        exp_samples: []
      - expr: 'slo:sli_error:ratio_rate5m{sloth_slo="upload-init-availability"}'
        eval_time: 4m
        exp_samples: []

  # SLO rules, sparse traffic as on the lab: feed requests during 2 minutes, then none for 2 hours
  # while the counters are still exported. Every 5 m ratio of the quiet time is NaN (0/0; counted
  # with `x != x`, true only for NaN), the 30-day SLI, period burn rate and budget remaining are
  # finite: 8 of 40 requests 5xx, 16 of 40 slower than 150 ms. promtool compares values exactly,
  # hence round() on the ratios.
  - interval: 15s
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="gateway",http_request_method="GET",http_route="/feed/explore",http_response_status_code="200"}'
        values: '0+4x8 32x480'
      - series: 'http_server_request_duration_seconds_bucket{service_name="gateway",http_request_method="GET",http_route="/feed/explore",http_response_status_code="200",le="0.15"}'
        values: '0+2x8 16x480'
      - series: 'http_server_request_duration_seconds_count{service_name="gateway",http_request_method="GET",http_route="/feed/following",http_response_status_code="503"}'
        values: '0+1x8 8x480'
      - series: 'http_server_request_duration_seconds_bucket{service_name="gateway",http_request_method="GET",http_route="/feed/following",http_response_status_code="503",le="0.15"}'
        values: '0+1x8 8x480'
    promql_expr_test:
      - expr: 'count(slo:sli_error:ratio_rate5m{sloth_slo=~"feed-availability|feed-latency"} != slo:sli_error:ratio_rate5m{sloth_slo=~"feed-availability|feed-latency"})'
        eval_time: 2h
        exp_samples:
          - labels: '{}'
            value: 2
      - expr: 'round(slo:sli_error:ratio_rate30d{sloth_slo="feed-availability"}, 0.0001)'
        eval_time: 2h
        exp_samples:
          - labels: '{sloth_id="svp-feed-availability",sloth_service="svp",sloth_slo="feed-availability",sloth_window="30d"}'
            value: 0.2
      - expr: 'round(slo:sli_error:ratio_rate30d{sloth_slo="feed-latency"}, 0.0001)'
        eval_time: 2h
        exp_samples:
          - labels: '{sloth_id="svp-feed-latency",sloth_service="svp",sloth_slo="feed-latency",sloth_window="30d"}'
            value: 0.4
      - expr: 'round(slo:period_burn_rate:ratio{sloth_slo="feed-availability"}, 0.001)'
        eval_time: 2h
        exp_samples:
          - labels: '{sloth_id="svp-feed-availability",sloth_service="svp",sloth_slo="feed-availability",sloth_window="30d"}'
            value: 200
      - expr: 'round(slo:period_error_budget_remaining:ratio{sloth_slo="feed-latency"}, 0.001)'
        eval_time: 2h
        exp_samples:
          - labels: '{sloth_id="svp-feed-latency",sloth_service="svp",sloth_slo="feed-latency",sloth_window="30d"}'
            value: -39

  # SLO web-availability: half of the web responses are 503 for 2 hours; both the page pair (5 m and 1 h) and the ticket pair
  # (2 h and 1 d) are over their limits, so the alert fires once per severity. The 4xx and the 200s are not errors.
  - interval: 15s
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="web",http_request_method="GET",http_response_status_code="200"}'
        values: '0+10x480'
      - series: 'http_server_request_duration_seconds_count{service_name="web",http_request_method="GET",http_response_status_code="404"}'
        values: '0+5x480'
      - series: 'http_server_request_duration_seconds_count{service_name="web",http_request_method="POST",http_response_status_code="503"}'
        values: '0+15x480'
    alert_rule_test:
      - eval_time: 2h
        alertname: WebAvailabilityBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: page
              sloth_severity: page
              sloth_id: svp-web-availability
              sloth_service: svp
              sloth_slo: web-availability
            exp_annotations:
              summary: "web: server responses (pages, Server Actions, /rum) burn the 99.9% availability budget"
              title: "(page) svp web-availability SLO error budget burn rate is too fast."
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/web-availability-budget-burn.md"
          - exp_labels:
              severity: ticket
              sloth_severity: ticket
              sloth_id: svp-web-availability
              sloth_service: svp
              sloth_slo: web-availability
            exp_annotations:
              summary: "web: server responses (pages, Server Actions, /rum) burn the 99.9% availability budget"
              title: "(ticket) svp web-availability SLO error budget burn rate is too fast."

  # SLO web-availability: no 5xx series at all (`or vector(0)` makes the error ratio 0) and a lone 5xx per 2000 responses
  # (0.05%, half of the 0.1% budget) fire nothing; a quiet web server (no responses) has no ratio, so nothing fires either.
  - interval: 15s
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="web",http_request_method="GET",http_response_status_code="200"}'
        values: '0+100x480'
      - series: 'http_server_request_duration_seconds_count{service_name="web",http_request_method="GET",http_response_status_code="500"}'
        values: '0+0.05x480'
      - series: 'http_server_request_duration_seconds_count{service_name="gateway",http_request_method="GET",http_response_status_code="503"}'
        values: '0+10x480'
    alert_rule_test:
      - eval_time: 2h
        alertname: WebAvailabilityBudgetBurn
        exp_alerts: []
    promql_expr_test:
      - expr: 'round(slo:sli_error:ratio_rate5m{sloth_slo="web-availability"}, 0.0001)'
        eval_time: 2h
        exp_samples:
          - labels: '{sloth_id="svp-web-availability",sloth_service="svp",sloth_slo="web-availability",sloth_window="5m"}'
            value: 0.0005

  - interval: 15s
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="gateway",http_request_method="GET",http_response_status_code="503"}'
        values: '0+10x480'
    alert_rule_test:
      - eval_time: 2h
        alertname: WebAvailabilityBudgetBurn
        exp_alerts: []
    promql_expr_test:
      - expr: 'slo:sli_error:ratio_rate5m{sloth_slo="web-availability"}'
        eval_time: 2h
        exp_samples: []

  # SLO web-inp: 90% of the loads over 200 ms for 2 hours fires the ticket alert (limit 3 x 25% on 2 h and 1 d). It is the only
  # severity: the page alert is disabled because its limits (14.4 x and 6 x 25%) are above 100%.
  - interval: 15s
    input_series:
      - series: 'svp_web_vital_inp_seconds_count{service_name="web",route="/"}'
        values: '0+6x480'
      - series: 'svp_web_vital_inp_seconds_bucket{service_name="web",route="/",le="0.2"}'
        values: '0+0.6x480'
      - series: 'svp_web_vital_inp_seconds_bucket{service_name="web",route="/",le="+Inf"}'
        values: '0+6x480'
    alert_rule_test:
      - eval_time: 2h
        alertname: WebINPBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              sloth_severity: ticket
              sloth_id: svp-web-inp
              sloth_service: svp
              sloth_slo: web-inp
            exp_annotations:
              summary: "web: more than 25% of page loads have an INP above 200 ms (budget burn)"
              title: "(ticket) svp web-inp SLO error budget burn rate is too fast."
    promql_expr_test:
      - expr: 'round(slo:sli_error:ratio_rate5m{sloth_slo="web-inp"}, 0.0001)'
        eval_time: 2h
        exp_samples:
          - labels: '{sloth_id="svp-web-inp",sloth_service="svp",sloth_slo="web-inp",sloth_window="5m"}'
            value: 0.9

  # SLO web-inp: 20% of the loads over 200 ms (under the 25% budget) fires nothing, nor does a window with no RUM beacon (no
  # ratio rather than a good one), nor a beacon of another service.
  - interval: 15s
    input_series:
      - series: 'svp_web_vital_inp_seconds_count{service_name="web",route="/"}'
        values: '0+10x480'
      - series: 'svp_web_vital_inp_seconds_bucket{service_name="web",route="/",le="0.2"}'
        values: '0+8x480'
      - series: 'svp_web_vital_inp_seconds_count{service_name="other",route="/"}'
        values: '0+10x480'
      - series: 'svp_web_vital_inp_seconds_bucket{service_name="other",route="/",le="0.2"}'
        values: '0+0x480'
    alert_rule_test:
      - eval_time: 2h
        alertname: WebINPBudgetBurn
        exp_alerts: []
    promql_expr_test:
      - expr: 'round(slo:sli_error:ratio_rate5m{sloth_slo="web-inp"}, 0.0001)'
        eval_time: 2h
        exp_samples:
          - labels: '{sloth_id="svp-web-inp",sloth_service="svp",sloth_slo="web-inp",sloth_window="5m"}'
            value: 0.2

  - interval: 15s
    input_series:
      - series: 'http_server_request_duration_seconds_count{service_name="web",http_request_method="GET",http_response_status_code="200"}'
        values: '0+10x480'
    alert_rule_test:
      - eval_time: 2h
        alertname: WebINPBudgetBurn
        exp_alerts: []
    promql_expr_test:
      - expr: 'slo:sli_error:ratio_rate5m{sloth_slo="web-inp"}'
        eval_time: 2h
        exp_samples: []

  # Postgres WAL archiving: the archiver's last failure later than its last success for 5 minutes pages, and a success
  # after it resolves the alert. Scraped series (PodMonitor svp-pg), so the times are those of pg_stat_archiver.
  - interval: 15s
    input_series:
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="svp-data",pod="svp-pg-1"}'
        values: '100x39 700x20'
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="svp-data",pod="svp-pg-1"}'
        values: '-1x9 200x50'
    alert_rule_test:
      - eval_time: 135s
        alertname: PostgresWALArchivingFailing
        exp_alerts: []
      - eval_time: 435s
        alertname: PostgresWALArchivingFailing
        exp_alerts: []
      - eval_time: 465s
        alertname: PostgresWALArchivingFailing
        exp_alerts:
          - exp_labels:
              severity: page
              namespace: svp-data
              pod: svp-pg-1
            exp_annotations:
              summary: "Postgres svp-pg-1: archiving WAL to the backup object store has been failing for 5 minutes"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/postgres-wal-archiving-failing.md"
      - eval_time: 615s
        alertname: PostgresWALArchivingFailing
        exp_alerts: []

  # Never failed (-1), with or without a success yet, and a failure older than the last success: nothing fires.
  - interval: 15s
    input_series:
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="svp-data",pod="svp-pg-1"}'
        values: '-1x9 150x50'
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="svp-data",pod="svp-pg-1"}'
        values: '-1x29 120x30'
    alert_rule_test:
      - eval_time: 120s
        alertname: PostgresWALArchivingFailing
        exp_alerts: []
      - eval_time: 870s
        alertname: PostgresWALArchivingFailing
        exp_alerts: []

  # The newest base backup (taken at 1000 s) older than 26 hours fires the ticket; a new backup at 28 h resolves it.
  - interval: 10m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="svp-data",pod="svp-pg-1"}'
        values: '1000x167 100800x30'
    alert_rule_test:
      - eval_time: 26h
        alertname: PostgresBackupTooOld
        exp_alerts: []
      - eval_time: 27h
        alertname: PostgresBackupTooOld
        exp_alerts:
          - exp_labels:
              severity: ticket
              backup: stale
              namespace: svp-data
              pod: svp-pg-1
            exp_annotations:
              summary: "Postgres svp-pg-1: the newest base backup is more than 26 hours old"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/postgres-backup-too-old.md"
      - eval_time: 29h
        alertname: PostgresBackupTooOld
        exp_alerts: []

  # A new cluster whose first backup has not completed (the plugin reports 0) does not fire within the hour, nor once its
  # first backup lands at 10 minutes; 0 for over an hour fires the ticket.
  - interval: 1m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="svp-data",pod="svp-pg-1"}'
        values: '0x90'
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="svp-data",pod="svp-pg-2"}'
        values: '0x9 600x80'
    alert_rule_test:
      - eval_time: 59m
        alertname: PostgresBackupTooOld
        exp_alerts: []
      - eval_time: 61m
        alertname: PostgresBackupTooOld
        exp_alerts:
          - exp_labels:
              severity: ticket
              backup: none
              namespace: svp-data
              pod: svp-pg-1
            exp_annotations:
              summary: "Postgres svp-pg-1: no base backup for an hour"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/postgres-backup-too-old.md"

  # No series at all (compose, or the cluster before PodMonitor svp-pg is scraped): neither backup alert fires.
  - interval: 1m
    input_series:
      - series: 'up{job="svp-obs/svp-pg"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 3h
        alertname: PostgresBackupTooOld
        exp_alerts: []
      - eval_time: 3h
        alertname: PostgresWALArchivingFailing
        exp_alerts: []

  # Argo CD: series scraped from the application controller end with `stale` (a scrape staleness marker) when the
  # Application's status changes; the next status is a new series.
  # gateway turns Degraded at 5m: pending until 15m, fires after; healthy before, never ArgoCDApplicationNotConverged.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="gateway",dest_namespace="svp",sync_status="Synced",health_status="Healthy"}'
        values: '1x4 stale'
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="gateway",dest_namespace="svp",sync_status="Synced",health_status="Degraded"}'
        values: '_x5 1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: ArgoCDApplicationDegraded
        exp_alerts: []
      - eval_time: 16m
        alertname: ArgoCDApplicationDegraded
        exp_alerts:
          - exp_labels:
              severity: page
              name: gateway
              dest_namespace: svp
            exp_annotations:
              summary: "Argo CD Application gateway (svp): Degraded, Missing or Unknown for 10 minutes"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/argocd-application-degraded.md"
      - eval_time: 16m
        alertname: ArgoCDApplicationNotConverged
        exp_alerts: []

  # Degraded for 5 minutes, then Missing: one Application across the change of label, so it fires 10 minutes after
  # the first, not after the second.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="gateway",dest_namespace="svp",sync_status="Synced",health_status="Degraded"}'
        values: '1x4 stale'
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="gateway",dest_namespace="svp",sync_status="OutOfSync",health_status="Missing"}'
        values: '_x5 1x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: ArgoCDApplicationDegraded
        exp_alerts:
          - exp_labels:
              severity: page
              name: gateway
              dest_namespace: svp
            exp_annotations:
              summary: "Argo CD Application gateway (svp): Degraded, Missing or Unknown for 10 minutes"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/argocd-application-degraded.md"

  # Degraded for 8 minutes, then Healthy again (a pod that crashed while its node restarted): never fires.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="gateway",dest_namespace="svp",sync_status="Synced",health_status="Degraded"}'
        values: '1x7 stale'
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="gateway",dest_namespace="svp",sync_status="Synced",health_status="Healthy"}'
        values: '_x8 1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCDApplicationDegraded
        exp_alerts: []

  # Degraded for 8 minutes, then the Application is gone (removed from components.json): its series ends, never fires.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="media-worker",dest_namespace="svp",sync_status="Synced",health_status="Degraded",operation=""}'
        values: '1x7 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCDApplicationDegraded
        exp_alerts: []

  # Removed from components.json while Degraded: its finalizer deletes what it deployed for 20 minutes (operation
  # delete, Missing once nothing is left), then the Application is gone. A deletion on purpose: no page while it runs,
  # and under 30 minutes no ticket either.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="media-worker",dest_namespace="svp",sync_status="OutOfSync",health_status="Degraded",operation="delete"}'
        values: '1x14 stale'
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="media-worker",dest_namespace="svp",sync_status="OutOfSync",health_status="Missing",operation="delete"}'
        values: '_x15 1x4 stale'
    alert_rule_test:
      - eval_time: 18m
        alertname: ArgoCDApplicationDegraded
        exp_alerts: []
      - eval_time: 18m
        alertname: ArgoCDApplicationNotConverged
        exp_alerts: []

  # OutOfSync for good (the automated sync keeps failing) while what runs stays Healthy: a ticket after 30 minutes.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="gateway",dest_namespace="svp",sync_status="OutOfSync",health_status="Healthy"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 29m
        alertname: ArgoCDApplicationNotConverged
        exp_alerts: []
      - eval_time: 31m
        alertname: ArgoCDApplicationNotConverged
        exp_alerts:
          - exp_labels:
              severity: ticket
              name: gateway
              dest_namespace: svp
            exp_annotations:
              summary: "Argo CD Application gateway (svp): not Synced and Healthy for 30 minutes"
              runbook_url: "https://github.com/anhnvcoder/svp-backend/blob/main/docs/runbooks/argocd-application-degraded.md"
      - eval_time: 31m
        alertname: ArgoCDApplicationDegraded
        exp_alerts: []

  # A canary paused (Suspended) for 20 minutes, then Healthy: under 30 minutes, no ticket.
  - interval: 1m
    input_series:
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="gateway",dest_namespace="svp",sync_status="Synced",health_status="Suspended"}'
        values: '1x19 stale'
      - series: 'argocd_app_info{job="svp-obs/argocd-application-controller",namespace="argocd",name="gateway",dest_namespace="svp",sync_status="Synced",health_status="Healthy"}'
        values: '_x20 1x20'
    alert_rule_test:
      - eval_time: 40m
        alertname: ArgoCDApplicationNotConverged
        exp_alerts: []

  # No Argo CD (compose, the dev path): no series, neither alert.
  - interval: 1m
    input_series:
      - series: 'up{job="svp-obs/svp-pg"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1h
        alertname: ArgoCDApplicationDegraded
        exp_alerts: []
      - eval_time: 1h
        alertname: ArgoCDApplicationNotConverged
        exp_alerts: []
