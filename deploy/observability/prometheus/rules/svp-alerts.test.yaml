      - eval_time: 195s
        alertname: BackgroundLoopStalled
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: video-service
              instance: a
              loop: outbox-relay
            exp_annotations:
              summary: "video-service: background loop outbox-relay has not succeeded for 2 minutes"
      - eval_time: 255s
        alertname: BackgroundLoopStalled
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: video-service
              instance: a
              loop: outbox-relay
            exp_annotations:
