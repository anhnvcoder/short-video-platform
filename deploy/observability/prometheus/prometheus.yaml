# Prometheus configuration of grafana/otel-lgtm 0.36.0 (/otel-lgtm/prometheus.yaml in the image),
# mounted read-only over the image's own.
# Copied from the image unchanged except for evaluation_interval, retention, rule_files and
# alerting: re-check it against the image's file when the image is upgraded. run-prometheus.sh
# keeps turning on the OTLP and remote-write receivers and exemplar storage on the command line;
# the image scrapes nothing itself (Redpanda is scraped by the obs Collector).

global:
  scrape_native_histograms: true
  # Rules run every 15 s, the export interval of the services.
  evaluation_interval: 15s
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m
    # The SLOs are computed over 30 days (slo:sli_error:ratio_rate30d); the binary's default of 15 days
    # would drop errors still inside that window. Blocks are deleted only once they are wholly older
    # than this, so the full 30 days stay.
    retention:
      time: 30d

# Mounted from deploy/observability/prometheus/rules/. Listed one by one: the directory also holds
# the promtool test file, which is not a rule file.
rule_files:
  # Generated by `make slo` from deploy/observability/slo/svp-slos.yaml.
  - /otel-lgtm/svp-rules/slo-generated.yaml
  - /otel-lgtm/svp-rules/svp-alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
