# Loki configuration of grafana/otel-lgtm 0.36.0 (/otel-lgtm/loki-config.yaml in the image),
# mounted read-only over the image's own.
# Copied from the image unchanged except for limits_config at the end: re-check it against the
# image's file when the image is upgraded.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false

# Logs arrive by OTLP. Only service.name becomes an index label (service_name); every other
# resource attribute, trace_id and span_id stay structured metadata, so no high-cardinality value
# (instance id, trace id, user or video id) creates streams.
limits_config:
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
