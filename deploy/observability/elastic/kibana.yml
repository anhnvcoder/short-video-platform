# Kibana of the `obs-elastic` profile, the Elastic stack kept only to compare with LGTM. Elasticsearch
# security is off, so Kibana has no login: accepted only because it is published on the host's
# loopback and holds local lab data, as with Grafana's anonymous Admin.
server.host: "0.0.0.0"
server.shutdownTimeout: "5s"
elasticsearch.hosts: ["http://elasticsearch:9200"]

# The lab keeps its data on the machine: no usage telemetry to Elastic, no
# news feed, and Fleet does not reach the Elastic Package Registry.
telemetry.optIn: false
telemetry.allowChangingOptInStatus: false
newsfeed.enabled: false
xpack.fleet.isAirGapped: true
