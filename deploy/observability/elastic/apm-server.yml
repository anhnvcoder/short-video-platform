# Standalone APM Server of the `obs-elastic` profile (docs/adr/0012-elastic-vs-grafana-stage3.md).
# It takes OTLP from the Collector and writes the traces-apm*, metrics-apm* and logs-apm* data
# streams, whose index templates Elasticsearch installs itself (its apm-data plugin): no Fleet,
# no integration to set up in Kibana. No auth (no secret token, no API key) because Elasticsearch
# security is off: local lab only, reachable inside the compose network only.
apm-server:
  host: "0.0.0.0:8200"

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

logging.to_stderr: true
