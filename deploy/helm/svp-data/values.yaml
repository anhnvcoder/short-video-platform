# Data tier in namespace svp-data. Installed by deploy/k8s/install.sh as wave 4 of argocd/apps/components.json of
# svp-gitops: after the CloudNativePG operator and KEDA (wave 2, whose CRDs its Cluster and ClusterTriggerAuthentication
# need), Redpanda and the Barman Cloud plugin (wave 3, whose CRD its ObjectStore needs), before observability and the
# services. Every Secret it reads is written by deploy/k8s/secrets.sh from .env before this release; none is in git.

postgres:
  # Major 15 like the host's Postgres the tests run on; minimal: no extension is needed.
  image: ghcr.io/cloudnative-pg/postgresql:15.19-minimal-trixie@sha256:f6091200bc5e1926efea8babe8a511d091e9a253d8f33fe4e920d0e89a67b57e
  storage: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  # WAL archiving and base backups to bucket pg-backups of the object store s3 through the Barman Cloud plugin
  # (templates/backup.yaml).
  backup:
    # The archive generation svp-pg writes its WAL and base backups to, a prefix of the bucket. A Cluster restored from
    # backups must archive into a new, empty one (the recovery Job refuses an archive that already holds WAL, and two
    # generations in one prefix would mix their backups), so each restore of make drill-k8s-backup starts the next
    # generation, svp-pg-<yymmddhhmmss> (UTC), and deploy/k8s/install.sh passes the one the running Cluster uses with
    # --set, so that make k8s-up keeps it. This default is the first generation's, that of a new cluster.
    serverName: svp-pg
    # The plugin's sidecar in the Postgres pod (and in the recovery Job's pod): Barman compresses and uploads WAL and
    # base backups. The memory limit bounds the page cache a base backup fills (plugin issue #825).
    sidecarResources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  # Set only by make drill-k8s-backup (deploy/k8s/drills/backup.sh), on the command line of the one upgrade that
  # creates svp-pg again from its backups, never in a file: source is the archive generation to restore from (the one
  # the deleted Cluster archived to), targetTime (RFC 3339) an optional point in time to stop the recovery at (PITR).
  # CloudNativePG reads bootstrap only when it creates the first instance, so the next upgrade without these values
  # removes them from the Cluster and changes nothing in the restored database.
  recovery:
    source: ""
    targetTime: ""

valkey:
  image: docker.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
  # CPU limit one core, not 200m: the CFS quota is enforced per 100 ms period, and at 200m Valkey was throttled 4-14
  # periods a minute while idle. A throttled period stalls it for longer than the gateway's 50 ms rate-limit store
  # timeout, so a login burst left the shared bucket for each pod's fallback counter. Valkey runs commands on one
  # thread, so one core is about the most it can use; the request stays small, it is mostly idle.
  resources:
    requests: {cpu: 20m, memory: 16Mi}
    limits: {cpu: "1", memory: 128Mi}

s3:
  # The object store, the same image as compose's s3 (RustFS), pinned by the digest of its multi-arch index.
  image: docker.io/rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
  storage: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
  # Presigned POST uploads and HLS playback from the host go through Gateway svp at https://<host>:8443.
  host: s3.svp.localhost
  # The origins whose pages may read the store's answers, set by the s3-init Job as the CORS rules of each bucket:
  # POST to uploads, GET and HEAD at media, nothing else. The browser talks to the store cross-origin, hls.js loading
  # playlists and segments with XHR and the upload page posting the file with XHR (its progress listener makes that a
  # preflight) (threat model WEB-10). Only the web client's origin in the cluster: the web clients of compose and
  # make dev of svp-web (http://localhost:3001, :3002) use compose's store, never this one. Commas without spaces.
  corsAllowedOrigins: https://svp.localhost:8443

redpanda:
  # The broker image, for rpk in the init Job.
  image: docker.io/redpandadata/redpanda:v26.2.4@sha256:c98c2f04a751e6646012cc701bac5183252cee44c88ba1dfa412e4c7124f2e89
  brokers: redpanda.svp-data.svc.cluster.local:9092
  adminHosts: redpanda-0.redpanda.svp-data.svc.cluster.local:9644

# The init Jobs (Postgres bootstrap, the object store s3, Redpanda). waitSeconds bounds how long each waits for its
# server after an install or upgrade before it fails.
initJobs:
  waitSeconds: 300
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 512Mi}

# Who may reach the data pods. Pods are chosen by label, so the policies exist before
# their clients do: the six services and their migrate Jobs are labelled app.kubernetes.io/name=<service>.
clients:
  # Database of each service, by its pods and its migrate Job.
  postgres: [user-service, video-service, engagement-service, feed-service]
  # Rate limits (db 10), the explore cache (db 14) and the web client's sessions (db 9).
  valkey: [gateway, feed-service, web]
  kafka: [user-service, video-service, engagement-service, feed-service, media-worker]
  s3: [video-service, media-worker]
