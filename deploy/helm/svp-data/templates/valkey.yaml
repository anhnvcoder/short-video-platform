{{- /*
Valkey in place of the host's Redis (ADR-0014 section 4), at valkey.svp-data:6379 with the same db numbers and key
prefixes: gateway db 10 (svp:gw:), feed-service db 14 (svp:feed:). Rate limits and a cache only, so nothing is
persisted. noeviction as on the host (ADR-0010 section 1): when full, writes fail and the gateway falls back to its
in-process counter with a metric, rather than rate-limit keys being dropped silently.

No password: db numbers are no boundary between clients (IN-7, accepted locally); the NetworkPolicy lets only the
gateway and feed-service reach it.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The image's valkey user and group; its entrypoint changes user only when started as root.
        {{- include "svp-data.podSecurityContext" (dict "uid" 999 "gid" 1000) | nindent 8 }}
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          args: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb",
                 "--maxmemory-policy", "noeviction"]
          ports:
            - name: valkey
              containerPort: 6379
          # TCP probes, not an exec of valkey-cli ping: an exec starts a process in the container's cgroup every period,
          # which counts against its CPU limit. With persistence off there is no loading phase in which the port is open
          # but commands are refused, so an open port means Valkey answers.
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          securityContext:
            {{- include "svp-data.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # The image's working directory; nothing is saved there with persistence off, but it must be writable.
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
