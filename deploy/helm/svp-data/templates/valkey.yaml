{{- /*
Valkey in place of the host's Redis, at valkey.svp-data:6379 with the same db numbers and key
prefixes: gateway db 10 (svp:gw:), feed-service db 14 (svp:feed:), the web client db 9 (svp:web:, its sessions and
refresh locks). Rate limits, a cache and sessions, none worth persisting: when the pod restarts, every web session is
lost and users log in again. noeviction as on the host: when full, writes fail (the gateway falls
back to its in-process counter with a metric, a login fails) rather than rate-limit keys or someone's session being
dropped silently.

No password: db numbers are no boundary between clients (IN-7, accepted locally); the NetworkPolicy lets only the
gateway, feed-service and the web client reach it. A session holds the user's access and refresh tokens, so every one
of the three can read and write every session. Accepted on a one-user lab machine (threat model WEB-22): a taken
gateway pod can already act as any user through gRPC (IN-2), and a taken feed-service pod, which reaches neither the
gateway nor the internet, could only copy someone's tokens into a session of the attacker's own. Revisit on the cloud
(Valkey with AUTH, per-client ACLs and TLS, or an instance of its own for sessions), or sooner if feed-service gets
a new way out.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        # A user and group above 10000, not the image's valkey (999:1000): ids that low may belong to an account of the
        # node. Valkey needs no account of its own (the image's entrypoint changes user only when started as root), and
        # the one directory it writes, /data, is an emptyDir, writable by any user and empty at every start, so the ids
        # can change in place with nothing to keep.
        {{- include "svp-data.podSecurityContext" (dict "uid" 10999 "gid" 10999) | nindent 8 }}
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          args: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb",
                 "--maxmemory-policy", "noeviction"]
          ports:
            - name: valkey
              containerPort: 6379
          # TCP probes, not an exec of valkey-cli ping: an exec starts a process in the container's cgroup every period,
          # which counts against its CPU limit. With persistence off there is no loading phase in which the port is open
          # but commands are refused, so an open port means Valkey answers.
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          securityContext:
            {{- include "svp-data.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # The image's working directory; nothing is saved there with persistence off, but it must be writable.
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
