{{- /*
Flows into and out of svp-data (threat model IN-2, IN-4, IN-9). Chart svp-cluster
already denies every pod of the namespace in both directions and opens DNS, and opens the API server for pods
labelled svp-kube-api=allow (the Postgres instance, Redpanda's sidecar). Each policy below opens one server port to
the pods that use it, chosen by label, so a pod elsewhere in the cluster (or a client added later without its label)
reaches nothing. Clients in svp and svp-obs also need their own egress policy there; KEDA, the CloudNativePG operator
and Envoy live in platform namespaces, which deny nothing outbound. The one pod here that calls another of the namespace
is Postgres, whose backups go to the object store s3 (policy postgres-backup).

Ports are the pods' ports: NetworkPolicy sees the packet after a Service has been translated to a pod.
*/}}
{{- define "svp-data.svpPods" -}}
- namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: svp
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: {{ toJson . }}
{{- end }}
{{- define "svp-data.initJob" -}}
- podSelector:
    matchLabels:
      app.kubernetes.io/name: svp-data-init
      app.kubernetes.io/component: {{ . }}
{{- end }}
# Postgres: the database of each service (its pods and its migrate Job), GlitchTip's (its pod and its init Job), the
# bootstrap Job; the operator reads each instance's status on 8000; Prometheus scrapes the instance's exporter on 9187
# (PodMonitor svp-pg of chart svp-observability: cnpg_* and the Barman Cloud plugin's barman_cloud_* metrics).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: svp-pg
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "svp-data.svpPods" .Values.clients.postgres | nindent 8 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: svp-obs
          podSelector:
            matchLabels:
              app.kubernetes.io/name: glitchtip
        {{- include "svp-data.initJob" "pg-bootstrap" | nindent 8 }}
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: svp-obs
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: kps-prometheus
      ports:
        - protocol: TCP
          port: 9187
---
# Postgres out to the object store s3: the Barman Cloud plugin's sidecar archives WAL and uploads base backups to
# bucket pg-backups (templates/backup.yaml), and in the pod of a recovery Job reads them back. Every pod CloudNativePG
# makes for svp-pg carries the label, the recovery Job's included. Nothing else leaves these pods but DNS and the API
# server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-backup
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: svp-pg
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: s3
      ports:
        - protocol: TCP
          port: 9000
---
# Valkey: rate limits of the gateway, the explore cache of feed-service, the web client's sessions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "svp-data.svpPods" .Values.clients.valkey | nindent 8 }}
      ports:
        - protocol: TCP
          port: 6379
---
# Redpanda: the Kafka API for the five services with Kafka, KEDA's lag reader and the init Job; the Admin API for the
# init Job and the Collector, which scrapes /public_metrics. The schema registry (8081, unauthenticated) and the HTTP
# proxy (8082) are open to no one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpanda
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redpanda
      app.kubernetes.io/instance: redpanda
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "svp-data.svpPods" .Values.clients.kafka | nindent 8 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
          podSelector:
            matchLabels:
              app: keda-operator
        {{- include "svp-data.initJob" "redpanda-init" | nindent 8 }}
      ports:
        - protocol: TCP
          port: 9092
    - from:
        {{- include "svp-data.initJob" "redpanda-init" | nindent 8 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: svp-obs
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
              app.kubernetes.io/instance: otel-collector
      ports:
        - protocol: TCP
          port: 9644
---
# The object store s3: video-service and media-worker with their own users, Envoy for presigned uploads and playback
# from the host, the init Job, and the pods of Postgres svp-pg (instance and recovery Job) for its backups, as user
# svp-pg-backup.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s3
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: s3
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "svp-data.svpPods" .Values.clients.s3 | nindent 8 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: svp
        {{- include "svp-data.initJob" "s3-init" | nindent 8 }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: svp-pg
      ports:
        - protocol: TCP
          port: 9000
---
# The init Jobs reach only the server each one sets up.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: svp-data-init
      app.kubernetes.io/component: pg-bootstrap
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: svp-pg
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s3-init
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: svp-data-init
      app.kubernetes.io/component: s3-init
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: s3
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpanda-init
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: svp-data-init
      app.kubernetes.io/component: redpanda-init
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redpanda
              app.kubernetes.io/instance: redpanda
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9644
