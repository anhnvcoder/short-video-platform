# Example values of an EKS cluster, to render and check what only such a cluster turns on (helm template -f this file):
# Postgres on Amazon RDS and objects on Amazon S3 (no CloudNativePG, no object store in the cluster, StorageClass gp3),
# Let's Encrypt through Route 53, an NLB of AWS Load Balancer Controller in front of Envoy, the API server on 443 of the
# control plane's network interfaces in the VPC. Placeholders only: the real CIDRs, zone, names and email come from the
# cluster's Terraform outputs and the learner's own variables, never from git, and .example never resolves.
cloudnativePG:
  enabled: false
s3:
  mode: external
storageClass:
  enabled: true

externalSecrets:
  enabled: true
  store: kubernetes
  postgres: svp-stg-pg.rds.example:5432

# The VPC's CIDR, the first address of the cluster's service range, and the port of EKS's API server.
nodeSubnet: 10.0.0.0/16
kubeAPIServiceIP: 172.20.0.1
kubeAPIPort: 443
# Kyverno's webhook calls come from the control plane's network interfaces in the VPC (nodeSubnet, so every pod of the
# VPC too: templates/networkpolicies.yaml says why that is accepted); no VXLAN on EKS.
kyverno:
  vxlanAddresses: []

wildcardHost: "*.stg.aws.svp.example"
apexHost: stg.aws.svp.example

tls:
  issuer: acme
  acme:
    server: staging
    email: lab@svp.example
    hostedZoneId: Z0000000000000EXAMPLE
    region: ap-southeast-1

envoy:
  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
      # Envoy's readiness endpoint instead of a TCP connect to 10443: /ready fails as soon as Envoy starts draining,
      # so the NLB stops sending new connections to a pod that is shutting down.
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "19003"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /ready
  networkPolicy:
    enabled: true
    healthCheckCIDR: 10.0.0.0/16
