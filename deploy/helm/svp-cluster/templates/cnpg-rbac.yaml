{{- /*
RBAC of the CloudNativePG operator (ServiceAccount cnpg-system/cloudnative-pg, chart cloudnative-pg 0.29.1 of wave 2),
rendered here because base/cloudnative-pg.yaml of svp-gitops turns the chart's own off: the chart can bind its
namespaced rules either cluster-wide or in its release namespace only, and the project's only Cluster, svp-pg, is in
svp-data. The rules are the chart's (templates/_helpers.tpl of chart 0.29.1): clusterwideRules in the ClusterRole
(nodes, ClusterImageCatalogs; no Secret, no pod) but for its get and patch on webhook configurations, and commonRules,
unchanged, in the Role of svp-data only. The operator patches its webhook configurations only to write its own CA
into them, and patch on them would let a stolen token point a webhook at the operator's pod for every Secret written in
the cluster: it runs with MANAGE_WEBHOOK_CONFIGURATIONS=false (base/cloudnative-pg.yaml of svp-gitops), and
cert-manager's cainjector writes the CA instead (templates/cnpg-webhook-certificate.yaml).

The operator watches svp-data and cnpg-system (WATCH_NAMESPACE in base/cloudnative-pg.yaml of svp-gitops, the same two
as the RoleBindings below): its informers list and watch every kind it caches in each of them, so each Role reads every
kind of commonRules. svp-data is where it runs svp-pg's pods and Jobs and makes their Secrets, ServiceAccount, Role and
RoleBinding: the whole of commonRules. cnpg-system holds no Cluster; the operator is there for its ConfigMap, the
Barman Cloud plugin's Service, EndpointSlices and TLS Secrets (it finds a plugin only by watching there), its leader
election Lease and its events, and for its own PKI: CloudNativePG 1.30.1 creates Secret cnpg-ca-secret (type Opaque) at
start when it is missing and updates it when it nears its end (pkg/certs/k8s.go, ensureRootCACertificate and
renewCACertificate), and would patch cnpg-webhook-cert (type kubernetes.io/tls, issued by cert-manager) if it ever found
it near its end. So its Role in cnpg-system reads, and writes only Secrets (create, update, patch; no delete), events
and its Lease: no pod, pods/exec, Deployment, Job, PersistentVolumeClaim, ServiceAccount, Role or RoleBinding is written
there. That namespace also runs the plugin, whose ServiceAccount reads every Secret of the cluster (the JWT signing key
of svp included; base/plugin-barman-cloud.yaml of svp-gitops): with commonRules there, a stolen operator token could
exec into the plugin's pod, run a pod or patch its Deployment as that ServiceAccount, and read them all.

Creating Secrets in cnpg-system is still such a path: a Secret of type kubernetes.io/service-account-token naming
ServiceAccount plugin-barman-cloud gets that ServiceAccount's token. RBAC cannot narrow create by name (resourceNames
does not apply to create), and the operator skips its PKI only when env WEBHOOK_CERT_DIR is set, then reading files
apiserver.crt and apiserver.key, which the chart's mount of Secret cnpg-webhook-cert (tls.crt, tls.key) does not give.
Hence ValidatingAdmissionPolicy svp-cnpg-operator-secrets below, checked in the API server itself (no webhook that
could be down): for requests of the operator's ServiceAccount, a Secret created or updated in cnpg-system must be
cnpg-ca-secret of type Opaque, or (update only) cnpg-webhook-cert of type kubernetes.io/tls. Left: reading the Secrets
of cnpg-system (the plugin's TLS ones), and writing those two.

The names differ from the chart's (cloudnative-pg), so a cluster installed before keeps nothing of the chart's: the
chart's release deletes its ClusterRole and ClusterRoleBinding at its next upgrade, after this chart has made these.
Written in wave 1 for an operator of wave 2: a RoleBinding may name a ServiceAccount that does not exist yet, and the
policy names its user by string.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: svp-cloudnative-pg
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusterimagecatalogs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: svp-cloudnative-pg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: svp-cloudnative-pg
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg
    namespace: cnpg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: svp-cloudnative-pg
  namespace: svp-data
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [configmaps/status, secrets/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, pods, pods/exec]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, list, update, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [podmonitors]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups, clusters, databaseroles, databases, poolers, publications, scheduledbackups, subscriptions]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [failoverquorums]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups/status, databases/status, publications/status, scheduledbackups/status, subscriptions/status]
    verbs: [get, patch, update]
  - apiGroups: [postgresql.cnpg.io]
    resources: [imagecatalogs]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters/finalizers, databaseroles/finalizers, poolers/finalizers]
    verbs: [update]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters/status, databaseroles/status, poolers/status, failoverquorums/status]
    verbs: [get, patch, update, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings, roles]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [create, get, list, patch, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: svp-cloudnative-pg
  namespace: cnpg-system
rules:
  # Every kind of commonRules, which its informers list and watch here, read only; written: Secrets (its PKI, held to
  # two names by policy svp-cnpg-operator-secrets below), events and its leader election Lease.
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, pods, serviceaccounts, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, list, update, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [podmonitors]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups, clusters, databaseroles, databases, failoverquorums, imagecatalogs, poolers, publications,
                scheduledbackups, subscriptions]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings, roles]
    verbs: [get, list, watch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, list, watch]
{{- range list "cnpg-system" "svp-data" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: svp-cloudnative-pg
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: svp-cloudnative-pg
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg
    namespace: cnpg-system
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: svp-cnpg-operator-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cnpg-system
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: cnpg-operator
      expression: request.userInfo.username == 'system:serviceaccount:cnpg-system:cloudnative-pg'
  validations:
    - expression: >-
        (object.metadata.name == 'cnpg-ca-secret' && object.type == 'Opaque') ||
        (request.operation == 'UPDATE' && object.metadata.name == 'cnpg-webhook-cert' &&
        object.type == 'kubernetes.io/tls')
      messageExpression: >-
        'the CloudNativePG operator may write in cnpg-system only Secret cnpg-ca-secret (Opaque) and update
        cnpg-webhook-cert (kubernetes.io/tls), not ' + request.operation + ' of ' + object.metadata.name +
        ' (' + object.type + ')'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: svp-cnpg-operator-secrets
spec:
  policyName: svp-cnpg-operator-secrets
  validationActions: [Deny]
