{{- /*
The Secrets of the GitOps path (externalSecrets of values.yaml; on in envs/stg and envs/prd of svp-gitops, off
on the dev path, which applies them from .env with deploy/k8s/secrets.sh). For each namespace that holds ExternalSecrets
(svp, svp-data, svp-obs, keda):
- SecretStore svp-store: the source of values. store kubernetes (a lab cluster): the Secrets of namespace
  externalSecrets.sourceNamespace, read through the API server as ServiceAccount externalSecrets.storeServiceAccount of
  the store's namespace, which the controller gets a token for (a provider kubernetes store cannot use the controller's
  own ServiceAccount). store aws (prd, stage 7): AWS Secrets Manager, entry svp/<env>/<entry>, through the IAM role of
  the namespace in externalSecrets.aws.roles, assumed with the controller's EKS Pod Identity;
- store kubernetes only: that ServiceAccount, with no token mounted anywhere; a Role in the source namespace that lets
  it get only the entries this namespace's ExternalSecrets name (resourceNames), nothing else, not list or watch; and a
  Role here that lets the controller create a token for that ServiceAccount alone (the chart's ClusterRole, which
  could do so for every ServiceAccount of the cluster, is narrowed in base/external-secrets.yaml of svp-gitops);
- one ExternalSecret per Secret of files/external-secrets.yaml, same name, refreshPolicy OnChange (with s3.mode
  external, without the Secrets and keys of the in-cluster object store, marked there): the Secret is built
  when the ExternalSecret is created and again only when its spec or metadata changes, which is how a changed value
  reaches it (deploy/k8s/secrets.sh and deploy/k8s/glitchtip-init.sh annotate force-sync after they write the source).
  A periodic refresh would put a new password in a Secret ahead of the restarts and Jobs that must come first (Redpanda
  takes a new superuser password before Secret redpanda-bootstrap may change, the object store restarts before its
  init Job logs in with a new one).
The SelfSubjectRulesReview a kubernetes store makes to check that its ServiceAccount may get Secrets in the source
namespace needs no rule here: every authenticated user may create one (ClusterRole system:basic-user).

ValidatingAdmissionPolicy svp-external-secrets-writes holds the controller's Secret writes, which RBAC cannot narrow
(the chart's ClusterRole: the controller watches the metadata of every Secret of the cluster, whatever its flags say,
and needs list and watch on them; it writes the Secrets of every namespace with it), to the namespaces of the
ExternalSecrets, and never a Secret of type kubernetes.io/service-account-token, which would hand it the token of any
ServiceAccount of the namespace.

Store kubernetes only, like that ServiceAccount: ValidatingAdmissionPolicies svp-store-serviceaccount-pods and -tokens
keep the stores' ServiceAccount to the controller, which gets its token through the TokenRequest API and creates no
pod: in every namespace, no pod may run as it (the ServiceAccount's automountServiceAccountToken: false is a default
that a pod spec or a projected token volume overrides, and such a pod would read every source entry of its namespace)
and no Secret may hold a token of it (one a pod of another ServiceAccount could mount). The policy on pods covers every
workload: a Deployment, Job or StatefulSet starts nothing but through a pod its controller creates, which this policy
refuses (the workload shows FailedCreate); a static pod may not name a ServiceAccount. serviceAccountName of a pod
cannot change after it is created, so CREATE is enough.
*/}}
{{- $es := .Values.externalSecrets }}
{{- if not (has .Values.s3.mode (list "cluster" "external")) }}
{{- fail (printf "s3.mode is %q: cluster (s3 of chart svp-data) or external (a managed object store)" (toString .Values.s3.mode)) }}
{{- end }}
{{- if $es.enabled }}
{{- if not (has $es.store (list "kubernetes" "aws")) }}
{{- fail (printf "externalSecrets.store is %q: kubernetes (a lab cluster) or aws" (toString $es.store)) }}
{{- end }}
{{- $inClusterObjectStore := eq .Values.s3.mode "cluster" }}
{{- $secrets := list }}
{{- range $s := .Files.Get "files/external-secrets.yaml" | fromYamlArray }}
{{- if or $inClusterObjectStore (not $s.inClusterObjectStore) }}
{{- if not $inClusterObjectStore }}
{{- range $key := $s.inClusterObjectStoreKeys | default list }}
{{- $_ := unset $s.values $key }}
{{- if $s.template }}{{ $_ := unset $s.template $key }}{{ end }}
{{- end }}
{{- end }}
{{- $secrets = append $secrets $s }}
{{- end }}
{{- end }}
{{- /* The entries each namespace reads, in the order of its first Secret. */}}
{{- $namespaces := list }}
{{- $entries := dict }}
{{- range $s := $secrets }}
{{- if not (has $s.namespace $namespaces) }}{{ $namespaces = append $namespaces $s.namespace }}{{ end }}
{{- range $name, $ref := $s.values }}
{{- $parts := splitList "/" $ref }}
{{- if ne (len $parts) 2 }}
{{- fail (printf "files/external-secrets.yaml: value %s of %s/%s is %q, not ENTRY/KEY" $name $s.namespace $s.name $ref) }}
{{- end }}
{{- $_ := set $entries $s.namespace (append (get $entries $s.namespace | default list) (first $parts) | uniq) }}
{{- end }}
{{- end }}
{{- range $ns := $namespaces }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: svp-store
  namespace: {{ $ns }}
spec:
  provider:
    {{- if eq $es.store "kubernetes" }}
    kubernetes:
      remoteNamespace: {{ $es.sourceNamespace }}
      server:
        url: https://kubernetes.default.svc
        # The API server's CA, which Kubernetes publishes in every namespace.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $es.storeServiceAccount }}
    {{- else }}
    aws:
      service: SecretsManager
      region: {{ required "externalSecrets.aws.region is required with store aws" $es.aws.region }}
      role: {{ required (printf "externalSecrets.aws.roles.%s: the IAM role of namespace %s's store" $ns $ns) (get $es.aws.roles $ns) }}
    {{- end }}
{{- if eq $es.store "kubernetes" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $es.storeServiceAccount }}
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $es.storeServiceAccount }}-{{ $ns }}
  namespace: {{ $es.sourceNamespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: {{ get $entries $ns | sortAlpha | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $es.storeServiceAccount }}-{{ $ns }}
  namespace: {{ $es.sourceNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $es.storeServiceAccount }}-{{ $ns }}
subjects:
  - kind: ServiceAccount
    name: {{ $es.storeServiceAccount }}
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: svp-external-secrets-token
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]
    resourceNames: [{{ $es.storeServiceAccount }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: svp-external-secrets-token
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: svp-external-secrets-token
subjects:
  - kind: ServiceAccount
    name: {{ $es.controller.serviceAccount }}
    namespace: {{ $es.controller.namespace }}
{{- end }}
{{- end }}
{{- range $secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: SecretStore
    name: svp-store
  target:
    name: {{ .name }}
    template:
      type: {{ .type | default "Opaque" }}
      {{- with .labels }}
      metadata:
        labels:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with .template }}
      data:
        {{- range $key, $value := . }}
        {{ $key | toJson }}: {{ replace "${postgres}" $es.postgres $value | toJson }}
        {{- end }}
      {{- end }}
  data:
    {{- range $name, $ref := .values }}
    - secretKey: {{ $name }}
      remoteRef:
        key: {{ printf "%s%s" $es.prefix (first (splitList "/" $ref)) }}
        property: {{ last (splitList "/" $ref) }}
    {{- end }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: svp-external-secrets-writes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: external-secrets-controller
      expression: request.userInfo.username == 'system:serviceaccount:{{ $es.controller.namespace }}:{{ $es.controller.serviceAccount }}'
  validations:
    - expression: >-
        request.namespace in {{ $namespaces | toJson | replace "\"" "'" }} &&
        (request.operation == 'DELETE' || object.type != 'kubernetes.io/service-account-token')
      messageExpression: >-
        'External Secrets Operator may write only Secrets of the namespaces of its ExternalSecrets
        ({{ join ", " $namespaces }}), never a ServiceAccount token, not ' + request.operation + ' of ' +
        request.namespace + '/' + request.name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: svp-external-secrets-writes
spec:
  policyName: svp-external-secrets-writes
  validationActions: [Deny]
{{- if eq $es.store "kubernetes" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: svp-store-serviceaccount-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  validations:
    # The API server copies the deprecated field serviceAccount into serviceAccountName before admission.
    - expression: >-
        !has(object.spec.serviceAccountName) || object.spec.serviceAccountName != '{{ $es.storeServiceAccount }}'
      messageExpression: >-
        'No pod may run as ServiceAccount {{ $es.storeServiceAccount }} of the SecretStores (only External Secrets
        Operator gets its token, through TokenRequest): not pod ' + request.namespace + '/' + object.metadata.name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: svp-store-serviceaccount-pods
spec:
  policyName: svp-store-serviceaccount-pods
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: svp-store-serviceaccount-tokens
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  validations:
    - expression: >-
        !has(object.type) || object.type != 'kubernetes.io/service-account-token' ||
        !has(object.metadata.annotations) ||
        !('kubernetes.io/service-account.name' in object.metadata.annotations) ||
        object.metadata.annotations['kubernetes.io/service-account.name'] != '{{ $es.storeServiceAccount }}'
      messageExpression: >-
        'No Secret may hold a token of ServiceAccount {{ $es.storeServiceAccount }} of the SecretStores (only External
        Secrets Operator gets its token, through TokenRequest): not ' + request.operation + ' of Secret ' +
        request.namespace + '/' + object.metadata.name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: svp-store-serviceaccount-tokens
spec:
  policyName: svp-store-serviceaccount-tokens
  validationActions: [Deny]
{{- end }}
{{- end }}
