{{- /*
The single entry point (ADR-0014 section 9): Envoy Gateway's GatewayClass svp and Gateway svp in svp-edge, published
on the host at 127.0.0.1:8443 through k3d's load balancer, with two HTTPS listeners on 443: https for *.svp.localhost
(the API, storage) and https-apex for svp.localhost (the web client), which the wildcard does not cover. Each serves a
certificate naming its own hostnames only. One certificate for both names would be valid for s3.svp.localhost on a
connection opened to svp.localhost, at the same address, so a browser could send its HLS requests over that HTTP/2
connection (RFC 9113 section 9.1.1), where Envoy picked the apex listener by SNI and no route of it matches s3. No route
for any operations UI is ever attached (OPS-2): those are reached through kubectl port-forward and their own login.
*/}}
# Settings of the Envoy proxy fleet of this class. externalTrafficPolicy Cluster instead of Envoy Gateway's default
# Local: k3d's load balancer spreads connections over both nodes, and with Local the servicelb pod of the node without an
# Envoy pod would have nowhere to send them. The client address is lost on the way anyway (k3d's load balancer and
# servicelb both proxy or masquerade), so Cluster costs nothing.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: svp
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # About 150 MiB expected with the shutdown manager (ADR-0014 section 2); the limit turns a leak into an
              # OOM kill of this pod instead of memory taken from the node's other pods.
              memory: 256Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: svp
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: svp
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: svp
  namespace: svp-edge
spec:
  gatewayClassName: svp
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.wildcardHost | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: svp-wildcard-tls
      # Routes attach only from namespaces labelled svp-gateway-routes=true (svp, svp-data): a chart in any other
      # namespace cannot publish a backend on the entry point by itself.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              svp-gateway-routes: "true"
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.apexHost | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: svp-apex-tls
      # As listener https.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              svp-gateway-routes: "true"
