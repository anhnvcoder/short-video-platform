{{- /*
Default-deny in both directions for every pod of the project's namespaces (IN-2, FF-5): a pod
reaches and is reached by nothing until a policy of its own chart opens that one flow, so a compromised pod cannot
scan the cluster or call out to the internet. Platform namespaces (cert-manager, envoy-gateway-system, ...) are not
denied by default: their charts ship no policies, their webhooks are called by the API server from the node network,
and they hold no project data.

Not needed despite the deny: kubelet probes and kubectl port-forward come from the node the pod runs on, which a
NetworkPolicy cannot block.

Namespace kyverno gets the same three (its pods that call the API server carry svp-kube-api=allow), and two more at the
end of this file. With externalSecrets on (GitOps path), so does namespace external-secrets of External Secrets
Operator: its controller (labelled svp-kube-api=allow) talks to the API server only, and nothing comes in (it serves no
webhook, and nothing scrapes its metrics); with store aws it also gets TCP 443 out to public addresses (Secrets
Manager, STS) and TCP 80 to the EKS Pod Identity Agent, at the end of this file. The source namespace of store
kubernetes has no pod, and is denied all the same.
*/}}
{{- $kyverno := dict "name" .Values.kyverno.namespace "kubeAPI" true }}
{{- $es := .Values.externalSecrets }}
{{- $esNamespaces := list }}
{{- if $es.enabled }}
{{- $esNamespaces = append $esNamespaces (dict "name" $es.controller.namespace "kubeAPI" true) }}
{{- if eq $es.store "kubernetes" }}
{{- $esNamespaces = append $esNamespaces (dict "name" $es.sourceNamespace "kubeAPI" false) }}
{{- end }}
{{- end }}
{{- range concat .Values.namespaces (list $kyverno) $esNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .name }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Name resolution for every pod: without it a pod could not even find the Services its own policies open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .name }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if .kubeAPI }}
---
# The API server for the pods that need it (operator instances, sidecars holding leases, Prometheus discovery), opted in
# with the label svp-kube-api=allow. Pods call Service kubernetes (10.43.0.1:443), which kube-proxy rewrites to the
# server node's 6443 before the policy filter sees the packet, so both the address before and after that rewrite are
# allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-api
  namespace: {{ .name }}
spec:
  podSelector:
    matchLabels:
      svp-kube-api: allow
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ $.Values.nodeSubnet }}
      ports:
        - protocol: TCP
          port: {{ $.Values.kubeAPIPort }}
    - to:
        - ipBlock:
            cidr: {{ $.Values.kubeAPIServiceIP }}/32
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
{{- /*
Kyverno's admission controller. In: the API server's admission
calls on the webhook port. The API server runs on the server node: a call to a pod on that node comes from the node
itself, one to a pod on the agent leaves through the server's VXLAN interface (values: kyverno.vxlanAddresses), so only
those addresses and the nodes' network are let in, no pod. On EKS nodeSubnet is the VPC's CIDR: the control plane's
network interfaces sit in the same private subnets as the nodes, so no narrower range holds them, and VPC CNI gives
every pod an address of the VPC, so every pod is let in on the webhook port too. Accepted: the project's namespaces
deny egress by default, so only pods of the platform namespaces (Envoy's among them) gain that reach. Out: TCP 443 to public addresses only, for the registries and Sigstore's TUF
repository it verifies images against; every private range is left out (values: kyverno.privateRanges), so neither the
local registry nor anything else on the nodes' network or the host is reachable. The reports controller needs only the
API server.
*/}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-from-api-server
  namespace: {{ .Values.kyverno.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kyverno
      app.kubernetes.io/component: admission-controller
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.nodeSubnet }}
        {{- range .Values.kyverno.vxlanAddresses }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.kyverno.webhookPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-https
  namespace: {{ .Values.kyverno.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kyverno
      app.kubernetes.io/component: admission-controller
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.kyverno.privateRanges | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
{{- if and $es.enabled (eq $es.store "aws") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-https
  namespace: {{ $es.controller.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.kyverno.privateRanges | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
---
# The store aws has no auth block: the controller takes its AWS credentials from the EKS Pod Identity Agent, which
# listens on the node at the link-local address 169.254.170.23, port 80 (the address AWS_CONTAINER_CREDENTIALS_FULL_URI
# points the SDK to). The policy above leaves out every private range, link-local included, so this one opens that
# single address and port, for this pod only. The agent also answers on [fd00:ec2::23]:80; an IPv6 cluster needs that
# address here instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pod-identity-agent
  namespace: {{ $es.controller.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
{{- end }}
{{- if .Values.envoy.networkPolicy.enabled }}
{{- $healthCheckPort := index .Values.envoy.service.annotations "service.beta.kubernetes.io/aws-load-balancer-healthcheck-port" | default "traffic-port" }}
{{- if and (ne $healthCheckPort "traffic-port") (not .Values.envoy.networkPolicy.healthCheckCIDR) }}
{{- fail "envoy.networkPolicy.healthCheckCIDR: required when the NLB's health check has a port of its own" }}
{{- end }}
---
# The Envoy pods of Gateway svp, on a cluster whose Envoy faces the internet: once a policy selects them, nothing else
# reaches them, so a pod of the cluster cannot reach Envoy's other ports. In: 10443, the port Envoy Gateway gives the
# listeners' 443 in the pod (a port under 1024 gets 10000 added, so Envoy needs no privilege to bind it), from every
# address: the NLB keeps each client's own; the metrics port from Prometheus in svp-obs (the canary's analysis reads
# them); the NLB's health check on a port of its own from the VPC, where the NLB's nodes are (on traffic-port it
# checks 10443, already open). The kubelet's probes come from the node, which a NetworkPolicy cannot block. Out: not
# restricted (Envoy reaches its controller and every backend).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: svp
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 10443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: svp-obs
      ports:
        - protocol: TCP
          port: 19001
    {{- if ne $healthCheckPort "traffic-port" }}
    - from:
        - ipBlock:
            cidr: {{ .Values.envoy.networkPolicy.healthCheckCIDR }}
      ports:
        - protocol: TCP
          port: {{ $healthCheckPort | int }}
    {{- end }}
{{- end }}
