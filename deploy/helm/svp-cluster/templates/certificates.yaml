{{- /*
TLS of the entry point from a local CA run by cert-manager: a self-signed issuer signs the CA, the
CA issuer signs the two certificates Envoy serves (the wildcard one, and svp-apex for svp.localhost alone,
templates/gateway.yaml says why two). Clients trust the CA alone (`make k8s-ca` writes it to
.k8s/ca.crt), nothing is installed into the machine's trust store, and cert-manager renews both certificates as it
would on a cloud cluster.

With tls.issuer acme (a cluster on the internet), Let's Encrypt signs both instead, through ClusterIssuer svp-acme:
cert-manager proves control of the names with a TXT record in the Route 53 hosted zone (DNS-01, the one challenge that
covers a wildcard), with the AWS credentials of its own pod. No local CA is made then.
*/}}
{{- $tls := .Values.tls }}
{{- $issuer := "svp-ca" }}
{{- if eq $tls.issuer "acme" }}
{{- $issuer = "svp-acme" }}
{{- $servers := dict "production" "https://acme-v02.api.letsencrypt.org/directory" "staging" "https://acme-staging-v02.api.letsencrypt.org/directory" }}
{{- if not (hasKey $servers $tls.acme.server) }}
{{- fail (printf "tls.acme.server: %q is neither production nor staging" $tls.acme.server) }}
{{- end }}
{{- range $key := list "email" "hostedZoneId" "region" }}
{{- if not (index $tls.acme $key) }}
{{- fail (printf "tls.acme.%s: required with tls.issuer acme" $key) }}
{{- end }}
{{- end }}
# The ACME account's key lives in cert-manager's namespace (the cluster resource namespace), made on first use.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: svp-acme
spec:
  acme:
    server: {{ index $servers $tls.acme.server }}
    email: {{ $tls.acme.email | quote }}
    privateKeySecretRef:
      name: svp-acme-account
    solvers:
      - dns01:
          # No credentials here: cert-manager's controller has them from EKS Pod Identity, for a role that may change
          # records of this zone only.
          route53:
            region: {{ $tls.acme.region | quote }}
            hostedZoneID: {{ $tls.acme.hostedZoneId | quote }}
{{- else if eq $tls.issuer "selfSigned" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: svp-selfsigned
spec:
  selfSigned: {}
---
# The CA lives in cert-manager's namespace: a ClusterIssuer reads its secret from the cluster resource namespace, which
# defaults to cert-manager.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: svp-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: svp-local-ca
  secretName: svp-local-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: svp-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: svp-ca
spec:
  ca:
    secretName: svp-local-ca
{{- else }}
{{- fail (printf "tls.issuer: %q is neither selfSigned nor acme" $tls.issuer) }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: svp-wildcard
  namespace: svp-edge
spec:
  secretName: svp-wildcard-tls
  dnsNames:
    - {{ .Values.wildcardHost | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ $issuer }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: svp-apex
  namespace: svp-edge
spec:
  secretName: svp-apex-tls
  dnsNames:
    - {{ .Values.apexHost | quote }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ $issuer }}
