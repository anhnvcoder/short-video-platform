# ImageValidatingPolicy svp-images. Installed after Kyverno (wave 3 of argocd/apps/components.json of svp-gitops), whose
# chart brings the CRD, and before any pod of namespace svp (wave 7).

imageVerification:
  # Enforce: a pod that breaks a rule is refused, and so is every pod when Kyverno cannot be reached or cannot verify
  # (failurePolicy Fail): the GitOps path, whose images are the signed releases on GHCR. Audit: nothing is refused,
  # each violation lands in a PolicyReport of namespace svp, and a Kyverno that is down admits every pod (failurePolicy
  # Ignore): the dev path, whose images are unsigned dev builds in the local registry. deploy/k8s/install.sh sets Audit
  # with --set, never in a file.
  mode: Enforce
  # The one namespace whose pods the policy checks, and the only one whose requests reach its webhook. Every platform
  # namespace stays out: their images are third-party ones pinned by digest and checked before merge (step 4 of
  # deploy/ci/gitops-check.sh, which make helm-check runs), and a Kyverno that is down must not stop them.
  namespace: svp
  # Which images run in the namespace, and whose signature each must carry, is not here but in files/sources.json of
  # this chart, the one place every release source is written: per source the repository that builds it, the prefix
  # its images live under on GHCR, the services (and drill images) it may publish there, the keyless identity of
  # .github/workflows/images.yml on main of that repository (issuer and subject: its Fulcio certificate's SAN is
  # server_url + job_workflow_ref, so a run on another branch or of another workflow is refused), the ref its build
  # provenance must name, and the GitHub App that promotes its releases. The scripts that verify, sign or promote a
  # release read the same file (release_sources of deploy/k8s/lib.sh). It sits in the chart, not in an overlay, so a
  # source added or removed reaches stg before prd, with the chart's revision; no environment can change it.
  # Oldest scan result admitted (metadata.scanFinishedOn of the vuln attestation): the daily rescan refreshes it, so 72
  # hours bear two missed runs. A CEL duration.
  maxAttestationAge: 72h
  # Build provenance: true adds four checks after the six above, each with its own message: an attestation of type
  # https://slsa.dev/provenance/v1 signed by the identity of the image's source, whose runDetails.builder.id is that
  # subject and whose buildDefinition.externalParameters.workflow names that source's repository and ref. Off here: the
  # releases signed before CI attested provenance have none, and a cluster checking it would refuse their pods. It is
  # turned on in the overlay of an environment (envs/<env>/svp-policy.yaml of svp-gitops) once all seven services have a
  # release with provenance; a rollback to a release from before then must turn it off first.
  # It holds for every source of files/sources.json alike: a new source has no "no provenance yet" exception.
  # deploy/ci/verify-release.sh checks the same whenever a policy at that revision turns it on: it reads this line and
  # the overlays, so the overlay of svp-policy holds this key alone (`imageVerification:` then
  # `  requireProvenance: true`). The line keeps this shape (two spaces, the value bare, nothing after it) and no other
  # line of this file names the key: the checker of svp-gitops pinned at an older commit reads it that way.
  requireProvenance: false

# Drills only (deploy/k8s/drills/supplychain.sh renders a temporary copy with another name, a shorter age and an
# objectSelector on a drill label): the policy's name, and the pods it applies to within the namespace.
name: svp-images
objectSelector: {}
