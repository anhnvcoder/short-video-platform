{{- /*
The SLO recording and burn-rate alert rules (generated by `make slo`) and the hand-written alerts of stage 3, the same
files compose mounts into Prometheus (symlinks under files/rules/), as PrometheusRules: the Prometheus of
kube-prometheus-stack selects every PrometheusRule (ruleSelector empty), and the operator turns each into a rule file.
The rules were checked by promtool (`make slo-check`) before they reached the repository; the operator's admission
webhook, which would check them again, is off: it would be the one webhook in a namespace that denies all traffic by
default, so the API server's calls to it would need a NetworkPolicy of their own.
*/}}
{{- range $name := list "slo-generated" "svp-alerts" }}
{{- $path := printf "files/rules/%s.yaml" $name }}
{{- $rules := $.Files.Get $path | fromYaml }}
{{- if or (hasKey $rules "Error") (not $rules.groups) }}
{{- fail (printf "%s is missing, not YAML or has no groups: the symlink into deploy/observability/prometheus/rules/ is broken?" $path) }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  groups:
    {{- toYaml $rules.groups | nindent 4 }}
{{- end }}
