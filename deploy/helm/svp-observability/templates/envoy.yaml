{{- /*
Envoy's metrics for the canaries of the gateway and web: Prometheus scrapes the proxy of
Gateway svp on its metrics port, /stats/prometheus, and AnalysisTemplates <release>-canary (chart svp-service) read
the canary backend's 5xx and latency from them. Envoy exposes a few thousand series; only the three families the
analyses and the drills read are kept, for the clusters of HTTPRoutes api and web (svp), the routes of the releases
with a canary: responses by class, all responses, and the response time histogram (ms). A release that gets a canary
adds its route to the regex below, or its analysis finds no series and every run ends Inconclusive.

The PodMonitor lives in svp-obs although the pods are in envoy-gateway-system: the Prometheus operator watches svp-obs
only (base/kube-prometheus-stack.yaml of svp-gitops), and a PodMonitor elsewhere would never be picked up, with no error
anywhere. Prometheus finds the pods itself, with its own cluster-wide right to list pods; policy prometheus opens the
port.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-svp
  namespace: {{ .Release.Namespace }}
spec:
  namespaceSelector:
    matchNames: [{{ .Values.envoy.namespace }}]
  selector:
    matchLabels:
      {{- toYaml .Values.envoy.labels | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: envoy_cluster_upstream_rq_xx|envoy_cluster_upstream_rq_total|envoy_cluster_upstream_rq_time_bucket
          action: keep
        - sourceLabels: [envoy_cluster_name]
          regex: httproute/svp/(api|web)/.*
          action: keep
