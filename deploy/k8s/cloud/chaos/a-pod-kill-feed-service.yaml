# Experiment (a), second run: kill one feed-service pod under load.
# Cloud cluster, or the k3d cluster of a CI runner (deploy/ci/verify/chaos.sh), Chaos Mesh installed with
# targetNamespace svp (deploy/k8s/cloud/values/chaos-mesh.yaml). Apply this one file, never the folder: each file is its
# own experiment. Run it after a-pod-kill-gateway.yaml, once the feed is back to steady state.
#
# When: under k6 profile cloud at its hold rate, after 5 minutes of steady state.
#
# Steady-state hypothesis: as for the gateway, the feed keeps its SLO in the 10 minutes around the kill (5xx < 0.1%, p99
# <= 150 ms outside the first 30 s) and the replacement pod is Ready in under 60 s. feed-service runs two replicas, as
# the gateway does, so the other pod serves the feed while the replacement starts. Should only one replica run at the
# kill, this run measures how long the feed is down until the new pod is Ready, and the result is a finding about the
# replica count, not a failed hypothesis. Write down the replica count at the kill.
#
# Watch (Prometheus, and the k6 summary per route):
#   feed 5xx ratio and p99: the queries at the top of a-pod-kill-gateway.yaml
#   replicas at the kill: kubectl --context <ctx> -n svp get pods -l app.kubernetes.io/name=feed-service -o wide
#   pods: kubectl --context <ctx> -n svp get pods -l app.kubernetes.io/name=feed-service -w
#   experiment: kubectl --context <ctx> -n svp describe podchaos pod-kill-feed-service
#
# Pass: with 2 or more replicas at the kill, both numbers hold and the new pod is Ready within 60 s; with 1 replica,
# the time from the kill to the new pod Ready is recorded.
#
# Run:  kubectl --context <ctx> apply -f deploy/k8s/cloud/chaos/a-pod-kill-feed-service.yaml
# End:  kubectl --context <ctx> -n svp delete podchaos pod-kill-feed-service. Stop the session early when the feed's 5xx
#       stays above 5% for more than a minute or a node goes NotReady.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-feed-service
  namespace: svp
spec:
  action: pod-kill
  mode: one
  gracePeriod: 0
  duration: 1m
  selector:
    namespaces:
      - svp
    # component server: the service's own pods; its migration Job's pods share the name label and, once Completed, are
    # "not running", which a kill passes over and a network fault cannot be injected into.
    labelSelectors:
      app.kubernetes.io/name: feed-service
      app.kubernetes.io/component: server
