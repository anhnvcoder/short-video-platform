# Chaos Mesh 2.8.5 (chart https://charts.chaos-mesh.org chaos-mesh 2.8.5, deploy/k8s/cloud/charts.json), release
# chaos-mesh in namespace chaos-mesh, on the cloud cluster and on the throwaway k3d cluster of a CI runner (scenario
# chaos of verify.yml, with deploy/k8s/cloud/runner/chaos-mesh/values.yaml over this file). Never on the k3d cluster of
# the 16 GB machine: it has no room for it. 2.8.6 was less than 3
# days old when this was pinned and only fixes IOChaos, PhysicalMachineChaos and the dashboard.
#
# Installed by hand with helm for one cloud session, not through Argo CD: the chart generates new certificates and a
# random pod annotation at every render, so Argo CD would always see it out of sync. The learner runs, with the cloud
# cluster's context written in each command:
#
#   kubectl --context <ctx> create namespace chaos-mesh
#   kubectl --context <ctx> label namespace chaos-mesh pod-security.kubernetes.io/enforce=privileged
#   helm --kube-context <ctx> upgrade --install chaos-mesh chaos-mesh --repo https://charts.chaos-mesh.org \
#     --version 2.8.5 -n chaos-mesh -f deploy/k8s/cloud/values/chaos-mesh.yaml
#   # experiment (c) only, which targets svp-data:
#   helm --kube-context <ctx> upgrade chaos-mesh chaos-mesh --repo https://charts.chaos-mesh.org --version 2.8.5 \
#     -n chaos-mesh -f deploy/k8s/cloud/values/chaos-mesh.yaml --set controllerManager.targetNamespace=svp-data
#
# and at the end of the session:
#
#   helm --kube-context <ctx> uninstall chaos-mesh -n chaos-mesh
#   kubectl --context <ctx> delete namespace chaos-mesh
#   kubectl --context <ctx> get crd -o name | grep '\.chaos-mesh\.org$' | xargs kubectl --context <ctx> delete
#
# Privilege: chaos-daemon (a DaemonSet on every node) always runs with hostPID, privileged and hostPath mounts of the
# container runtime's socket, /sys and /lib/modules, because it enters the target pods' network and process namespaces
# from the node. Namespace chaos-mesh therefore needs Pod Security "privileged"; whoever controls chaos-daemon controls
# every node. It exists only for the session (threat model OPS-4).
#
# `make cloud-check` renders this file with `helm template` and checks the result with kubeconform; every image must be
# pinned by digest.

# Namespace-scoped: the controller's rights over pods, configmaps and secrets are a RoleBinding in the one target
# namespace below, not a ClusterRoleBinding over every namespace (the default). It still reads and writes the Secrets of
# that namespace (svp holds the JWT signing key), which is why the install lasts one session. Moving between svp and
# svp-data is a `helm upgrade` (see above). enableFilterNamespace, the other way to narrow it, needs the cluster-scoped
# rights to read namespaces.
clusterScoped: false

# pprof of the controller manager stays off: a debug endpoint in a pod holding these rights is not wanted (OPS-1).
enableProfiling: false

controllerManager:
  # One replica is enough for a session; three (the default) only costs RAM.
  replicaCount: 1
  # Experiments (a) and (b). Experiment (c) switches this to svp-data with --set (see above).
  targetNamespace: svp
  # Every controller of Chaos Mesh 2.8.5 (the chart's default is "*", all of them) but the multi-cluster ones,
  # remotecluster and <kind>-remote-apply. remotecluster watches RemoteCluster, a cluster-scoped kind, and a controller
  # namespaced on its one target (clusterScoped false) has no right to list it at the cluster scope: that cache never
  # syncs, so the manager exits ("timed out waiting for cache to be synced") 2 min after each start, over and over, and
  # its webhooks have no endpoint while it restarts. With it off, the controller needs no cluster-scoped right more than
  # the chart gives. The names are those the controller's source spells at v2.8.5 (ShouldSpawnController): five for each
  # chaos kind (its pipeline, <kind>-records, and the pipeline's four steps), the controllers of the kinds the network,
  # IO and HTTP faults go through (pod*chaos), workflow, statuscheck and the four of Schedule. Every kind's pipeline is
  # listed, those no experiment here uses too: the controller stops setting up pipelines at the first kind it does not
  # find here, in an order that changes at each start. A new version of the chart has this list read again against its
  # source; `make cloud-check` checks it against the chart's CRDs (five names for each chaos kind, none multi-cluster).
  enabledControllers: [
    awschaos-records, awschaos-initFinalizers, awschaos-desiredphase, awschaos-condition, awschaos-cleanFinalizers,
    azurechaos-records, azurechaos-initFinalizers, azurechaos-desiredphase, azurechaos-condition,
    azurechaos-cleanFinalizers,
    blockchaos-records, blockchaos-initFinalizers, blockchaos-desiredphase, blockchaos-condition,
    blockchaos-cleanFinalizers,
    dnschaos-records, dnschaos-initFinalizers, dnschaos-desiredphase, dnschaos-condition, dnschaos-cleanFinalizers,
    gcpchaos-records, gcpchaos-initFinalizers, gcpchaos-desiredphase, gcpchaos-condition, gcpchaos-cleanFinalizers,
    httpchaos-records, httpchaos-initFinalizers, httpchaos-desiredphase, httpchaos-condition, httpchaos-cleanFinalizers,
    iochaos-records, iochaos-initFinalizers, iochaos-desiredphase, iochaos-condition, iochaos-cleanFinalizers,
    jvmchaos-records, jvmchaos-initFinalizers, jvmchaos-desiredphase, jvmchaos-condition, jvmchaos-cleanFinalizers,
    kernelchaos-records, kernelchaos-initFinalizers, kernelchaos-desiredphase, kernelchaos-condition,
    kernelchaos-cleanFinalizers,
    networkchaos-records, networkchaos-initFinalizers, networkchaos-desiredphase, networkchaos-condition,
    networkchaos-cleanFinalizers,
    physicalmachinechaos-records, physicalmachinechaos-initFinalizers, physicalmachinechaos-desiredphase,
    physicalmachinechaos-condition, physicalmachinechaos-cleanFinalizers,
    podchaos-records, podchaos-initFinalizers, podchaos-desiredphase, podchaos-condition, podchaos-cleanFinalizers,
    stresschaos-records, stresschaos-initFinalizers, stresschaos-desiredphase, stresschaos-condition,
    stresschaos-cleanFinalizers,
    timechaos-records, timechaos-initFinalizers, timechaos-desiredphase, timechaos-condition, timechaos-cleanFinalizers,
    podhttpchaos, podiochaos, podnetworkchaos,
    workflow, statuscheck,
    schedule-active, schedule-cron, schedule-gc, schedule-pause
  ]
  image:
    registry: ghcr.io
    repository: chaos-mesh/chaos-mesh
    tag: v2.8.5@sha256:942bff26d591537f655df50532e3880d73fa8b6fca34a233fc69f8ccfd36188d
  podChaos:
    podFailure:
      # pod-failure swaps every container's image for this one. The chart's default (gcr.io/google-containers/pause:latest)
      # is amd64 only and unpinned; this one is multi-arch and pinned.
      pauseImage: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4

chaosDaemon:
  image:
    registry: ghcr.io
    repository: chaos-mesh/chaos-daemon
    tag: v2.8.5@sha256:d794bf427ab1dfacfd51c2f417d26731ce46919637b1c83620f0afd40f580bd4
  # EKS nodes on the Amazon Linux 2023 AMI run containerd; the chart's default is Docker's socket.
  runtime: containerd
  socketPath: /run/containerd/containerd.sock

dashboard:
  # No UI: the chart's dashboard is a NodePort Service by default (OPS-2). Experiments are manifests applied with
  # kubectl.
  create: false
  # Also read by the controller: it keeps the webhook that checks the creator of an experiment may act on its targets.
  securityMode: true

# DNSChaos is not used; its CoreDNS server would be one more pod with cluster rights.
dnsServer:
  create: false
