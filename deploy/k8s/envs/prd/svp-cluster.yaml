# Production, rendered and checked only until a production cluster exists. The hostnames of Gateway svp's two HTTPS
# listeners and their certificates are placeholders under the reserved .example TLD, which never resolves, so the
# render proves the k3d names (svp.localhost) can be overridden here; the real names come with the cloud cluster.
wildcardHost: "*.svp.example"
apexHost: svp.example

# The Secrets come from AWS Secrets Manager through External Secrets Operator: entry svp/prd/<entry>, a JSON object of
# the same keys as on a lab cluster. Each namespace's store assumes a role of its own, allowed GetSecretValue on the
# entries that namespace reads (templates/external-secrets.yaml of chart svp-cluster lists them). The region, the
# account id and the Postgres host are placeholders until the production cluster exists (stage 7 chooses them):
# 000000000000 is no account, and .example never resolves.
externalSecrets:
  enabled: true
  store: aws
  prefix: svp/prd/
  aws:
    region: us-east-1
    roles:
      svp: arn:aws:iam::000000000000:role/svp-prd-external-secrets-svp
      svp-data: arn:aws:iam::000000000000:role/svp-prd-external-secrets-svp-data
      svp-obs: arn:aws:iam::000000000000:role/svp-prd-external-secrets-svp-obs
      keda: arn:aws:iam::000000000000:role/svp-prd-external-secrets-keda
  postgres: svp-pg.prd.example:5432
