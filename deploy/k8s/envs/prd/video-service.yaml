# Production, rendered and checked only until a production cluster exists. Errors carry environment prd. The object
# store's public endpoint is a placeholder under the reserved .example TLD, which never resolves; the real name comes
# with the cloud cluster. A service on the request path keeps serving through a node loss or a drain: two replicas on
# two nodes, at most one taken down at a time. A floor of policy, not a measured size: resources wait for a load test.
env:
  S3_PUBLIC_ENDPOINT: https://s3.svp.example
  SENTRY_ENVIRONMENT: prd
replicas: 2
pdb:
  minAvailable: 1
spreadAcrossNodes: true
