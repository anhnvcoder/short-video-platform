# Envoy Gateway v1.9.2 (chart oci://docker.io/envoyproxy/gateway-helm), release envoy-gateway in namespace
# envoy-gateway-system. The chart also brings the Gateway
# API CRDs v1.6.1 (experimental channel). The proxy's own settings (Service, resources) are the EnvoyProxy of chart
# svp-cluster.

deployment:
  envoyGateway:
    resources:
      limits:
        # About 200 MiB expected at rest; the chart's 1 GiB would hide a leak on a machine with ~9.7 GiB for Docker.
        memory: 256Mi

# By default the controller watches every namespace, with a ClusterRole that reads every Secret of the cluster
# (svp/user-service-env, the JWT signing key, included) and patches every pod (the topology injector). Narrowed:
config:
  envoyGateway:
    provider:
      kubernetes:
        # The controller watches these namespaces only, and the chart binds its namespaced rules (get/list/watch on
        # Secrets, ConfigMaps, Services, EndpointSlices, Deployments, the Gateway API and Envoy Gateway kinds) in a
        # Role in each instead of cluster-wide; what stays cluster-wide is read access to nodes and namespaces,
        # GatewayClasses and ServiceImports, no Secret, no pod. svp-edge: Gateway svp and its certificate Secrets
        # svp-wildcard-tls and svp-apex-tls. svp and svp-data: HTTPRoutes api, web and s3 and their backend Services
        # (the namespaces labelled svp-gateway-routes in chart svp-cluster; a namespace given routes there must be added
        # here, or its routes are never seen). envoy-gateway-system: EnvoyProxy svp of GatewayClass svp, the
        # controller's own certificate Secrets and the Envoy fleet it runs there.
        #
        # This narrows the exception without closing it: Envoy Gateway v1.9.2 caches Secrets in every watched
        # namespace, for the TLS and policy Secrets a Gateway, route or policy there may name, and no value narrows
        # that by name, so the controller still reads the Secrets of svp and svp-data. Moving the routes out of those
        # namespaces would not help: their backend Services keep them watched, with the same Role.
        watch:
          type: Namespaces
          namespaces: [envoy-gateway-system, svp, svp-data, svp-edge]
        # Off, as topologyInjector below. The chart writes its own switch one level too high (proxyTopologyInjector at
        # the top of the EnvoyGateway config, which v1.9.2 ignores), so the controller would still serve the webhook
        # on 9443 with nothing calling it; this is where v1.9.2 reads it.
        proxyTopologyInjector:
          disabled: true

# The topology injector (a webhook on pod bindings in envoy-gateway-system that labels each Envoy pod with its node's
# zone, for zone-aware routing) needs patch and update on pods: cluster-wide, or in every watched namespace once watch
# is set. k3d's nodes have no zone, so it adds nothing here; off, the chart renders neither the webhook nor those rules,
# and its certgen Job no ClusterRole patching webhook configurations. Nothing else in the controller reads pods.
topologyInjector:
  enabled: false

# Images by digest (multi-arch index: linux/amd64 and linux/arm64), the chart's tag beside it for the reader: a tag can
# be pushed again to other content, a digest cannot. The chart splits
# these at the first "/" and ":" only, so version@digest stays whole after the colon;
# deploy/k8s/check-image-digests.sh fails on an image without one.
global:
  images:
    # The controller, its certgen Job, and the shutdown-manager sidecar it adds to every Envoy pod.
    envoyGateway:
      image: docker.io/envoyproxy/gateway:v1.9.2@sha256:9d67017c442a70e6ae9f1a358e6c80eb653c67c2e40823d9a991e0daf37ba926
    # Only started when a rate limit policy exists (none here); the same digest v1.9.2 has built in.
    ratelimit:
      image: docker.io/envoyproxy/ratelimit:0482748e@sha256:5fdd8e3ae335ab6d64316f8d2fd9a886830075cbbb40a1d8065c869275909162
    # envoyProxy.image stays unset: the Envoy proxy pods run the image the controller has built in,
    # docker.io/envoyproxy/envoy:distroless-v1.39.1@sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4
    # (DefaultEnvoyProxyImage, api/v1alpha1/shared_types.go@v1.9.2), already a digest, and it moves with the chart's
    # version, the Envoy release this controller was tested with. The chart never renders it, so the check above does
    # not see it.
