# Loki 3.7.8 (chart https://grafana-community.github.io/helm-charts loki 18.17.1, where the OSS chart moved from
# grafana/helm-charts), release loki in namespace svp-obs, wave 3 of deploy/argocd/apps/components.json.
# One single-binary pod on a local volume: the logs of one
# lab, far below what needs the scalable modes and their object storage. The Collector sends logs to the native OTLP
# endpoint http://loki.svp-obs:3100/otlp; Grafana reads at loki.svp-obs:3100. The pod already meets Pod Security
# "restricted" with the chart's defaults.

deploymentMode: Monolithic

loki:
  # By digest (multi-arch index: linux/amd64 and linux/arm64), the chart's appVersion beside it for the reader: a tag
  # can be pushed again to other content, a digest cannot. The chart
  # renders registry/repository:tag, so tag holds version@digest (its version label becomes 3.7.8-sha256-<hex>, a valid
  # label value); deploy/k8s/check-image-digests.sh fails on an image without one. Not the chart's own digest key:
  # Renovate's helm-values manager finds a pin only as repository and tag under a key ending in "image"
  # and updates both parts of tag, so version and digest change together; registry and repository are the
  # chart's defaults written out.
  image:
    registry: docker.io
    repository: grafana/loki
    tag: 3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
  # One tenant, no login, as Loki inside grafana/otel-lgtm: only the Collector and Grafana reach it (NetworkPolicy of
  # chart svp-observability).
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  # The chart sets no schema by default; the one of deploy/observability/lgtm/loki-config.yaml.
  schemaConfig:
    configs:
      - from: "2020-10-24"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  # As compose (deploy/observability/lgtm/loki-config.yaml, keep the two in step): logs arrive by OTLP, and only
  # service.name becomes an index label (service_name); every other resource attribute, trace_id and span_id stay
  # structured metadata, so no high-cardinality value (instance id, trace id, user or video id) creates streams.
  limits_config:
    allow_structured_metadata: true
    otlp_config:
      resource_attributes:
        ignore_defaults: true
        attributes_config:
          - action: index_label
            attributes:
              - service.name
  # No usage reports to stats.grafana.org, as in compose.
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    storageClass: local-path
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# The scalable targets stay at 0; nothing else of the chart is needed by one single binary: no nginx gateway (the
# Collector and Grafana call Loki itself), no canary or test pods, no memcached caches, no rules sidecar (alerting rules
# live in Prometheus).
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
sidecar:
  rules:
    enabled: false
