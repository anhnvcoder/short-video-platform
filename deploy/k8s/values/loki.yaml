# Loki 3.7.8 (chart https://grafana-community.github.io/helm-charts loki 18.17.1, where the OSS chart moved from
# grafana/helm-charts), release loki in namespace svp-obs, wave 3 of deploy/argocd/apps/components.json
# (docs/adr/0014-kubernetes-local-stage4.md, sections 2 and 11). One single-binary pod on a local volume: the logs of one
# lab, far below what needs the scalable modes and their object storage. The Collector sends logs to the native OTLP
# endpoint http://loki.svp-obs:3100/otlp; Grafana reads at loki.svp-obs:3100. The pod already meets Pod Security
# "restricted" with the chart's defaults.

deploymentMode: Monolithic

loki:
  # One tenant, no login, as Loki inside grafana/otel-lgtm: only the Collector and Grafana reach it (NetworkPolicy of
  # chart svp-observability).
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  # The chart sets no schema by default; the one of deploy/observability/lgtm/loki-config.yaml.
  schemaConfig:
    configs:
      - from: "2020-10-24"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  # As compose (deploy/observability/lgtm/loki-config.yaml, keep the two in step): logs arrive by OTLP, and only
  # service.name becomes an index label (service_name); every other resource attribute, trace_id and span_id stay
  # structured metadata, so no high-cardinality value (instance id, trace id, user or video id) creates streams.
  limits_config:
    allow_structured_metadata: true
    otlp_config:
      resource_attributes:
        ignore_defaults: true
        attributes_config:
          - action: index_label
            attributes:
              - service.name
  # No usage reports to stats.grafana.org, as in compose.
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    storageClass: local-path
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# The scalable targets stay at 0; nothing else of the chart is needed by one single binary: no nginx gateway (the
# Collector and Grafana call Loki itself), no canary or test pods, no memcached caches, no rules sidecar (alerting rules
# live in Prometheus).
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
sidecar:
  rules:
    enabled: false
