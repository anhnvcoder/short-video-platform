# Redpanda 26.2.4 (chart https://charts.redpanda.com redpanda 26.2.4), release redpanda in namespace svp-data, wave 3
# of deploy/argocd/apps/components.json (threat model IN-4).
# One broker, SASL SCRAM-SHA-256 on the Kafka listener, Admin API authenticated, no TLS (encrypting traffic inside the
# cluster is IN-3, stage 6). Topics, application users and their ACLs come from the init Job of chart svp-data
# (wave 4), which also brings the NetworkPolicies of svp-data.

# Same broker as compose. The chart takes a semver tag only (no digest), so the digest is pinned by the container
# entries under statefulset.podTemplate below, which replace the image of the chart's own containers.
image:
  repository: docker.io/redpandadata/redpanda
  tag: v26.2.4

statefulset:
  replicas: 1
  budget:
    # One broker: the chart's PodDisruptionBudget with maxUnavailable 1 would allow a drain anyway; kept as is.
    maxUnavailable: 1
  sideCars:
    image:
      repository: docker.io/redpandadata/redpanda-operator
      tag: v26.2.4@sha256:247d43566fffd766618f08f318c7adb78310305900db968b879dfd58cdc32722
  podTemplate:
    labels:
      # The sidecar holds a lease and reads its Secrets through the API server: allow-kube-api of chart svp-cluster
      # opens that egress only for pods with this label.
      svp-kube-api: allow
    spec:
      # Pod Security "restricted" (the namespace rejects pods that do not meet it): the chart's
      # defaults only reach "baseline".
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # The chart's hard anti-affinity and zone spread mean nothing with one broker; dropped so the pod schedules on
      # either node.
      affinity: null
      topologySpreadConstraints: null
      containers:
        - name: redpanda
          image: docker.io/redpandadata/redpanda:v26.2.4@sha256:c98c2f04a751e6646012cc701bac5183252cee44c88ba1dfa412e4c7124f2e89
          securityContext:
            capabilities:
              drop: [ALL]
          # The chart's postStart hook takes the broker out of maintenance mode with an unauthenticated curl, which
          # the Admin API refuses once admin_api_require_auth is on: it would retry for 45 s on every start before the
          # probes begin. Its preStop only puts a broker into maintenance with more than two replicas, so with one
          # broker there is nothing to undo. With three brokers or more this hook must run again, with credentials.
          lifecycle:
            postStart:
              exec:
                command: ["/bin/true"]
        - name: sidecar
          securityContext:
            capabilities:
              drop: [ALL]
      initContainers:
        - name: redpanda-configurator
          image: docker.io/redpandadata/redpanda:v26.2.4@sha256:c98c2f04a751e6646012cc701bac5183252cee44c88ba1dfa412e4c7124f2e89
          securityContext:
            capabilities:
              drop: [ALL]
        - name: bootstrap-yaml-envsubst
          securityContext:
            capabilities:
              drop: [ALL]

# The chart's own Job (redpanda-configuration, `redpanda-operator sync-cluster-config` after every install and upgrade)
# would apply config.cluster below and the superusers to the running cluster; it talks to the broker, which the
# NetworkPolicies of svp-data (wave 4, after this release) do not allow yet. Without it config.cluster takes effect only
# when the cluster forms (from .bootstrap.yaml): changing it later on a running cluster takes `rpk cluster config set`
# as svp-admin, or a new cluster (make k8s-down && make k8s-up). The init Job of chart svp-data sets only
# enable_consumer_group_metrics again (create-topics.sh); the sidecar keeps the superusers.
post_install_job:
  enabled: false

# Same footprint as compose (--smp 1 --memory 1G): --smp=1, --memory=1024M, and a request and limit of 1280Mi for the
# pod. --reserve-memory is set here instead of being derived by the chart (0.2% of the limit + 200 MiB, so 202M):
# Seastar refuses to start unless the cgroup limit, less the host kernel's vm.min_free_kbytes (which the container sees
# unchanged), less --reserve-memory, still holds --memory. 202M left 54 MiB for min_free_kbytes, which is 44 MiB in
# Docker Desktop's arm64 VM but 66 MiB on an x86_64 Linux host with transparent huge pages (67584 kB on GitHub's
# ubuntu-24.04 runner), where the broker stopped with "insufficient physical memory: needed 1073741824 available
# 1061158912". 128M leaves 128 MiB for it. Nothing else reads --reserve-memory (Redpanda only logs it): the broker
# still takes 1024M, and the limit still leaves it 256 MiB outside Seastar.
resources:
  cpu:
    cores: 1
    overprovisioned: true
  memory:
    container:
      max: 1280Mi
    redpanda:
      memory: 1Gi
      reserveMemory: 128Mi

storage:
  persistentVolume:
    size: 2Gi

auth:
  sasl:
    enabled: true
    mechanism: SCRAM-SHA-256
    # The chart treats every line of this Secret as a superuser, and its sidecar resets the cluster's superusers to
    # that set. deploy/k8s/secrets.sh writes it with svp-admin only, the account of the init Job; application users
    # are never listed here, the init Job creates them.
    secretRef: redpanda-superusers
    users: []
    bootstrapUser:
      name: svp-admin
      mechanism: SCRAM-SHA-256
      secretKeyRef:
        name: redpanda-bootstrap
        key: password

tls:
  enabled: false

# No listener is reachable from outside the cluster. external.enabled only drops the Service: each listener's
# "default" external listener would still listen on 0.0.0.0, so every one is turned off as well.
external:
  enabled: false
listeners:
  admin:
    external:
      default:
        enabled: false
  kafka:
    # Same port as compose; the chart's default is 9093.
    port: 9092
    external:
      default:
        enabled: false
  http:
    external:
      default:
        enabled: false
  schemaRegistry:
    external:
      default:
        enabled: false

console:
  enabled: false

tuning:
  # On by default, it adds a privileged init container running as root that Pod Security "restricted" refuses.
  tune_aio_events: false

config:
  cluster:
    # Topics come from the init Job only; a mistyped topic name must fail, not create a topic.
    auto_create_topics_enabled: false
    # Consumer lag on /public_metrics for the Collector (and KEDA reads lag itself); the init Job sets it again.
    enable_consumer_group_metrics: [group, partition, consumer_lag]
    # Without it, a caller of the Admin API with no Authorization header is treated as a superuser: any pod that
    # reaches 9644 could change the cluster's configuration and its users, bypassing the Kafka ACLs.
    # /v1/status/ready and the metrics endpoints stay open.
    admin_api_require_auth: true
    # The broker's own usage report to Redpanda (https://m.rp.vectorized.io), on by default; logging.usageStats below
    # turns off rpk's and the chart's only. The lab sends nothing out (and svp-data's egress policy would drop it).
    enable_metrics_reporter: false

logging:
  usageStats:
    enabled: false

tests:
  enabled: false
