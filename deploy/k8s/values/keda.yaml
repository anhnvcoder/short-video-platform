# KEDA 2.21.0 (chart https://kedacore.github.io/charts keda 2.21.0), release keda in namespace keda, wave 2 of
# deploy/argocd/apps/components.json (docs/adr/0014-kubernetes-local-stage4.md, sections 1, 10 and 12): the operator,
# its metrics API server (external.metrics.k8s.io, which the HPA controller reads) and its admission webhooks, plus
# the CRDs. The ScaledObject of media-worker is in chart svp-service (wave 7), the ClusterTriggerAuthentication it logs
# in with in chart svp-data (wave 4). The chart's pods already meet Pod Security "restricted" (non-root, read-only
# root, drop ALL, seccomp RuntimeDefault); requests and limits stay the chart's (100m / 100Mi, 1 / 1000Mi each).
#
# The operator holds cluster-wide rights, so whoever takes it over (its ServiceAccount token) holds them too. The three
# settings below keep those rights short of every Secret outside namespace keda: the JWT signing key in
# svp/user-service-env, the passwords in svp-data. What the operator keeps is listed above extraObjects.

permissions:
  operator:
    restrict:
      # By default the operator lists and watches every Secret of the cluster. Restricted, it reads the Secrets of its
      # own namespace keda only (Role keda-operator-certs below; env KEDA_RESTRICT_SECRET_ACCESS): Secret
      # keda/keda-kafka, made by deploy/k8s/secrets.sh, which ClusterTriggerAuthentication keda-kafka points to. A
      # TriggerAuthentication in another namespace can then no longer use a Secret of its own namespace.
      secret: true

certificates:
  certManager:
    # cert-manager (wave 0) issues the TLS certificate of the operator, the metrics server and the webhooks from a CA of
    # their own in namespace keda, and its cainjector writes that CA into APIService v1beta1.external.metrics.k8s.io and
    # ValidatingWebhookConfiguration keda-admission. Left to KEDA (the default), the operator makes and rotates them
    # itself, which needs patch on every ValidatingWebhookConfiguration and APIService of the cluster: enough to add a
    # webhook the API server sends every Secret written in the cluster to, or to route an API group to a Service of its
    # choosing.
    enabled: true

rbac:
  # The chart's ClusterRole keda-operator always grants create on batch/jobs and get on pods in every namespace, for
  # ScaledJob, and no value turns that off: a Job in svp with envFrom user-service-env, whose container writes its
  # environment to its termination log, would hand the signing key to whoever reads the pod's status. With
  # enabledCustomScaledRefKinds on (the default) it grants get on every resource of the cluster as well. So the chart
  # renders no RBAC (this value turns off the metrics server's and the webhooks' too), and extraObjects below holds
  # every Role, ClusterRole and binding the chart renders with the values above, under the same names, unchanged but for
  # ClusterRole keda-operator. Nothing here uses a ScaledJob.
  #
  # Upgrading KEDA: render the new chart with the chart's RBAC (helm template keda keda --repo
  # https://kedacore.github.io/charts --version <new> --namespace keda --values deploy/k8s/values/keda.yaml --set
  # rbac.create=true --set rbac.enabledCustomScaledRefKinds=false --set-json 'extraObjects=[]'), compare its Roles,
  # ClusterRoles and bindings with extraObjects, take every change but the rules dropped from keda-operator, and check
  # that the operator logs no "forbidden" (kubectl --context k3d-svp -n keda logs deployment/keda-operator | grep -i
  # forbidden) for 5 minutes.
  create: false

image:
  # The tags are the chart's version, which never changes under a pinned chart; Always would reach ghcr.io at every
  # start of a pod, so a cluster restarted offline could not start KEDA.
  pullPolicy: IfNotPresent

# The RBAC of KEDA 2.21.0 as its chart renders it with the values above, but for ClusterRole keda-operator.
#
# What a taken-over operator keeps: read every ConfigMap, Service, ServiceAccount (not its tokens), EndpointSlice,
# Deployment, ReplicaSet and StatefulSet of the cluster; set the replicas of any Deployment or StatefulSet and create,
# change or delete any HPA (it can stop workloads, not read their Secrets); change KEDA's own objects; read the Secrets
# of namespace keda: keda-kafka (svp-keda, which may only DESCRIBE) and KEDA's own CA and certificate.
extraObjects:
  # Dropped from the chart's rules: pods (get, list, watch), batch/jobs (create, delete, get, list, patch, update,
  # watch), and every verb on scaledjobs but get, list, watch, as well as scaledjobs/finalizers and scaledjobs/status.
  # The ScaledJob controller runs whatever the values, and watches ScaledJobs.
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: keda-operator
      labels:
        app.kubernetes.io/name: keda-operator
        app.kubernetes.io/part-of: keda-operator
    rules:
      - apiGroups: [""]
        resources: [configmaps, configmaps/status, limitranges, services, serviceaccounts]
        verbs: [get, list, watch]
      - apiGroups: [events.k8s.io, ""]
        resources: [events]
        verbs: [create, patch]
      - apiGroups: [discovery.k8s.io]
        resources: [endpointslices]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [deployments/scale, statefulsets/scale]
        verbs: [get, list, patch, update, watch]
      - apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets]
        verbs: [get, list, watch]
      - apiGroups: [autoscaling]
        resources: [horizontalpodautoscalers]
        verbs: [create, delete, get, list, patch, update, watch]
      - apiGroups: [eventing.keda.sh]
        resources: [cloudeventsources, cloudeventsources/status, clustercloudeventsources,
          clustercloudeventsources/status]
        verbs: [get, list, patch, update, watch]
      - apiGroups: [keda.sh]
        resources: [scaledobjects, scaledobjects/finalizers, scaledobjects/status, triggerauthentications,
          triggerauthentications/status]
        verbs: [get, list, patch, update, watch]
      - apiGroups: [keda.sh]
        resources: [scaledjobs]
        verbs: [get, list, watch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: keda-operator
      labels:
        app.kubernetes.io/name: keda-operator
        app.kubernetes.io/part-of: keda-operator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: keda-operator
    subjects:
      - kind: ServiceAccount
        name: keda-operator
        namespace: keda
  # Leader election, and the Secrets of namespace keda: its own certificate by name, all of them by list and watch
  # (permissions.operator.restrict.secret).
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: keda-operator-certs
      namespace: keda
      labels:
        app.kubernetes.io/name: keda-operator-certs
        app.kubernetes.io/part-of: keda-operator
    rules:
      - apiGroups: [coordination.k8s.io]
        resources: [leases]
        verbs: [create, delete, get, list, patch, update, watch]
      - apiGroups: [""]
        resources: [secrets]
        verbs: [get]
        resourceNames: [kedaorg-certs]
      - apiGroups: [""]
        resources: [secrets]
        verbs: [list, watch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: keda-operator-certs
      namespace: keda
      labels:
        app.kubernetes.io/name: keda-operator-certs
        app.kubernetes.io/part-of: keda-operator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: keda-operator-certs
    subjects:
      - kind: ServiceAccount
        name: keda-operator
        namespace: keda
  # With certificates from cert-manager this ClusterRole has no rule on webhooks or APIServices.
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: keda-operator-minimal-cluster-role
      labels:
        app.kubernetes.io/name: keda-operator-minimal-cluster-role
        app.kubernetes.io/part-of: keda-operator
    rules:
      - apiGroups: [keda.sh]
        resources: [clustertriggerauthentications, clustertriggerauthentications/status]
        verbs: [get, list, patch, update, watch]
      - apiGroups: [eventing.keda.sh]
        resources: [cloudeventsources, cloudeventsources/status, clustercloudeventsources,
          clustercloudeventsources/status]
        verbs: [get, list, patch, update, watch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: keda-operator-minimal
      labels:
        app.kubernetes.io/name: keda-operator-minimal
        app.kubernetes.io/part-of: keda-operator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: keda-operator-minimal-cluster-role
    subjects:
      - kind: ServiceAccount
        name: keda-operator
        namespace: keda
  # The HPA controller reads the external metrics KEDA serves.
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: keda-operator-external-metrics-reader
      labels:
        app.kubernetes.io/name: keda-operator-external-metrics-reader
        app.kubernetes.io/part-of: keda-operator
    rules:
      - apiGroups: [external.metrics.k8s.io]
        resources: [externalmetrics]
        verbs: [get]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: keda-operator-hpa-controller-external-metrics
      labels:
        app.kubernetes.io/name: keda-operator-hpa-controller-external-metrics
        app.kubernetes.io/part-of: keda-operator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: keda-operator-external-metrics-reader
    subjects:
      - kind: ServiceAccount
        name: horizontal-pod-autoscaler
        namespace: kube-system
  # The metrics server, an extension API server, checks the callers' tokens and rights with the API server and reads
  # the request-header CA from ConfigMap kube-system/extension-apiserver-authentication: a RoleBinding in kube-system,
  # to the Role that exists there only (AppProject svp allows that namespace).
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: keda-operator-system-auth-delegator
      labels:
        app.kubernetes.io/name: keda-operator-system-auth-delegator
        app.kubernetes.io/part-of: keda-operator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:auth-delegator
    subjects:
      - kind: ServiceAccount
        name: keda-metrics-server
        namespace: keda
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: keda-operator-auth-reader
      namespace: kube-system
      labels:
        app.kubernetes.io/name: keda-operator-auth-reader
        app.kubernetes.io/part-of: keda-operator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: extension-apiserver-authentication-reader
    subjects:
      - kind: ServiceAccount
        name: keda-metrics-server
        namespace: keda
  # The admission webhooks validate ScaledObjects against the HPAs and workloads they target.
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: keda-operator-webhook
      labels:
        app.kubernetes.io/name: keda-operator-webhook
        app.kubernetes.io/part-of: keda-operator
    rules:
      - apiGroups: [autoscaling]
        resources: [horizontalpodautoscalers]
        verbs: [list, watch]
      - apiGroups: [keda.sh]
        resources: [scaledobjects]
        verbs: [list, watch]
      - apiGroups: [apps]
        resources: [deployments, statefulsets]
        verbs: [get, list, watch]
      - apiGroups: [""]
        resources: [limitranges]
        verbs: [list]
      - apiGroups: [events.k8s.io]
        resources: [events]
        verbs: [create, patch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: keda-operator-webhook
      labels:
        app.kubernetes.io/name: keda-operator-webhook
        app.kubernetes.io/part-of: keda-operator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: keda-operator-webhook
    subjects:
      - kind: ServiceAccount
        name: keda-webhook
        namespace: keda
