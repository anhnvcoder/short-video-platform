# Release gateway of chart deploy/helm/svp-service: the
# public HTTP API behind Envoy at https://api.svp.localhost:8443. Secret gateway-env holds JWT_VERIFY_KEYS, public
# keys only: the gateway verifies tokens, it cannot sign them (threat model JWT-10).
image:
  # Releases on GHCR, built, scanned and signed by CI (.github/workflows/images.yml). The promote pull request
  # writes the three lines below; the GitOps cluster pulls the digest, the tag names the commit for people. Empty:
  # no release yet. The dev path (make k8s-up) ignores them and passes its own registry, tag and an empty digest.
  repository: ghcr.io/anhnvcoder/short-video-platform/gateway
  tag: "0f3156f8d153"
  digest: "sha256:c905fdb9b003915945987b29629b81460ebae9122772680c91861dcfd57996ff"
protocol: http
port: 8080
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 256Mi}
env:
  LISTEN_ADDR: ":8080"
  USER_SERVICE_ADDR: user-service:9101
  VIDEO_SERVICE_ADDR: video-service:9102
  FEED_SERVICE_ADDR: feed-service:9104
  ENGAGEMENT_SERVICE_ADDR: engagement-service:9103
  # Playlist and thumbnail URLs handed to clients: the object store's media bucket through Gateway svp.
  MEDIA_PUBLIC_BASE_URL: https://s3.svp.localhost:8443/media
  # Rate limits are counted in Valkey db 10 so every gateway pod shares one count; Valkey down, the gateway falls back
  # to in-memory counters.
  REDIS_URL: redis://valkey.svp-data:6379/10
  # Envoy appends the address of the connection it got to X-Forwarded-For: one trusted hop, believed only when the
  # connection comes from the pod range, which the policy below narrows to Envoy's pods and the web client's, whose BFF
  # passes on the header Envoy set without adding a hop (threat model RL-1, WEB-8).
  TRUSTED_PROXY_HOPS: "1"
  TRUSTED_PROXY_CIDRS: 10.42.0.0/16
  # Spans of a request become children of the traceparent it carries, so a page of the web client and the API calls it
  # makes are one trace. Safe here only because nothing else can set one: every HTTPRoute of chart svp-service removes
  # the trace context a client sends, and only Envoy and the web pods may reach the gateway (threat model WEB-24).
  TRUST_TRACE_CONTEXT: "true"
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.svp-obs:4040
  SENTRY_ENVIRONMENT: k3d
# SENTRY_DSN from Secret sentry (errors to GlitchTip in svp-obs).
errorTracking: true
# Envoy for the public API, the web client's BFF for the API calls of its pages.
ingressFrom: [envoy, web]
egressTo: [user-service, video-service, engagement-service, feed-service, valkey, collector, pyroscope, glitchtip]
httpRoute:
  host: api.svp.localhost
  # The name the gateway's route always had: the canary drills, measure-canary and Argo CD read HTTPRoute api.
  name: api
# A Rollout with an analysed canary instead of a Deployment: a new revision gets 25%, then 50% of the
# requests through Envoy before it is promoted, and a canary whose 5xx or p99 Envoy measures above the limits is aborted
# without a person. `make k8s-up` runs drill traffic while a canary is in progress (deploy/k8s/install.sh).
canary: true
# The latency limit is the SLO of the feed, p99 150 ms (deploy/observability/slo/svp-slos.yaml), and 1% of 5xx is the
# 99.9% availability SLO loosened for a sample of about a hundred responses.
canaryLimits:
  p99Ms: 150
  errorRatio: 0.01
# Two replicas at least, on the two nodes, so a node drain or a crash leaves one serving; up to four on CPU. 70% of
# the 100m request leaves headroom before the pods are busy, and four replicas of at most 1 CPU each stay well inside
# the machine's 8 CPUs beside three transcoding media-workers.
hpa:
  minReplicas: 2
  maxReplicas: 4
  cpuUtilization: 70
pdb:
  minAvailable: 1
spreadAcrossNodes: true
