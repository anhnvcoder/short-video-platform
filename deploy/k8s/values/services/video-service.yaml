# Release video-service of chart deploy/helm/svp-service (docs/adr/0014-kubernetes-local-stage4.md, section 10).
# Secret video-service-env holds DATABASE_URL (app role), the Kafka login and MinIO user svp-video-service's secret key;
# video-service-migrate-env the migrator role's DATABASE_URL.
image:
  repository: k3d-svp-registry:5111/svp/video-service
  # Written by a release; empty means "the dev tag make k8s-up passes".
  tag: ""
protocol: grpc
port: 9102
migrate: true
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
env:
  LISTEN_ADDR: ":9102"
  KAFKA_BROKERS: redpanda.svp-data.svc.cluster.local:9092
  # Calls to MinIO stay in the cluster; the presigned upload URLs handed to clients name MinIO through Gateway svp
  # (ADR section 9).
  S3_ENDPOINT: http://minio.svp-data:9000
  S3_PUBLIC_ENDPOINT: https://s3.svp.localhost:8443
  S3_ACCESS_KEY_ID: svp-video-service
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.svp-obs:4040
  SENTRY_ENVIRONMENT: k3d
# SENTRY_DSN from Secret sentry (errors to GlitchTip in svp-obs).
errorTracking: true
ingressFrom: [gateway]
egressTo: [postgres, redpanda, minio, collector, pyroscope, glitchtip]
