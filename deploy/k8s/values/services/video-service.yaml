# Release video-service of chart deploy/helm/svp-service.
# Secret video-service-env holds DATABASE_URL (app role), the Kafka login and the object store user svp-video-service's
# secret key; video-service-migrate-env the migrator role's DATABASE_URL.
image:
  # Releases on GHCR, built, scanned and signed by CI (.github/workflows/images.yml). The promote pull request
  # writes the three lines below; the GitOps cluster pulls the digest, the tag names the commit for people. Empty:
  # no release yet. The dev path (make k8s-up) ignores them and passes its own registry, tag and an empty digest.
  repository: ghcr.io/anhnvcoder/short-video-platform/video-service
  tag: "1ded60f3678f"
  digest: "sha256:cb547a3e0dd62e87fd0e83c45f3515b4a8531182918d200eb897e4aeb0c68703"
protocol: grpc
port: 9102
migrate: true
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
env:
  LISTEN_ADDR: ":9102"
  KAFKA_BROKERS: redpanda.svp-data.svc.cluster.local:9092
  # Calls to the object store stay in the cluster; the presigned upload URLs handed to clients name it through Gateway
  # svp: the browser uploads straight to the store, so the host in the form must be reachable from outside.
  S3_ENDPOINT: http://s3.svp-data:9000
  S3_PUBLIC_ENDPOINT: https://s3.svp.localhost:8443
  S3_ACCESS_KEY_ID: svp-video-service
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.svp-obs:4040
  SENTRY_ENVIRONMENT: k3d
# SENTRY_DSN from Secret sentry (errors to GlitchTip in svp-obs).
errorTracking: true
ingressFrom: [gateway]
egressTo: [postgres, redpanda, s3, collector, pyroscope, glitchtip]
