# Release engagement-service of chart deploy/helm/svp-service (docs/adr/0014-kubernetes-local-stage4.md, section 10).
# Secret engagement-service-env holds DATABASE_URL (app role) and the Kafka login; engagement-service-migrate-env the
# migrator role's DATABASE_URL.
image:
  # Releases on GHCR, built, scanned and signed by CI (.github/workflows/images.yml). The promote pull request
  # writes the three lines below; the GitOps cluster pulls the digest, the tag names the commit for people. Empty:
  # no release yet. The dev path (make k8s-up) ignores them and passes its own registry, tag and an empty digest.
  repository: ghcr.io/anhnvcoder/short-video-platform/engagement-service
  tag: "eda124952baf"
  digest: "sha256:d4e2ba7faf25086ff53c477f199f6a557140c13b81d0614c1991ba1333b9e7f9"
protocol: grpc
port: 9103
migrate: true
resources:
  requests: {cpu: 50m, memory: 32Mi}
  limits: {cpu: 500m, memory: 256Mi}
env:
  LISTEN_ADDR: ":9103"
  # Produces and consumes engagement.views.v1: views are counted in batches (ADR-0009 sections 3, 4 and 11).
  KAFKA_BROKERS: redpanda.svp-data.svc.cluster.local:9092
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.svp-obs:4040
  SENTRY_ENVIRONMENT: k3d
# SENTRY_DSN from Secret sentry (errors to GlitchTip in svp-obs).
errorTracking: true
ingressFrom: [gateway]
egressTo: [postgres, redpanda, collector, pyroscope, glitchtip]
