# Release feed-service of chart deploy/helm/svp-service.
# Secret feed-service-env holds DATABASE_URL (app role) and the Kafka login; feed-service-migrate-env the migrator
# role's DATABASE_URL.
image:
  # Releases on GHCR, built, scanned and signed by CI (.github/workflows/images.yml). The promote pull request
  # writes the three lines below; the GitOps cluster pulls the digest, the tag names the commit for people. Empty:
  # no release yet. The dev path (make k8s-up) ignores them and passes its own registry, tag and an empty digest.
  repository: ghcr.io/anhnvcoder/short-video-platform/feed-service
  tag: "6ca2d8a795dd"
  digest: "sha256:c53dad24ad28b7e512d4d79f8889ad4df5ee215e9e86ace0b87a87b0d1df6e1a"
protocol: grpc
port: 9104
migrate: true
resources:
  # Compose peaked at 82 MiB while loading 200,000 follows.
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 256Mi}
env:
  LISTEN_ADDR: ":9104"
  # Consumes user.follows.v1 and video.lifecycle.v1 to build the timelines on write.
  KAFKA_BROKERS: redpanda.svp-data.svc.cluster.local:9092
  # The first explore page is cached in Valkey db 14 for 5 s.
  REDIS_URL: redis://valkey.svp-data:6379/14
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.svp-obs:4040
  SENTRY_ENVIRONMENT: k3d
# SENTRY_DSN from Secret sentry (errors to GlitchTip in svp-obs).
errorTracking: true
ingressFrom: [gateway]
egressTo: [postgres, redpanda, valkey, collector, pyroscope, glitchtip]
# Two replicas always, preferably on the two nodes, so a killed or crashed pod, a node drain or an eviction leaves one
# serving the feeds while its replacement starts: with a single replica the gateway's retries (well under a second) end
# before a new pod is Ready, and the feed requests of that gap fail. The spread is a preference only (the chart's
# whenUnsatisfiable: ScheduleAnyway): both pods may still land on one node. The budget lets a drain take one pod at a
# time. The maximum stays at two, within the RAM the machine leaves for the cluster, so the autoscaler does not scale
# today; it stays for a higher maximum later, with 70% of the 100m CPU request as the point where it scales out.
# Risk: each gateway pod holds one long-lived HTTP/2 connection to feed-service:9104 through the ClusterIP (grpc-go's
# pick_first; kube-proxy picks the backend when the connection opens), so the load splits by connections, not by
# requests, and can be uneven between the two pods.
hpa:
  minReplicas: 2
  maxReplicas: 2
  cpuUtilization: 70
pdb:
  minAvailable: 1
spreadAcrossNodes: true
