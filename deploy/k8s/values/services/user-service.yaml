# Release user-service of chart deploy/helm/svp-service (docs/adr/0014-kubernetes-local-stage4.md, section 10).
# Secret user-service-env holds DATABASE_URL (app role), the Kafka login and the JWT signing key, which exists in this
# Secret only (threat model JWT-10); user-service-migrate-env the migrator role's DATABASE_URL.
image:
  repository: k3d-svp-registry:5111/svp/user-service
  # Written by a release; empty means "the dev tag make k8s-up passes".
  tag: "1b6f2c88672a"
protocol: grpc
port: 9101
migrate: true
resources:
  # Up to 4 argon2id hashes of 64 MiB at once (threat model JWT-9), plus the runtime and the connection pool.
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 384Mi}
env:
  # The pod's address, so the gateway reaches it through the Service.
  LISTEN_ADDR: ":9101"
  # Follow events go out through the outbox (ADR-0009 section 1), as user svp-user-service (SASL SCRAM-SHA-256).
  KAFKA_BROKERS: redpanda.svp-data.svc.cluster.local:9092
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.svp-obs:4040
  SENTRY_ENVIRONMENT: k3d
# SENTRY_DSN from Secret sentry (errors to GlitchTip in svp-obs).
errorTracking: true
ingressFrom: [gateway]
egressTo: [postgres, redpanda, collector, pyroscope, glitchtip]
