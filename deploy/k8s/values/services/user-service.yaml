# Release user-service of chart deploy/helm/svp-service.
# Secret user-service-env holds DATABASE_URL (app role), the Kafka login and the JWT signing key, which exists in this
# Secret only (threat model JWT-10); user-service-migrate-env the migrator role's DATABASE_URL.
image:
  # Releases on GHCR, built, scanned and signed by CI (.github/workflows/images.yml). The promote pull request
  # writes the three lines below; the GitOps cluster pulls the digest, the tag names the commit for people. Empty:
  # no release yet. The dev path (make k8s-up) ignores them and passes its own registry, tag and an empty digest.
  repository: ghcr.io/anhnvcoder/short-video-platform/user-service
  tag: "0f3156f8d153"
  digest: "sha256:5f3e626ac1848666b88faa11549364d84ef6309b8409e5e4a8182abc9652ec07"
protocol: grpc
port: 9101
migrate: true
resources:
  # Up to 4 argon2id hashes of 64 MiB at once (threat model JWT-9), plus the runtime and the connection pool.
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 384Mi}
env:
  # The pod's address, so the gateway reaches it through the Service.
  LISTEN_ADDR: ":9101"
  # Follow events go out through the outbox, as user svp-user-service (SASL SCRAM-SHA-256).
  KAFKA_BROKERS: redpanda.svp-data.svc.cluster.local:9092
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.svp-obs:4040
  SENTRY_ENVIRONMENT: k3d
# SENTRY_DSN from Secret sentry (errors to GlitchTip in svp-obs).
errorTracking: true
ingressFrom: [gateway]
egressTo: [postgres, redpanda, collector, pyroscope, glitchtip]
