# Release media-worker of chart deploy/helm/svp-service: no
# port, no probe (the process exits when its consumer fails and the kubelet starts it again), no profiler, no error
# tracker, as in compose. Secret media-worker-env holds the Kafka login and the object store user svp-media-worker's
# secret key.
image:
  # Releases on GHCR, built, scanned and signed by CI (.github/workflows/images.yml). The promote pull request
  # writes the three lines below; the GitOps cluster pulls the digest, the tag names the commit for people. Empty:
  # no release yet. The dev path (make k8s-up) ignores them and passes its own registry, tag and an empty digest.
  repository: ghcr.io/anhnvcoder/short-video-platform/media-worker
  tag: "39dcedeacb80"
  digest: "sha256:eb54eceaa20e2031cba9d20dd9f0f520a1f5b524af1e7ccfa962b9f6fb459690"
protocol: none
resources:
  # As compose (threat model FF-3): one transcode peaked at 734 MiB.
  requests: {cpu: 500m, memory: 256Mi}
  limits: {cpu: "2", memory: 2Gi}
env:
  KAFKA_BROKERS: redpanda.svp-data.svc.cluster.local:9092
  S3_ENDPOINT: http://s3.svp-data:9000
  S3_ACCESS_KEY_ID: svp-media-worker
  WORK_DIR: /work
# The root filesystem is read-only. /work is each pod's own job scratch space on disk (a job needs under 1 GB),
# so the compose rule of exactly one replica, which shares one volume, does not apply here; ffmpeg
# needs a small /tmp.
scratch:
  work:
    mountPath: /work
    sizeLimit: 2Gi
  tmp:
    mountPath: /tmp
    medium: Memory
    sizeLimit: 16Mi
# On SIGTERM the worker cancels the job in hand at once (ffmpeg killed, nothing published or committed) and the record
# goes to whichever worker takes the partition, so waiting longer would not let the job finish: 30 s covers closing
# the Kafka clients and flushing telemetry.
terminationGracePeriodSeconds: 30
# Reached by no pod (threat model FF-5); reaches Redpanda, the object store and the Collector only, never the internet,
# the gateway or a gRPC service.
ingressFrom: []
egressTo: [redpanda, s3, collector]
# Scaled by KEDA on the lag of group media-worker on video.lifecycle.v1 (CPU says nothing about the queue: a worker
# waiting for a job is idle while jobs pile up). Each worker handles one job at a time (one record per poll), so
# lagThreshold 1 asks for one replica per record waiting or in hand, up to 2. Not 3, the topic's partition count: with
# 3 workers transcoding at once (2 CPUs each) the 8-vCPU Docker VM ran 99 % busy with 1.06 GiB available and swapping,
# k3s's kine compaction hit its 20 s limit and the k3s server exited, twice in the GitOps cluster. Both
# paths read this file. The topic keeps 3 partitions, so one of the 2 workers owns two; a consumer beyond the partition
# count would get none. The HPA KEDA makes reads the lag every 15 s.
keda:
  minReplicas: 1
  maxReplicas: 2
  kafka:
    topic: video.lifecycle.v1
    consumerGroup: media-worker
    lagThreshold: "1"
