# cert-manager v1.21.2 (chart https://charts.jetstack.io), release cert-manager in namespace cert-manager
# (docs/adr/0014-kubernetes-local-stage4.md, sections 1, 9 and 12).

# The chart installs no CRDs unless asked; the issuers and certificates of chart svp-cluster need them.
crds:
  enabled: true

global:
  leaderElection:
    # The default kube-system would make the chart render two Roles and RoleBindings there; the leader election Lease
    # stays in the chart's own namespace instead.
    namespace: cert-manager

# RBAC: the chart's, unchanged, an exception to the rule that no workload outside the control plane reads Secrets
# outside its own namespace (docs/adr/0014-kubernetes-local-stage4.md). What it grants, in every namespace:
# - the controller (ServiceAccount cert-manager): get, list, watch, create, update, patch and delete on Secrets (the key
#   pair of each Certificate, the CA of each issuer); create and delete on pods and Services, create and update on
#   Ingresses and HTTPRoutes (the ACME HTTP-01 solver);
# - cainjector (cert-manager-cainjector): get, list and watch on Secrets, update and patch on every webhook
#   configuration, APIService and CustomResourceDefinition (it writes a CA into them).
# Why it stays: the Certificates are in four namespaces (cert-manager: svp-local-ca, svp-edge: svp-wildcard, keda: the
# operator's, metrics server's and webhooks', cnpg-system: cnpg-webhook, CloudNativePG's webhook), and the controller
# writes each key pair into its Certificate's namespace and watches those Secrets; v1.21.2 has no namespaced RBAC, and
# --namespace makes the controller serve one namespace and turns ClusterIssuers off, which svp-selfsigned and svp-ca
# are. cainjector writes KEDA's CA into APIService v1beta1.external.metrics.k8s.io and ValidatingWebhookConfiguration
# keda-admission, CloudNativePG's into cnpg-mutating-webhook-configuration and cnpg-validating-webhook-configuration,
# and cert-manager's own into its webhook configurations and CRDs; that is what lets KEDA and the CloudNativePG
# operator hold no right on webhooks and APIServices. The ACME rights are unused (no ACME issuer), but the chart cannot
# drop them alone, and with Secrets of every namespace still readable, rendering its RBAC here without them would not
# change what a stolen token reads. What limits it instead: no route of Gateway svp leads to its pods, and a pod it
# creates, in any namespace, is held to Pod Security restricted (namespace labels, and the API server's default for
# namespaces without them: deploy/k8s/pod-security-admission.yaml), except in kube-system, which k3s's own pods keep
# exempt: a stolen controller token can still start a privileged pod there, root on the node.
