# External Secrets Operator 2.14.0 (chart https://charts.external-secrets.io external-secrets 2.14.0), release
# external-secrets in namespace external-secrets, wave 0 of deploy/argocd/apps/components.json, on the GitOps path only
# (gitopsOnly there: deploy/k8s/install.sh skips it, so the dev path keeps its Secrets from deploy/k8s/secrets.sh). It
# builds the Secrets of the GitOps path from the ExternalSecrets and SecretStores of chart svp-cluster
# (templates/external-secrets.yaml), which read a store of values outside git: on a lab cluster the Secrets of namespace
# svp-secrets, which deploy/k8s/secrets.sh fills from .env. Wave 0 so that its CRDs exist before svp-cluster (wave 1).
#
# With these values the chart renders its CRDs, the controller's Deployment, ServiceAccount and RBAC, nothing else: no
# webhook, no cert-controller, no Service, no ServiceMonitor, no kind of another chart, so the Application syncs on a
# new cluster and is Healthy once the controller is Ready. Its pod meets Pod Security "restricted" as the chart renders
# it (non-root, read-only root, drop ALL, seccomp RuntimeDefault, no privilege escalation).

# Namespaced kinds only. No ClusterSecretStore, so no store reads the source of values for every namespace: each
# namespace has its own SecretStore, whose ServiceAccount may read only the entries that namespace needs. No
# ClusterExternalSecret, no PushSecret (nothing is written back to a store), no ClusterGenerator. Each process* off
# needs its CRD off too, and the reverse.
processClusterExternalSecret: false
processClusterPushSecret: false
processClusterStore: false
processClusterGenerator: false
processPushSecret: false
crds:
  createClusterExternalSecret: false
  createClusterSecretStore: false
  createClusterGenerator: false
  createClusterPushSecret: false
  createPushSecret: false

rbac:
  # Whoever may create an ExternalSecret in a namespace reads what the store of that namespace reads: the chart would
  # add create on ExternalSecrets and SecretStores to the default ClusterRoles view, edit and admin. Off, only Argo CD
  # (Application svp-cluster) creates them.
  aggregateToView: false
  aggregateToEdit: false
  aggregateToAdmin: false
  # The chart's ClusterRole would let the controller create a token for every ServiceAccount of the cluster (Argo CD's
  # application controller included). Off: chart svp-cluster gives it, in each namespace with a SecretStore, a Role
  # that creates tokens for that store's ServiceAccount alone.
  serviceAccountTokenCreate: false
  # A ClusterRole for Service Binding controllers to read ExternalSecrets; none runs here.
  servicebindings:
    create: false
  # The Role and RoleBinding of leader election, used only with leaderElect (one replica here).
  leaderElection:
    create: false
  # Kept: the chart's ClusterRole of the controller still gets, lists and watches every Secret of the cluster, and
  # writes them. The controller always watches the metadata of every Secret (WatchesMetadata of Secret in
  # externalsecret_controller.go of v2.14.0, whatever --enable-managed-secrets-caching says), which needs list and watch
  # on Secrets cluster-wide, and a right to list is a right to read. Its writes are held to the four namespaces of the
  # ExternalSecrets, and never a token Secret, by ValidatingAdmissionPolicy svp-external-secrets-writes of chart
  # svp-cluster.

# The admission webhook only validates SecretStores and ExternalSecrets (the controller checks a template itself before
# it writes), and its certificate would need either the chart's cert-controller, another pod whose ClusterRole reads
# every Secret of the cluster, or an Issuer of cert-manager, whose ClusterIssuers come with svp-cluster after this
# chart. Without it, a wrong SecretStore or ExternalSecret is admitted (the API server checks the CRD's schema only) and
# shows as Ready=False, which Argo CD reports as Degraded with the message; make helm-check checks the rendered ones
# against the schemas of these CRDs. The CRDs serve one version, so no conversion webhook is needed either.
webhook:
  create: false
certController:
  create: false

image:
  # The tag is the chart's version, which never changes under a pinned chart; Always would reach ghcr.io at every
  # start of the pod.
  pullPolicy: IfNotPresent
  # By digest (multi-arch index: linux/amd64, linux/arm64 among others), the version beside it for the reader. The
  # chart renders repository:tag, so tag holds version@digest; deploy/k8s/check-image-digests.sh fails on an image
  # without one. The key does not end in "image", so the "# renovate:" line names the image for the custom manager.
  # renovate: datasource=docker depName=ghcr.io/external-secrets/external-secrets
  tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc

podLabels:
  # The controller reads the SecretStores and ExternalSecrets, writes the Secrets, and its kubernetes provider reads the
  # source Secrets, all through the API server: policy allow-kube-api of chart svp-cluster opens it to pods with this
  # label, and nothing else is open out of namespace external-secrets.
  svp-kube-api: allow

# Not measured yet: one controller caching the ExternalSecrets, the stores and the Secrets they manage, and the metadata
# of every Secret. The limit leaves room for the lists of a first sync; the RAM at rest of the GitOps path on the runner
# says whether to change them.
resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 192Mi}
