# Argo Rollouts on amd64 nodes (a Linux x86_64 host, such as a CI runner), read after argo-rollouts.yaml: that file
# pins the Gateway API traffic router plugin built for arm64, the nodes of a Mac, and the plugin is a native binary that
# the controller downloads and runs. With the arm64 binary on amd64 nodes the controller fails to start the plugin at
# every reconcile, before it scales a Rollout's ReplicaSet, so the gateway and the web client never get a pod.
# Helm replaces a list as a whole, so this list is the controller's plugin list on such nodes.
# Both paths read this file from archValues of deploy/argocd/apps/components.json: Argo CD on a cluster whose nodes run
# amd64 (value nodeArch of the root chart, set by deploy/k8s/gitops.sh), deploy/k8s/install.sh on the dev path.
# The asset of the same release as argo-rollouts.yaml's, which install.sh and `make helm-check` check: a new release
# changes both pins together. The sha256 was computed on the downloaded file and matches the asset digest GitHub shows
# (the release publishes no checksum file).
controller:
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.17.0/gatewayapi-plugin-linux-amd64
      sha256: 1904ca787d33107c140521899d61fff030ee75d99908bd175fca5a4647759061
