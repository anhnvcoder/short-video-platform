# Barman Cloud plugin v0.15.1 of CloudNativePG (chart https://cloudnative-pg.github.io/charts plugin-barman-cloud
# 0.8.1), release plugin-barman-cloud in namespace cnpg-system, wave 3 of deploy/argocd/apps/components.json
# (docs/adr/0020-reliability-stage6.md, section 5): after cert-manager (wave 0), which issues the mTLS certificates
# between the operator and the plugin from the chart's self-signed Issuer, and after the CloudNativePG operator (wave
# 2), in the operator's namespace as the plugin requires; before chart svp-data (wave 4), whose ObjectStore
# svp-pg-backup and Cluster svp-pg use it. The plugin streams the WAL and base backups of svp-pg to bucket pg-backups of
# the cluster's MinIO: Barman runs in a sidecar it injects into the Postgres pod (and into the recovery Job's pod), so
# the Postgres image stays the minimal one, which has no Barman. The chart's pod and the sidecar already meet Pod
# Security "restricted" (non-root, read-only root, drop ALL, seccomp RuntimeDefault).
#
# RBAC: the chart's own ClusterRole is kept. It reads, creates and deletes Secrets and creates Roles and RoleBindings in
# every namespace, and the plugin's manager builds its cache for the whole cluster with no flag to narrow it
# (internal/cnpgi/operator/manager.go of v0.15.1), so a Role per namespace, as chart svp-cluster renders for the
# CloudNativePG operator, would leave its informers failing on permissions. Whoever takes its token reads every Secret
# of the cluster, the JWT signing key of svp included: accepted for the one-person lab (threat model BAK-1, section 6);
# the cloud uses RDS backups, no plugin. make drill-k8s-threats prints this exception with its reason.
#
# Upgrading the chart or the plugin: read the release notes for RBAC, CRD and sidecar changes, take the digests of both
# images below from the registry (multi-arch index), check that the plugin still requires CloudNativePG at most at the
# version deploy/k8s/values/cloudnative-pg.yaml pins, and that its manager still caches cluster-wide (or narrow its RBAC
# if it no longer does).

replicaCount: 1

# The manager caches every Secret of the cluster (above), so memory grows with the cluster; the limit stops a leak
# before the node is short.
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# Both images by digest (multi-arch index: linux/amd64 and linux/arm64), the chart's appVersion beside it for the
# reader: a tag can be pushed again to other content, a digest cannot (docs/adr/0015-cicd-devsecops-stage5.md, section
# 8). The chart renders registry/repository:tag, so tag holds version@digest. The sidecar's goes into ConfigMap
# plugin-barman-cloud-config, from which the plugin injects it into the Postgres pods. repository and registry are the
# chart's defaults written out, so that Renovate's helm-values manager finds both pins (ADR-0015 section 10).
image:
  registry: ghcr.io
  repository: cloudnative-pg/plugin-barman-cloud
  tag: v0.15.1@sha256:c75acad19a36e8176cfe2885761ff1b836c6ef977d7257e298c99a28b5c302ef
sidecarImage:
  registry: ghcr.io
  repository: cloudnative-pg/plugin-barman-cloud-sidecar
  tag: v0.15.1@sha256:2287a793a804db751edd0d07d44cd549e357677e98a800eb12e2cf7c0d53f9b0
