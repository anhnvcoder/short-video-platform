# Pyroscope 2.4.0 (chart https://grafana.github.io/helm-charts pyroscope 2.4.0; compose runs 2.3.1 inside
# grafana/otel-lgtm), release pyroscope in namespace svp-obs, wave 3 of deploy/argocd/apps/components.json.
# One single-binary pod (-target=all) on a local
# volume. The five services but media-worker push profiles to http://pyroscope.svp-obs:4040, as in compose; Grafana
# reads there too.

pyroscope:
  # By digest (multi-arch index: linux/amd64 and linux/arm64), the chart's appVersion beside it for the reader: a tag
  # can be pushed again to other content, a digest cannot. The chart
  # renders repository:tag (Docker Hub implied), so tag holds version@digest; deploy/k8s/check-image-digests.sh fails
  # on an image without one. repository is the chart's default written out: Renovate's helm-values manager finds a pin
  # only as repository and tag under a key ending in "image", and updates both parts of tag.
  image:
    repository: grafana/pyroscope
    tag: 2.4.0@sha256:b7e62699a27463aa3533efe3f88c320da594da495731fd6eabca6f44f92cdd7b
  # The single binary finds its own metastore through the API server (-metastore.address=kubernetes:///..., Role
  # pyroscope-discovery of the chart): allow-kube-api of chart svp-cluster opens that egress for pods with this label
  # only. The chart puts these labels on every object it renders, the pod included.
  extraLabels:
    svp-kube-api: allow
  # The chart's default is debug.
  extraArgs:
    log.level: info
    # No usage reports to stats.grafana.org, as in compose.
    usage-stats.enabled: "false"
  # Profiles on the volume mounted at /data, as Pyroscope inside grafana/otel-lgtm keeps them in /data/pyroscope/shared.
  structuredConfig:
    storage:
      backend: filesystem
      filesystem:
        dir: /data/shared
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  # Pod Security "restricted" (the namespace rejects pods that do not meet it): the chart sets
  # neither seccomp nor a container securityContext. The image's user is 10001.
  podSecurityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  # With the root filesystem read-only, the compaction worker's scratch directory /tmp/pyroscope-compactor needs a
  # volume of its own (Pyroscope fails to start without it).
  extraVolumes:
    - name: tmp
      emptyDir:
        sizeLimit: 512Mi
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# The chart's Alloy agent scrapes pods for profiles and its pod does not pass Pod Security "restricted"; the services
# push their profiles themselves.
alloy:
  enabled: false
