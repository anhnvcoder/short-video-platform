# pnpm settings only: web/ is a single package, not a workspace.

# A version must be 3 days old before pnpm installs it (4320 minutes), the same wait as Renovate's minimumReleaseAge:
# most hijacked npm releases are found and pulled within that time.
minimumReleaseAge: 4320
# An install fails when a dependency has a lifecycle script nobody decided on in allowBuilds.
strictDepBuilds: true
# Refuse a version published with weaker provenance than an earlier one (lost trusted publishing is a takeover sign).
trustPolicy: no-downgrade
# Exact versions that look like a downgrade only because of publish order, each checked by hand:
trustPolicyExclude:
  # Backport of the ReDoS fix (CVE-2023-25883) to the 6.x line, published 2023-07-10 without provenance three days
  # after 7.5.4 had it; eslint-plugin-import (through eslint-config-next) asks for ^6.3.1.
  - semver@6.3.1
# A transitive dependency may come only from the registry, never from git or a tarball URL.
blockExoticSubdeps: true
# Lifecycle scripts, decided one by one; true only for a package that cannot work without its script.
allowBuilds:
  # Pulled in by next-intl (message extractor); its install script only builds from source when asked to, and the
  # prebuilt binary comes as an optional platform package.
  "@parcel/watcher": false
  # Pulled in by next-intl (message extractor); postinstall only checks the native binding, which comes as an optional
  # platform package.
  "@swc/core": false
  # Pulled in by the OTLP gRPC exporters (@grpc/proto-loader); postinstall only warns about a version scheme of the
  # package that depends on it.
  protobufjs: false
  # Pulled in by eslint-config-next (import resolver); postinstall only fetches the native binding when the optional
  # platform package is missing.
  unrs-resolver: false
# Optional dependencies never installed. sharp (with its ~18 MB of @img/sharp-libvips-* binaries) is next's image
# optimizer, which images.unoptimized in next.config.ts turns off; installed, it would still be traced into the
# standalone server of the image.
ignoredOptionalDependencies:
  - sharp
# Patched versions of packages that only @lhci/cli (make web-lighthouse) pulls in; none of them reaches the web image.
# @lhci/cli 0.15.1 is its latest release and pins lighthouse 12.6.1, so a newer parent cannot bring these in. Each is
# scoped to the parent that asks for it, so no other dependent moves with it. A key names the parent without a version:
# pnpm silently skips an override whose parent version no longer matches, so "parent@1.2.3>child" would lose the fix,
# with a green frozen install, on the next bump of that parent. The child carries the range of requests that no fixed
# release satisfies (pnpm applies the override when it overlaps what the parent asks for), so a later parent that asks
# for a line that has a fix resolves on its own and is never forced onto these versions.
overrides:
  # CVE-2022-25883 (ReDoS in new Range). lighthouse lists semver but never imports it, so the major does not matter:
  # this is the 7.x already in the tree (the 5.7.2 backport has no provenance after 7.5.4 had it, which trustPolicy
  # refuses, and an exception for a package nobody loads is not worth one). 6.3.1 and 7.5.2 fix the lines above 5.
  "lighthouse>semver@<6.0.0": 7.8.5
  # CVE-2026-44705, CVE-2025-54798 (path traversal, symlink write): fixed only on the 0.2 line. Both callers use only
  # fileSync({ postfix }) (lhci open) and tmpNameSync(options) (external-editor, behind lhci wizard), which 0.2 keeps.
  "@lhci/cli>tmp@<0.2.0": 0.2.7
  "external-editor>tmp@<0.2.0": 0.2.7
  # CVE-2026-41907 (out-of-range writes of v3, v5, v6 into a caller's buffer): no fix below 11; 11.1.1 is the fixed line
  # that still ships CommonJS for lhci's require('uuid'), and lhci calls only uuid.v4() (the flags file of collect).
  "@lhci/cli>uuid@<11.0.0": 11.1.1
