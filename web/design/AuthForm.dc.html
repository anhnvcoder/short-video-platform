<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="./svp-tokens.css"></helmet>
<div style="width:100%;height:100%;box-sizing:border-box;background:var(--surface);color:var(--foreground);font-family:var(--font-sans);display:flex;flex-direction:column">
<header style="height:56px;flex:none;display:flex;align-items:center;justify-content:center;position:relative">
<sc-if value="{{ showBack }}" hint-placeholder-val="{{ true }}"><button aria-label="Quay lại" style="position:absolute;left:4px;top:6px;width:44px;height:44px;border:0;border-radius:999px;background:none;color:var(--foreground);display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:var(--surface-hover)"><i class="icon-chevron-left" style="font-size:24px" aria-hidden="true"></i></button></sc-if>
<span style="font-weight:700;font-size:18px;letter-spacing:0.1em">SVP</span>
</header>
<div style="flex:1;width:100%;max-width:400px;margin:0 auto;box-sizing:border-box;padding:16px 24px 32px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;gap:8px"><h1 style="margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-0.01em">{{ title }}</h1><p style="margin:0;font-size:15px;line-height:1.5;color:var(--muted);text-wrap:pretty">{{ subtitle }}</p></div>

<sc-if value="{{ hasAlert }}"><div role="alert" style="display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:{{ alertBg }};font-size:14px;line-height:1.45"><i class="{{ alertIcon }}" style="font-size:20px;color:{{ alertColor }};flex:none" aria-hidden="true"></i><div style="display:flex;flex-direction:column;gap:2px"><strong style="font-weight:600">{{ alertTitle }}</strong><span style="color:var(--muted)">{{ alertBody }}</span></div></div></sc-if>

<div style="display:flex;flex-direction:column;gap:8px">
<label style="font-size:14px;font-weight:600">Email</label>
<div aria-invalid="{{ hasEmailError }}" style="height:48px;box-sizing:border-box;padding:0 14px;display:flex;align-items:center;border-radius:12px;background:var(--surface-raised);border:{{ emailBorder }};box-shadow:{{ emailRing }};opacity:{{ fieldOpacity }};font-size:16px;color:{{ emailColor }}"><sc-if value="{{ emailFocused }}"><span aria-hidden="true" style="width:1.5px;height:20px;background:var(--foreground);margin-right:2px"></span></sc-if>{{ emailText }}</div>
<sc-if value="{{ hasEmailError }}"><p style="margin:0;display:flex;gap:6px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--danger)"><i class="icon-circle-alert" style="font-size:16px;margin-top:2px" aria-hidden="true"></i><span>{{ emailError }}<sc-if value="{{ emailTaken }}"> <a href="#" style="color:inherit;font-weight:600">Đăng nhập</a></sc-if></span></p></sc-if>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label style="font-size:14px;font-weight:600">Mật khẩu</label>
<div aria-invalid="{{ hasPwError }}" style="height:48px;box-sizing:border-box;padding:0 2px 0 14px;display:flex;align-items:center;border-radius:12px;background:var(--surface-raised);border:{{ pwBorder }};opacity:{{ fieldOpacity }};font-size:16px;color:{{ pwColor }}"><span style="flex:1;letter-spacing:{{ pwSpacing }}">{{ pwText }}</span><button aria-label="Hiện mật khẩu" style="width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="color:var(--foreground)"><i class="icon-eye" style="font-size:20px" aria-hidden="true"></i></button></div>
<sc-if value="{{ hasPwError }}"><p style="margin:0;display:flex;gap:6px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--danger)"><i class="icon-circle-alert" style="font-size:16px;margin-top:2px" aria-hidden="true"></i><span>Mật khẩu cần ít nhất 8 ký tự.</span></p></sc-if>
<sc-if value="{{ showPwHint }}"><p style="margin:0;font-size:14px;line-height:1.4;color:var(--muted)">Ít nhất 8 ký tự.</p></sc-if>
</div>

<div style="margin-top:4px">
<sc-if value="{{ btnNormal }}" hint-placeholder-val="{{ true }}"><button style="width:100%;min-height:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-foreground);font:600 16px/1 var(--font-sans);cursor:pointer;transition:background 120ms" style-hover="background:var(--accent-hover)">{{ submitLabel }}</button></sc-if>
<sc-if value="{{ busy }}"><button aria-busy="true" disabled="" style="width:100%;min-height:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-foreground);font:600 16px/1 var(--font-sans);display:flex;align-items:center;justify-content:center;gap:10px;opacity:0.85"><i class="icon-loader-circle" style="font-size:20px;display:inline-block;animation:svp-spin 0.9s linear infinite" aria-hidden="true"></i>{{ busyLabel }}</button></sc-if>
<sc-if value="{{ limited }}"><button disabled="" style="width:100%;min-height:52px;border-radius:12px;border:1px solid var(--border);background:var(--surface-hover);color:var(--muted);font:600 16px/1 var(--font-sans);display:flex;align-items:center;justify-content:center;gap:10px;cursor:not-allowed"><i class="icon-timer" style="font-size:20px" aria-hidden="true"></i>Thử lại sau 42 giây</button></sc-if>
</div>
<p style="margin:0;text-align:center;font-size:15px;color:var(--muted)">{{ switchText }} <a href="#" style="font-weight:600;color:var(--accent-text);display:inline-block;padding:12px 4px">{{ switchLink }}</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;register&quot;],&quot;default&quot;:&quot;login&quot;,&quot;tsType&quot;:&quot;'login'|'register'&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;errors&quot;,&quot;submitting&quot;,&quot;wrong-creds&quot;,&quot;email-taken&quot;,&quot;rate-limited&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showBack&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const reg = (this.props.mode ?? 'login') === 'register';
    const s = this.props.state ?? 'default';
    const def = s === 'default';
    const emailErr = s === 'errors' ? 'Email không đúng định dạng, ví dụ ten@gmail.com.' : s === 'email-taken' ? 'Email này đã được dùng.' : '';
    const pwErr = s === 'errors';
    const busy = s === 'submitting', limited = s === 'rate-limited';
    const alert = s === 'wrong-creds' ? ['Email hoặc mật khẩu không đúng', 'Kiểm tra lại rồi thử lần nữa.', 'icon-circle-alert', 'var(--danger)', 'var(--danger-surface)']
      : limited ? ['Bạn đã thử quá nhiều lần', 'Thử lại sau 42 giây.', 'icon-timer', 'var(--warning)', 'var(--warning-surface)'] : null;
    const errB = '2px solid var(--danger)', okB = '1px solid var(--border-strong)';
    return {
      showBack: this.props.showBack ?? true,
      title: reg ? 'Tạo tài khoản' : 'Đăng nhập',
      subtitle: reg ? 'Chỉ cần email và mật khẩu để bắt đầu.' : 'Đăng nhập để thích video và theo dõi nhà sáng tạo.',
      hasAlert: !!alert, alertTitle: alert?.[0], alertBody: alert?.[1], alertIcon: alert?.[2], alertColor: alert?.[3], alertBg: alert?.[4],
      emailText: def ? 'ten@email.com' : s === 'errors' ? 'minhanh@gmail' : 'minhanh@gmail.com',
      emailColor: def ? 'var(--muted)' : 'var(--foreground)',
      emailFocused: def, emailRing: def ? '0 0 0 2px var(--surface), 0 0 0 4px var(--ring)' : 'none',
      emailBorder: emailErr ? errB : okB, hasEmailError: !!emailErr, emailError: emailErr, emailTaken: s === 'email-taken',
      pwText: def ? (reg ? 'Ít nhất 8 ký tự' : 'Nhập mật khẩu') : s === 'errors' ? '••••' : '••••••••••',
      pwColor: def ? 'var(--muted)' : 'var(--foreground)', pwSpacing: def ? 'normal' : '0.15em',
      pwBorder: pwErr ? errB : okB, hasPwError: pwErr, showPwHint: reg && !pwErr && !def,
      fieldOpacity: busy ? 0.6 : 1,
      btnNormal: !busy && !limited, busy, limited,
      submitLabel: reg ? 'Tạo tài khoản' : 'Đăng nhập',
      busyLabel: reg ? 'Đang tạo tài khoản…' : 'Đang đăng nhập…',
      switchText: reg ? 'Đã có tài khoản?' : 'Chưa có tài khoản?', switchLink: reg ? 'Đăng nhập' : 'Đăng ký'
    };
  }
}
</script>
</body>
</html>
