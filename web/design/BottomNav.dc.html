<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="./svp-tokens.css"></helmet>
<nav aria-label="Điều hướng chính" style="height:64px;box-sizing:border-box;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--border);font-family:var(--font-sans)">
<a href="#" aria-current="{{ homeCurrent }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:44px;text-decoration:none;color:{{ homeColor }};font-size:11px;font-weight:{{ homeWeight }}" style-hover="color:var(--foreground)"><i class="icon-house" style="font-size:24px" aria-hidden="true"></i><span>Trang chủ</span></a>
<a href="#" aria-current="{{ uploadCurrent }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:44px;text-decoration:none;color:{{ uploadColor }};font-size:11px;font-weight:{{ uploadWeight }}" style-hover="color:var(--foreground)"><span style="width:52px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-foreground);display:flex;align-items:center;justify-content:center"><i class="icon-plus" style="font-size:22px" aria-hidden="true"></i></span><span>Tải lên</span></a>
<a href="#" aria-current="{{ profileCurrent }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:44px;text-decoration:none;color:{{ profileColor }};font-size:11px;font-weight:{{ profileWeight }}" style-hover="color:var(--foreground)"><i class="icon-user" style="font-size:24px" aria-hidden="true"></i><span>Hồ sơ</span></a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;upload&quot;,&quot;profile&quot;,&quot;none&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'upload'|'profile'|'none'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const v = k => ({ c: a === k ? 'var(--foreground)' : 'var(--muted)', w: a === k ? 700 : 500, cur: a === k ? 'page' : undefined });
    const h = v('home'), u = v('upload'), p = v('profile');
    return { homeColor: h.c, homeWeight: h.w, homeCurrent: h.cur, uploadColor: u.c, uploadWeight: u.w, uploadCurrent: u.cur, profileColor: p.c, profileWeight: p.w, profileCurrent: p.cur };
  }
}
</script>
</body>
</html>
