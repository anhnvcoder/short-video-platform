<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="./svp-tokens.css"></helmet>
<div data-theme="dark" style="position:relative;width:100%;height:100%;display:flex;overflow:hidden;background:var(--surface);color:var(--foreground);font-family:var(--font-sans)">
<dc-import name="SidebarDesktop" active="home" guest="{{ guest }}" hint-size="248px,100%" style="flex:none;height:100%"></dc-import>
<main style="position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center">
<div role="tablist" aria-label="Chọn feed" style="height:68px;flex:none;display:flex;align-items:center;gap:4px">
<button role="tab" aria-selected="false" style="min-height:44px;padding:0 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:none;border:0;cursor:pointer;font:500 16px/1 var(--font-sans);color:var(--muted)" style-hover="color:var(--foreground)"><span>Đang theo dõi</span><span aria-hidden="true" style="width:20px;height:2px;opacity:0"></span></button>
<button role="tab" aria-selected="true" style="min-height:44px;padding:0 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:none;border:0;cursor:pointer;font:700 16px/1 var(--font-sans);color:var(--foreground)"><span>Khám phá</span><span aria-hidden="true" style="width:20px;height:2px;border-radius:2px;background:currentColor"></span></button>
</div>
<div style="display:flex;align-items:flex-end;gap:20px;padding-left:92px">
<div style="position:relative;width:452px;height:804px;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(135deg,oklch(0.31 0.035 50) 0 16px,oklch(0.27 0.035 50) 16px 32px);color:var(--on-media)">
<span aria-hidden="true" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:500 11px/1 var(--font-mono);color:oklch(1 0 0 / 0.5)">video 9:16</span>
<div aria-hidden="true" style="position:absolute;inset:auto 0 0 0;height:260px;background:linear-gradient(to top,oklch(0 0 0 / 0.8),oklch(0 0 0 / 0.45) 50%,oklch(0 0 0 / 0))"></div>
<div aria-hidden="true" style="position:absolute;inset:0 0 auto 0;height:100px;background:linear-gradient(to bottom,oklch(0 0 0 / 0.4),oklch(0 0 0 / 0))"></div>
<button aria-label="{{ muteLabel }}" style="position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:999px;border:0;background:oklch(0 0 0 / 0.35);color:var(--on-media);display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:oklch(0 0 0 / 0.55)"><i class="{{ muteIcon }}" style="font-size:20px" aria-hidden="true"></i></button>
<sc-if value="{{ paused }}"><div aria-hidden="true" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px"><span style="width:80px;height:80px;border-radius:999px;background:oklch(0 0 0 / 0.45);display:flex;align-items:center;justify-content:center"><i class="icon-play" style="font-size:36px;margin-left:4px"></i></span><span style="padding:6px 12px;border-radius:999px;background:oklch(0 0 0 / 0.55);font-size:13px;font-weight:500">Đã tạm dừng · Space để phát</span></div></sc-if>
<div style="position:absolute;left:20px;right:20px;bottom:22px;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 2px oklch(0 0 0 / 0.45)"><div style="display:flex;align-items:baseline;gap:6px"><a href="#" style="color:var(--on-media);text-decoration:none;font-size:16px;font-weight:600">Minh Anh</a><span style="font-size:14px;color:var(--on-media-muted)">@minhanh · 2 ngày</span></div><button aria-expanded="false" style="padding:0;border:0;background:none;text-align:left;color:var(--on-media);font:400 15px/1.45 var(--font-sans);cursor:pointer;text-shadow:inherit"><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">Chiều Hà Nội cuối thu, gió heo may về trên phố cổ. Đi bộ một vòng hồ Hoàn Kiếm lúc 5 giờ, ghé quán cà phê trứng quen rồi ngồi nhìn người qua lại đến khi lên đèn.</span><span style="font-weight:600;color:var(--on-media-muted)">Xem thêm</span></button></div>
<div role="slider" aria-label="Tua video" aria-valuemin="0" aria-valuemax="42" aria-valuenow="16" aria-valuetext="0:16 / 0:42" style="position:absolute;inset:auto 0 0 0;height:3px;background:oklch(1 0 0 / 0.25)"><div style="width:38%;height:100%;background:var(--on-media)"></div></div>
</div>
<div style="width:72px;display:flex;flex-direction:column;align-items:center;gap:18px;padding-bottom:4px">
<button aria-label="Theo dõi Minh Anh" style="position:relative;width:56px;height:64px;padding:0;border:0;background:none;cursor:pointer;display:flex;justify-content:center"><span aria-hidden="true" style="width:52px;height:52px;border-radius:999px;background:oklch(0.5 0.09 160);color:oklch(1 0 0);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600">M</span><span aria-hidden="true" style="position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:24px;height:24px;border-radius:999px;background:var(--accent);color:var(--accent-foreground);border:2px solid var(--surface);display:flex;align-items:center;justify-content:center"><i class="icon-plus" style="font-size:14px"></i></span></button>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><button aria-pressed="false" aria-label="Thích video" style="width:52px;height:52px;border-radius:999px;border:0;background:var(--surface-raised);color:var(--foreground);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:{{ likeRing }};transition:background 120ms" style-hover="background:var(--surface-hover)" style-active="transform:scale(0.92)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></button><span style="font-size:13px;font-weight:600">12,4 N</span></div>
<div role="img" aria-label="1,2 triệu lượt xem" style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--muted)"><i class="icon-eye" style="font-size:24px" aria-hidden="true"></i></span><span style="font-size:13px;font-weight:600">1,2 Tr</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><button aria-label="Sao chép liên kết chia sẻ" style="width:52px;height:52px;border-radius:999px;border:0;background:var(--surface-raised);color:var(--foreground);display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:var(--surface-hover)"><i class="icon-share" style="font-size:22px" aria-hidden="true"></i></button><span style="font-size:13px;font-weight:600">Chia sẻ</span></div>
</div>
</div>
<div style="position:absolute;right:32px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px">
<button aria-label="Video trước (↑)" style="width:48px;height:48px;border-radius:999px;border:1px solid var(--border);background:var(--surface-raised);color:var(--foreground);display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:var(--surface-hover)"><i class="icon-chevron-up" style="font-size:22px" aria-hidden="true"></i></button>
<button aria-label="Video tiếp theo (↓)" style="width:48px;height:48px;border-radius:999px;border:1px solid var(--border);background:var(--surface-raised);color:var(--foreground);display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:var(--surface-hover)"><i class="icon-chevron-down" style="font-size:22px" aria-hidden="true"></i></button>
</div>
<sc-if value="{{ paused }}"><div role="status" style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--surface-raised);border:1px solid var(--border);box-shadow:var(--shadow-raised);font-size:14px;white-space:nowrap"><i class="icon-link" style="font-size:18px;color:var(--success)" aria-hidden="true"></i>Đã sao chép liên kết.</div></sc-if>
</main>
<sc-if value="{{ prompt }}">
<div aria-hidden="true" style="position:absolute;inset:0;z-index:10;background:var(--overlay)"></div>
<div role="dialog" aria-modal="true" aria-label="Đăng nhập để thích video" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;width:420px;box-sizing:border-box;padding:28px;border-radius:24px;background:var(--surface-raised);box-shadow:var(--shadow-raised);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
<button aria-label="Đóng" style="position:absolute;right:10px;top:10px;width:44px;height:44px;border:0;border-radius:999px;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:var(--surface-hover);color:var(--foreground)"><i class="icon-x" style="font-size:20px" aria-hidden="true"></i></button>
<span style="width:56px;height:56px;border-radius:999px;background:color-mix(in oklch,var(--accent) 20%,transparent);color:var(--accent-text);display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></span>
<div style="display:flex;flex-direction:column;gap:6px"><h2 style="margin:0;font-size:20px;font-weight:700">Đăng nhập để thích video</h2><p style="margin:0;font-size:15px;line-height:1.5;color:var(--muted)">Có tài khoản SVP, bạn có thể thích video và theo dõi nhà sáng tạo.</p></div>
<div style="display:flex;flex-direction:column;gap:10px;width:100%">
<button style="min-height:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-foreground);font:600 16px/1 var(--font-sans);cursor:pointer;box-shadow:0 0 0 2px var(--surface-raised),0 0 0 4px var(--ring)">Đăng nhập</button>
<button style="min-height:52px;border-radius:12px;border:1px solid var(--border-strong);background:transparent;color:var(--foreground);font:600 16px/1 var(--font-sans);cursor:pointer" style-hover="background:var(--surface-hover)">Tạo tài khoản</button>
</div>
<span style="font-size:13px;color:var(--muted)">Nhấn <kbd style="font:500 12px var(--font-mono);padding:1px 6px;border-radius:5px;border:1px solid var(--border-strong)">Esc</kbd> để đóng</span>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;paused&quot;,&quot;guest-prompt&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;'default'|'paused'|'guest-prompt'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'default';
    const paused = s === 'paused';
    return {
      guest: s === 'guest-prompt', prompt: s === 'guest-prompt', paused,
      muteIcon: s === 'default' ? 'icon-volume-x' : 'icon-volume-2',
      muteLabel: s === 'default' ? 'Bật tiếng (M)' : 'Tắt tiếng (M)',
      likeRing: paused ? '0 0 0 2px var(--surface), 0 0 0 4px var(--ring)' : 'none'
    };
  }
}
</script>
</body>
</html>
