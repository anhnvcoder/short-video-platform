syntax = "proto3";

package svp.event.v1;

import "google/protobuf/timestamp.proto";

// EventMeta is the envelope shared by every event. It is field 1 of each
// per-topic wrapper message (for example svp.user.v1.FollowEvent).
//
// Only what every consumer needs lives here. Routing data stays outside the
// payload: the partition key is the Kafka record key, and trace context
// (`traceparent`, `tracestate`) travels in Kafka record headers following the
// OpenTelemetry convention.
message EventMeta {
  // Unique id of this event, a UUIDv7 in canonical lowercase form (36 chars).
  // Generated by the producer before the outbox row is committed, so a
  // redelivered event keeps the same id. Consumers deduplicate on it.
  string event_id = 1;

  // When the change happened at the producer (the transaction time), not
  // when the event was relayed to the broker.
  google.protobuf.Timestamp occurred_at = 2;
}
