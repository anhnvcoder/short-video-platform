syntax = "proto3";

package svp.user.v1;

import "google/protobuf/timestamp.proto";

// UserService owns accounts, password hashes and the follow graph.
//
// Caller identity: the gateway verifies the JWT and passes the authenticated
// user id in the gRPC metadata key `x-user-id`. Requests never carry the
// caller's own id, only ids of other entities. RPCs marked "requires caller"
// return UNAUTHENTICATED when `x-user-id` is missing or not a valid UUID.
//
// All ids are UUIDv7 strings in canonical lowercase form (36 chars).
service UserService {
  // Register creates an account. Does not require caller.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed email or password not meeting the policy.
  // - ALREADY_EXISTS: the email is already registered. This lets a client
  //   probe which emails are registered; accepted for the MVP and mitigated by
  //   rate limiting at the gateway.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login exchanges email and password for an access token and a refresh
  // token. Does not require caller. Every login starts a new refresh token
  // family: logging in on a second device does not end the first one's.
  //
  // Errors:
  // - UNAUTHENTICATED: unknown email or wrong password. Both cases return the
  //   same reason (`INVALID_CREDENTIALS`) and the same message: the gateway
  //   passes both to the client, so any difference would reveal whether the
  //   email exists.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Refresh exchanges a refresh token for a new access token and a new refresh
  // token of the same family (rotation). Does not require caller: the refresh
  // token is the credential. The presented token is used up; presenting a used
  // token again revokes its whole family, the token issued in its place
  // included, because either the client or someone who stole the token is
  // replaying it and the service cannot tell which (RFC 9700, section
  // 4.14.2). Two concurrent calls with the same token therefore end with one
  // success and a revoked family: a client must send one refresh at a time
  // per token and must not retry a call whose answer it did not get.
  //
  // Errors:
  // - UNAUTHENTICATED: the token is malformed, unknown, expired, revoked or
  //   already used. Every case returns the same reason
  //   (`INVALID_REFRESH_TOKEN`) and the same message, so the answer does not
  //   tell which tokens exist or what happened to them.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Logout revokes the family of refresh_token: no token of that login can be
  // refreshed again. Access tokens already issued stay valid until they
  // expire. Does not require caller. Idempotent: an unknown, malformed,
  // expired or already revoked token also succeeds, so the answer does not
  // tell which tokens exist.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Follow makes the caller follow followee_id. Requires caller. Idempotent:
  // following someone already followed succeeds and emits no new event.
  // A new edge emits user.followed on topic user.follows.v1.
  //
  // Errors:
  // - INVALID_ARGUMENT: followee_id is not a UUID, or equals the caller.
  // - NOT_FOUND: no user with followee_id.
  rpc Follow(FollowRequest) returns (FollowResponse);

  // Unfollow removes the follow edge from the caller to followee_id. Requires
  // caller. Idempotent: unfollowing someone not followed succeeds and emits no
  // event. A removed edge emits user.unfollowed on topic user.follows.v1.
  //
  // Errors:
  // - INVALID_ARGUMENT: followee_id is not a UUID.
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse);
}

message RegisterRequest {
  // Email address; compared case-insensitively.
  string email = 1;
  // Plain-text password, hashed by the service and never stored or logged.
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  // Signed JWT whose subject is the user id. The gateway verifies it with the
  // public key and does not call UserService per request.
  string access_token = 1;
  // When access_token stops being accepted.
  google.protobuf.Timestamp expires_at = 2;
  // Opaque refresh token (43 characters, base64url of 32 random bytes) that
  // starts a new family. The service stores only its SHA-256 hash.
  string refresh_token = 3;
  // When refresh_token stops being accepted (14 days after the login).
  google.protobuf.Timestamp refresh_expires_at = 4;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  // Signed JWT for the token's user, as in LoginResponse.
  string access_token = 1;
  // When access_token stops being accepted.
  google.protobuf.Timestamp expires_at = 2;
  // The refresh token that replaces the presented one, in the same family.
  string refresh_token = 3;
  // When refresh_token stops being accepted: 14 days after this call, but
  // never later than 30 days after the login that started the family.
  google.protobuf.Timestamp refresh_expires_at = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message FollowRequest {
  string followee_id = 1;
}

message FollowResponse {}

message UnfollowRequest {
  string followee_id = 1;
}

message UnfollowResponse {}
