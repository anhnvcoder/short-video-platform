syntax = "proto3";

package svp.user.v1;

import "google/protobuf/timestamp.proto";

// UserService owns accounts, password hashes, the follow graph and public
// profiles (handle and display name).
//
// Caller identity: the gateway verifies the JWT and passes the authenticated
// user id in the gRPC metadata key `x-user-id`. Requests never carry the
// caller's own id, only ids of other entities. RPCs marked "requires caller"
// return UNAUTHENTICATED when `x-user-id` is missing or not a valid UUID.
//
// All ids are UUIDv7 strings in canonical lowercase form (36 chars).
//
// A handle is unique and never changes. Its stored form matches
// `^[a-z][a-z0-9_]{2,29}$`. Input is normalized first: surrounding white
// space trimmed, and only ASCII `A`-`Z` lowered, so any other character
// makes it invalid. A handle the user picks must also not match
// `^u_[0-9a-f]{12}$`, the form the service generates (`u_` and the last 12
// hex digits of the user id, which are random), so a picked handle never
// collides with a generated one.
service UserService {
  // Register creates an account. Does not require caller. Checks email,
  // password, handle and display name, in that order, before hashing the
  // password, so bad input never costs a hash. Without a handle the service
  // generates one; if that one is taken (two generated handles collide), it
  // retries with a new user id, so a client that sends no handle never gets
  // a handle error.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed email (`INVALID_EMAIL`), password not
  //   meeting the policy (`INVALID_PASSWORD`), handle not of the picked form
  //   (`INVALID_HANDLE`), or display name breaking its rules
  //   (`INVALID_DISPLAY_NAME`).
  // - ALREADY_EXISTS: the email is already registered
  //   (`EMAIL_ALREADY_REGISTERED`), or the handle is taken
  //   (`HANDLE_ALREADY_TAKEN`). When both are, the reason is whichever the
  //   database reports first. This lets a client probe which emails and
  //   handles are registered: accepted for the MVP (handles are public
  //   anyway) and mitigated by rate limiting at the gateway.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login exchanges email and password for an access token and a refresh
  // token. Does not require caller. Every login starts a new refresh token
  // family: logging in on a second device does not end the first one's.
  //
  // Errors:
  // - UNAUTHENTICATED: unknown email or wrong password. Both cases return the
  //   same reason (`INVALID_CREDENTIALS`) and the same message: the gateway
  //   passes both to the client, so any difference would reveal whether the
  //   email exists.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Refresh exchanges a refresh token for a new access token and a new refresh
  // token of the same family (rotation). Does not require caller: the refresh
  // token is the credential. The presented token is used up; presenting a used
  // token again revokes its whole family, the token issued in its place
  // included, because either the client or someone who stole the token is
  // replaying it and the service cannot tell which (RFC 9700, section
  // 4.14.2). Two concurrent calls with the same token therefore end with one
  // success and a revoked family: a client must send one refresh at a time
  // per token and must not retry a call whose answer it did not get.
  //
  // Errors:
  // - UNAUTHENTICATED: the token is malformed, unknown, expired, revoked or
  //   already used. Every case returns the same reason
  //   (`INVALID_REFRESH_TOKEN`) and the same message, so the answer does not
  //   tell which tokens exist or what happened to them.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Logout revokes the family of refresh_token: no token of that login can be
  // refreshed again. Access tokens already issued stay valid until they
  // expire. Does not require caller. Idempotent: an unknown, malformed,
  // expired or already revoked token also succeeds, so the answer does not
  // tell which tokens exist.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Follow makes the caller follow followee_id. Requires caller. Idempotent:
  // following someone already followed succeeds and emits no new event.
  // A new edge emits user.followed on topic user.follows.v1.
  //
  // Errors:
  // - INVALID_ARGUMENT: followee_id is not a UUID, or equals the caller.
  // - NOT_FOUND: no user with followee_id.
  rpc Follow(FollowRequest) returns (FollowResponse);

  // Unfollow removes the follow edge from the caller to followee_id. Requires
  // caller. Idempotent: unfollowing someone not followed succeeds and emits no
  // event. A removed edge emits user.unfollowed on topic user.follows.v1.
  //
  // Errors:
  // - INVALID_ARGUMENT: followee_id is not a UUID.
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse);

  // GetProfiles returns the profiles of up to 50 users. Does not require
  // caller: profiles are public, and the gateway uses it for the authors of
  // the public share page too. Ids without a user are left out without an
  // error, a repeated id is answered once, and the order is unspecified:
  // match profiles by user_id. An empty list returns no profiles.
  //
  // Errors:
  // - INVALID_ARGUMENT: more than 50 ids (`TOO_MANY_USER_IDS`), or an id
  //   that is not a UUID (`INVALID_USER_ID`).
  rpc GetProfiles(GetProfilesRequest) returns (GetProfilesResponse);

  // GetProfileByHandle returns the profile with handle, and whether the
  // caller follows that user. Requires caller. The handle is normalized as on
  // Register (trimmed, ASCII `A`-`Z` lowered), so the lookup ignores case.
  //
  // Errors:
  // - NOT_FOUND: no user has the handle, or the input cannot be a handle at
  //   all (`USER_NOT_FOUND` for both, without reading the database for the
  //   latter).
  rpc GetProfileByHandle(GetProfileByHandleRequest) returns (GetProfileByHandleResponse);

  // UpdateDisplayName sets the caller's display name and returns the
  // caller's profile with it. Requires caller. Idempotent: setting the same
  // name again changes nothing. Emits no event: no service keeps a copy of
  // profiles.
  //
  // Errors:
  // - INVALID_ARGUMENT: display_name breaks its rules, an empty one included
  //   (`INVALID_DISPLAY_NAME`).
  // - NOT_FOUND: the caller's account no longer exists (`USER_NOT_FOUND`).
  rpc UpdateDisplayName(UpdateDisplayNameRequest) returns (UpdateDisplayNameResponse);
}

message RegisterRequest {
  // Email address; compared case-insensitively.
  string email = 1;
  // Plain-text password, hashed by the service and never stored or logged.
  string password = 2;
  // Optional handle the user picks; empty once trimmed means none, and the
  // service generates `u_` and the last 12 hex digits of the new user id.
  string handle = 3;
  // Optional display name; empty once trimmed means none, and it defaults to
  // the handle. See Profile.display_name for the rules.
  string display_name = 4;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  // Signed JWT whose subject is the user id. The gateway verifies it with the
  // public key and does not call UserService per request.
  string access_token = 1;
  // When access_token stops being accepted.
  google.protobuf.Timestamp expires_at = 2;
  // Opaque refresh token (43 characters, base64url of 32 random bytes) that
  // starts a new family. The service stores only its SHA-256 hash.
  string refresh_token = 3;
  // When refresh_token stops being accepted (14 days after the login).
  google.protobuf.Timestamp refresh_expires_at = 4;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  // Signed JWT for the token's user, as in LoginResponse.
  string access_token = 1;
  // When access_token stops being accepted.
  google.protobuf.Timestamp expires_at = 2;
  // The refresh token that replaces the presented one, in the same family.
  string refresh_token = 3;
  // When refresh_token stops being accepted: 14 days after this call, but
  // never later than 30 days after the login that started the family.
  google.protobuf.Timestamp refresh_expires_at = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message FollowRequest {
  string followee_id = 1;
}

message FollowResponse {}

message UnfollowRequest {
  string followee_id = 1;
}

message UnfollowResponse {}

// Profile is what anyone may see of a user. It never holds the email.
message Profile {
  string user_id = 1;
  // Unique, lowercase and never changed; see the service comment.
  string handle = 2;
  // 1 to 50 characters (Unicode code points) of valid UTF-8 once trimmed,
  // stored as given after trimming, never escaped: whoever displays it must
  // treat it as text. It holds none of these characters:
  // - control characters (general category Cc: U+0000-U+001F,
  //   U+007F-U+009F);
  // - the line and paragraph separators U+2028 and U+2029;
  // - format characters (general category Cf), among them the bidirectional
  //   formatting characters (U+061C, U+200E, U+200F, U+202A-U+202E,
  //   U+2066-U+2069), which could reorder the text shown after it, the
  //   invisible U+200B, U+2060 and U+FEFF, and the tag characters
  //   (U+E0001, U+E0020-U+E007F);
  // - the other default-ignorable code points (Unicode property
  //   Other_Default_Ignorable_Code_Point, such as the Hangul fillers U+115F,
  //   U+1160, U+3164, U+FFA0 and the combining grapheme joiner U+034F);
  // - the blank Braille pattern U+2800.
  // The zero width joiner U+200D and the variation selectors (Unicode
  // property Variation_Selector: U+180B-U+180D, U+180F, U+FE00-U+FE0F,
  // U+E0100-U+E01EF) are allowed, as emoji need them, but they are not
  // visible: the name must hold at least one character that is neither one
  // of them nor white space. The service does not normalize Unicode: clients
  // send NFC.
  string display_name = 3;
}

message GetProfilesRequest {
  // At most 50 ids.
  repeated string user_ids = 1;
}

message GetProfilesResponse {
  repeated Profile profiles = 1;
}

message GetProfileByHandleRequest {
  string handle = 1;
}

message GetProfileByHandleResponse {
  Profile profile = 1;
  // Whether the caller follows this user; false for the caller's own profile.
  bool followed_by_me = 2;
}

message UpdateDisplayNameRequest {
  // See Profile.display_name for the rules.
  string display_name = 1;
}

message UpdateDisplayNameResponse {
  Profile profile = 1;
}
