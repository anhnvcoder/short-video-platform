syntax = "proto3";

package svp.user.v1;

import "google/protobuf/timestamp.proto";

// UserService owns accounts, password hashes and the follow graph.
//
// Caller identity: the gateway verifies the JWT and passes the authenticated
// user id in the gRPC metadata key `x-user-id`. Requests never carry the
// caller's own id, only ids of other entities. RPCs marked "requires caller"
// return UNAUTHENTICATED when `x-user-id` is missing or not a valid UUID.
//
// All ids are UUIDv7 strings in canonical lowercase form (36 chars).
service UserService {
  // Register creates an account. Does not require caller.
  //
  // Errors:
  // - INVALID_ARGUMENT: malformed email or password not meeting the policy.
  // - ALREADY_EXISTS: the email is already registered. This lets a client
  //   probe which emails are registered; accepted for the MVP and mitigated by
  //   rate limiting at the gateway.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login exchanges email and password for an access token. Does not require
  // caller. There is no refresh token in the MVP: log in again after expiry.
  //
  // Errors:
  // - UNAUTHENTICATED: unknown email or wrong password. Both cases return the
  //   same reason (`INVALID_CREDENTIALS`) and the same message: the gateway
  //   passes both to the client, so any difference would reveal whether the
  //   email exists.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Follow makes the caller follow followee_id. Requires caller. Idempotent:
  // following someone already followed succeeds and emits no new event.
  // A new edge emits user.followed on topic user.follows.v1.
  //
  // Errors:
  // - INVALID_ARGUMENT: followee_id is not a UUID, or equals the caller.
  // - NOT_FOUND: no user with followee_id.
  rpc Follow(FollowRequest) returns (FollowResponse);

  // Unfollow removes the follow edge from the caller to followee_id. Requires
  // caller. Idempotent: unfollowing someone not followed succeeds and emits no
  // event. A removed edge emits user.unfollowed on topic user.follows.v1.
  //
  // Errors:
  // - INVALID_ARGUMENT: followee_id is not a UUID.
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse);
}

message RegisterRequest {
  // Email address; compared case-insensitively.
  string email = 1;
  // Plain-text password, hashed by the service and never stored or logged.
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  // Signed JWT whose subject is the user id. The gateway verifies it with the
  // public key and does not call UserService per request.
  string access_token = 1;
  // When access_token stops being accepted.
  google.protobuf.Timestamp expires_at = 2;
}

message FollowRequest {
  string followee_id = 1;
}

message FollowResponse {}

message UnfollowRequest {
  string followee_id = 1;
}

message UnfollowResponse {}
